<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自选股 · 智能参谋</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        /* ===== 全局重置 & 变量 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0b0d17;
            --bg-card: #13162b;
            --bg-card-hover: #1a1e3a;
            --border-color: rgba(255,255,255,0.06);
            --text-primary: #e8edf5;
            --text-secondary: #8e95b8;
            --text-muted: #5a6080;
            --accent: #6c7bff;
            --accent-glow: rgba(108, 123, 255, 0.2);
            --up: #ff4d6a;
            --down: #2ecc71;
            --radius: 16px;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 1200px;
            width: 100%;
        }

        /* ===== 顶部导航 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .brand h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .brand span {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-left: 4px;
            background: none;
            -webkit-text-fill-color: var(--text-secondary);
        }
        .header .info {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .header .info .time {
            font-weight: 500;
            color: var(--text-primary);
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ecc71;
            animation: pulse 2s infinite;
            margin-right: 4px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .countdown {
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* ===== Tabs ===== */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
        }
        .tab {
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }
        .tab:hover {
            color: var(--text-primary);
            background: rgba(255,255,255,0.04);
        }
        .tab.active {
            color: #fff;
            background: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .panel { display: none; }
        .panel.active { display: block; }

        /* ===== 添加栏 ===== */
        .add-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--bg-card);
            padding: 12px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .add-bar input {
            flex: 1;
            min-width: 180px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .add-bar input:focus {
            border-color: var(--accent);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .add-bar input::placeholder {
            color: var(--text-muted);
        }
        .add-bar button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .add-bar button:hover {
            background: #5a6bff;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .add-bar button:active { transform: scale(0.96); }
        .add-bar .hint {
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* ===== 自选股网格 ===== */
        .stock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        /* ===== 卡片 ===== */
        .stock-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 18px 20px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .stock-card:hover {
            transform: translateY(-4px);
            background: var(--bg-card-hover);
            border-color: rgba(108, 123, 255, 0.3);
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        .stock-card:active { transform: scale(0.97); }

        .stock-card .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .stock-card .name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }
        .stock-card .code {
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(255,255,255,0.04);
            padding: 2px 8px;
            border-radius: 20px;
            flex-shrink: 0;
        }
        .stock-card .price-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin: 4px 0 2px;
        }
        .stock-card .price {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
        }
        .stock-card .chg {
            font-size: 15px;
            font-weight: 600;
        }
        .up { color: var(--up); }
        .down { color: var(--down); }
        .flat { color: var(--text-muted); }

        .stock-card .signal-area {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .signal-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
        }
        .signal-badge.buy { background: rgba(255, 77, 106, 0.18); color: var(--up); }
        .signal-badge.sell { background: rgba(46, 204, 113, 0.18); color: var(--down); }
        .signal-badge.hold { background: rgba(255, 193, 7, 0.15); color: #ffc107; }
        .signal-badge.neutral { background: rgba(255,255,255,0.05); color: var(--text-secondary); }

        .stock-card .action-text {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .stock-card .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-muted);
        }
        .stock-card .update-time {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.fresh { background: #2ecc71; }
        .dot.stale { background: #f1c40f; }
        .dot.old { background: var(--up); }

        .stock-card .fresh-label {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* ===== ETF 面板 ===== */
        .index-strip {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 16px;
        }
        .index-item {
            flex-shrink: 0;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 12px 16px;
            min-width: 120px;
            border: 1px solid var(--border-color);
        }
        .index-item .i-name { font-size: 11px; color: var(--text-secondary); }
        .index-item .i-price { font-size: 16px; font-weight: 700; color: #fff; margin: 2px 0; }
        .index-item .i-chg { font-size: 13px; font-weight: 600; }

        .etf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }
        .etf-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.2s;
        }
        .etf-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(108,123,255,0.2);
        }
        .etf-card .top { display: flex; justify-content: space-between; }
        .etf-card .name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .etf-card .code { font-size: 10px; color: var(--text-muted); }
        .etf-card .idx { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
        .etf-card .price-row { display: flex; align-items: baseline; gap: 8px; margin: 4px 0; }
        .etf-card .price { font-size: 18px; font-weight: 700; color: #fff; }
        .etf-card .chg { font-size: 13px; font-weight: 600; }
        .etf-card .divider { height: 1px; background: var(--border-color); margin: 6px 0; }
        .etf-card .fund-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); }
        .etf-card .period-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
        .etf-card .period-row .tag { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.04); color: var(--text-muted); }
        .period-row .tag.up { color: var(--up); background: rgba(255,77,106,0.1); }
        .period-row .tag.down { color: var(--down); background: rgba(46,204,113,0.1); }

        /* ===== 底部 ===== */
        .footer {
            text-align: center;
            padding: 20px 0 8px;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            margin-top: 20px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 999;
            border: 1px solid var(--accent);
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            animation: fadeIn 0.3s ease;
            max-width: 90vw;
            text-align: center;
            backdrop-filter: blur(8px);
        }
        @keyframes fadeIn {
            from { opacity:0; transform: translateX(-50%) translateY(-10px); }
            to { opacity:1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .header { flex-direction: column; align-items: stretch; gap: 8px; }
            .header .info { justify-content: flex-end; }
            .stock-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .stock-card { padding: 14px; }
            .stock-card .price { font-size: 20px; }
            .add-bar input { min-width: 120px; }
            .etf-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 400px) {
            .stock-grid { grid-template-columns: 1fr 1fr; }
            .stock-card .price { font-size: 18px; }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- ===== 顶部导航 ===== -->
    <header class="header">
        <div class="brand">
            <h1>📊 自选股 <span>智能参谋</span></h1>
        </div>
        <div class="info">
            <span><span class="status-dot"></span><span class="time" id="updateTime">--</span></span>
            <span class="countdown" id="countdown">60s↻</span>
        </div>
    </header>

    <!-- ===== Tabs ===== -->
    <div class="tabs">
        <div class="tab active" data-tab="main">📈 自选股</div>
        <div class="tab" data-tab="etf">📊 宽基ETF</div>
    </div>

    <!-- ===== 自选股面板 ===== -->
    <div class="panel active" id="panel-main">
        <div class="add-bar">
            <input id="newStockInput" placeholder="输入代码或名称（如 600519 或 贵州茅台）" autocomplete="off">
            <button id="addBtn">➕ 添加</button>
            <div class="hint">支持沪深/北交所 · 输入名称或6位代码均可</div>
        </div>
        <div class="stock-grid" id="stockGrid"></div>
    </div>

    <!-- ===== ETF面板 ===== -->
    <div class="panel" id="panel-etf">
        <div class="index-strip" id="indexStrip"></div>
        <div class="etf-grid" id="etfGrid"></div>
    </div>

    <div class="footer">点击自选股查看详细分析 · 60秒自动刷新</div>
</div>

<script src="app.js"></script>
<script>
    // ============================================================
    // 首页逻辑（全新设计，功能保持）
    // ============================================================

    // ---------- 全局状态 ----------
    let stockDataMap = {};
    let countdownSec = 60;

    const DEFAULT_ETFS = [
        { name:'上证50ETF',   code:'510050', p:'1', idx:'上证50' },
        { name:'沪深300ETF',  code:'510300', p:'1', idx:'沪深300' },
        { name:'中证500ETF',  code:'510500', p:'1', idx:'中证500' },
        { name:'中证1000ETF', code:'512100', p:'1', idx:'中证1000' },
        { name:'创业板ETF',   code:'159915', p:'0', idx:'创业板指' },
        { name:'科创50ETF',   code:'588000', p:'1', idx:'科创50' },
    ];

    // ---------- 工具 ----------
    function toast(msg) {
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3000);
    }

    // ========== 报价接口（稳定JSON） ==========
    async function fetchQuotesBatch(codes) {
        if (!codes || codes.length === 0) return {};
        const BATCH_SIZE = 50;
        const batches = [];
        for (let i = 0; i < codes.length; i += BATCH_SIZE) {
            batches.push(codes.slice(i, i + BATCH_SIZE));
        }
        const results = {};
        await Promise.all(batches.map(async (batch) => {
            const url = `https://web.ifzq.gtimg.cn/appstock/app/quote/query?code=${batch.join(',')}`;
            try {
                const resp = await fetch(url, { signal: AbortSignal.timeout(6000) });
                const json = await resp.json();
                if (json.code !== 0) throw new Error('API error');
                for (const code of batch) {
                    const data = json.data[code];
                    if (data && data.qt && data.qt[code]) {
                        const qt = data.qt[code];
                        // 腾讯 quote/query JSON 接口字段顺序：
                        // [0]市场编号  [1]名称  [2]代码  [3]当前价  [4]涨跌额  [5]涨跌幅(%)  [6]成交量(手)  [7]成交额(元)  ...
                        results[code] = {
                            name: qt[1] || code,
                            price: parseFloat(qt[3]) || 0,
                            change: parseFloat(qt[4]) || 0,
                            changePercent: parseFloat(qt[5]) || 0,
                            volume: parseInt(qt[6]) || 0,
                            turnover: parseFloat(qt[7]) || 0,
                        };
                    }
                }
            } catch (e) {
                console.warn('报价JSON失败，回退文本', e);
                // 文本回退
                try {
                    const textResp = await fetch(`https://qt.gtimg.cn/q=${batch.join(',')}`, { signal: AbortSignal.timeout(6000) });
                    const text = await textResp.text();
                    const lines = text.split('\n').filter(l => l.trim());
                    for (const line of lines) {
                        const m = line.match(/v_([a-z]{2}\d{6})="(.+)"/);
                        if (!m) continue;
                        const code = m[1];
                        const f = m[2].split('~');
                        // 文本接口字段顺序同上：[0]市场编号 [1]名称 [2]代码 [3]当前价 [4]涨跌额 [5]涨跌幅 [6]成交量 [7]成交额
                        results[code] = {
                            name: f[1] || code,
                            price: parseFloat(f[3]) || 0,
                            change: parseFloat(f[4]) || 0,
                            changePercent: parseFloat(f[5]) || 0,
                            volume: parseInt(f[6]) || 0,
                            turnover: parseFloat(f[7]) || 0,
                        };
                    }
                } catch (e2) {}
            }
        }));
        return results;
    }

    async function getKLine(code, count = 120) {
        if (typeof window.fetchKLine === 'function') return await window.fetchKLine(code, count);
        return await fetchKLine(code, count);
    }

    // ---------- 刷新自选股 ----------
    async function refreshStocks() {
        const stocks = loadStocks();
        if (!stocks.length) {
            document.getElementById('stockGrid').innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:40px 0;">暂无自选股，请添加</div>`;
            return;
        }

        const codes = stocks.map(s => s.code);
        let quotes = {};
        try { quotes = await fetchQuotesBatch(codes); } catch (e) { console.warn(e); }

        for (const s of stocks) {
            const q = quotes[s.code];
            if (q && q.price > 0) {
                stockDataMap[s.code] = {
                    price: q.price,
                    change: q.change,
                    changePercent: q.changePercent,
                    volume: q.volume,
                    updateTime: Date.now(),
                    signal: stockDataMap[s.code]?.signal || '--',
                    action: stockDataMap[s.code]?.action || '',
                };
            } else if (!stockDataMap[s.code]) {
                stockDataMap[s.code] = { price: '--', change: 0, changePercent: 0, volume: 0, updateTime: Date.now(), signal: '--', action: '' };
            }
        }

        // 信号计算
        for (const s of stocks) {
            const data = stockDataMap[s.code];
            if (!data || data.price === '--') continue;
            try {
                const kline = await getKLine(s.code, 120);
                if (kline && kline.length > 60) {
                    const closes = kline.map(d => d.close);
                    const highs = kline.map(d => d.high);
                    const lows = kline.map(d => d.low);
                    const opens = kline.map(d => d.open);
                    const vols = kline.map(d => d.volume);
                    const prev = kline[kline.length - 2] || kline[kline.length - 1];
                    const pivots = calcPivots(prev.high, prev.low, prev.close);
                    const sig = summarize(closes, highs, lows, opens, vols, pivots);
                    data.signal = sig.overall;
                    data.action = sig.action;
                } else {
                    data.signal = '数据不足';
                    data.action = '';
                }
            } catch (e) {
                data.signal = '--';
                data.action = '计算失败';
            }
        }

        renderStockCards(stocks);
        updateTimeDisplay();
    }

    // ---------- 渲染卡片 ----------
    function renderStockCards(stocks) {
        const grid = document.getElementById('stockGrid');
        if (!stocks.length) {
            grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:40px 0;">暂无自选股</div>`;
            return;
        }

        let html = '';
        for (const s of stocks) {
            const d = stockDataMap[s.code] || {};
            const price = d.price ?? '--';
            const change = d.change ?? 0;
            const changePct = d.changePercent ?? 0;
            const signal = d.signal || '--';
            const action = d.action || '';
            const updateTime = d.updateTime ? formatTime(d.updateTime) : '--';
            const isFresh = d.updateTime && (Date.now() - d.updateTime < 5 * 60 * 1000);

            const priceDisplay = typeof price === 'number' ? price.toFixed(2) : price;
            const chgDisplay = typeof change === 'number' ? change.toFixed(2) : '0.00';
            const pctDisplay = typeof changePct === 'number' ? changePct.toFixed(2) : '0.00';
            const cls = change >= 0 ? 'up' : 'down';
            const sign = change >= 0 ? '+' : '';

            let badgeCls = 'neutral', badgeText = signal;
            if (['强力买入','买入','左侧试探'].includes(signal)) { badgeCls = 'buy'; badgeText = '买入'; }
            else if (['强力卖出','卖出','高空防守'].includes(signal)) { badgeCls = 'sell'; badgeText = '卖出'; }
            else if (['中性','观望'].includes(signal)) { badgeCls = 'hold'; badgeText = '持有'; }

            const dotCls = isFresh ? 'fresh' : (d.updateTime ? 'stale' : 'old');
            const actionShort = action.length > 28 ? action.slice(0, 26) + '…' : action;

            html += `
                <div class="stock-card" data-code="${s.code}">
                    <div class="top">
                        <span class="name">${s.name}</span>
                        <span class="code">${s.code.toUpperCase()}</span>
                    </div>
                    <div class="price-row">
                        <span class="price">${priceDisplay}</span>
                        <span class="chg ${cls}">${sign}${chgDisplay} (${sign}${pctDisplay}%)</span>
                    </div>
                    <div class="signal-area">
                        <span class="signal-badge ${badgeCls}">${badgeText}</span>
                        ${actionShort ? `<span class="action-text">${actionShort}</span>` : ''}
                    </div>
                    <div class="footer">
                        <span class="update-time">
                            <span class="dot ${dotCls}"></span>
                            更新于 ${updateTime}
                        </span>
                        <span class="fresh-label">${isFresh ? '✓ 最新' : '缓存'}</span>
                    </div>
                </div>
            `;
        }
        grid.innerHTML = html;

        grid.querySelectorAll('.stock-card').forEach(card => {
            card.addEventListener('click', () => {
                const code = card.dataset.code;
                if (code) location.href = `stock.html?code=${encodeURIComponent(code)}`;
            });
        });
    }

    // ---------- 添加逻辑（支持名称或代码） ----------
    document.getElementById('addBtn').addEventListener('click', () => {
        const input = document.getElementById('newStockInput').value.trim();
        if (!input) { toast('请输入股票名称或代码'); return; }

        if (/^\d{6}$/.test(input)) {
            const res = addStock(input);
            if (res.added) {
                toast(`✅ 已添加 ${res.list[0].name}`);
                document.getElementById('newStockInput').value = '';
                refreshStocks();
            } else {
                toast(res.reason === 'duplicate' ? '该股票已在自选' : '添加失败，请检查代码');
            }
            return;
        }

        // 名称匹配
        const allKnown = [...DEFAULT_STOCKS, ...loadStocks()];
        const unique = {};
        allKnown.forEach(s => unique[s.code] = s);
        const candidates = Object.values(unique).filter(s => s.name.includes(input));
        if (candidates.length === 0) {
            toast('未找到匹配的股票，请尝试输入6位代码');
            return;
        }
        if (candidates.length > 1) {
            toast(`找到多个匹配（${candidates.map(c=>c.name).join('、')}），请使用代码添加`);
            return;
        }
        const target = candidates[0];
        const res = addStock(target.code);
        if (res.added) {
            toast(`✅ 已添加 ${res.list[0].name}`);
            document.getElementById('newStockInput').value = '';
            refreshStocks();
        } else {
            toast(res.reason === 'duplicate' ? '该股票已在自选' : '添加失败');
        }
    });

    document.getElementById('newStockInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('addBtn').click();
    });

    // ---------- 工具函数 ----------
    function formatTime(ts) {
        const d = new Date(ts);
        return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }
    function updateTimeDisplay() {
        const now = new Date();
        document.getElementById('updateTime').textContent = now.toLocaleString('zh-CN', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
    }

    // ---------- Tab 切换 ----------
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
            if (tab.dataset.tab === 'etf') loadETFData();
        });
    });

    // ---------- ETF 数据 ----------
    const MARKET = [
        {name:'上证指数', c:'000001', p:'1'}, {name:'深证成指', c:'399001', p:'0'},
        {name:'创业板指', c:'399006', p:'0'}, {name:'科创50', c:'000688', p:'1'},
        {name:'沪深300', c:'000300', p:'1'}, {name:'中证500', c:'000905', p:'1'},
    ];
    let mq = {}, eq = {};

    async function loadETFData() {
        try {
            const mc = MARKET.map(i => (i.p === '1' ? 'sh' : 'sz') + i.c);
            const ec = allEtfs().map(e => e.code);
            const [mq_, eq_] = await Promise.all([fetchQuotesBatch(mc), fetchQuotesBatch(ec)]);
            mq = mq_; eq = eq_;
            renderIndexStrip();
            renderETFGrid();
        } catch(e) { console.warn('ETF数据加载失败', e); }
    }

    function renderIndexStrip() {
        const s = document.getElementById('indexStrip');
        s.innerHTML = '';
        MARKET.forEach(i => {
            const code = (i.p === '1' ? 'sh' : 'sz') + i.c;
            const d = mq[code];
            const div = document.createElement('div');
            div.className = 'index-item';
            if (d && d.price) {
                const cls = d.changePercent >= 0 ? 'up' : 'down';
                div.innerHTML = `<div class="i-name">${i.name}</div><div class="i-price">${d.price.toFixed(2)}</div><div class="i-chg ${cls}">${d.changePercent>=0?'▲':'▼'} ${d.changePercent.toFixed(2)}%</div>`;
            } else {
                div.innerHTML = `<div class="i-name">${i.name}</div><div class="i-price" style="color:#555">--</div><div class="i-chg flat">--</div>`;
            }
            s.appendChild(div);
        });
    }

    function renderETFGrid() {
        const g = document.getElementById('etfGrid');
        g.innerHTML = '';
        allEtfs().forEach(e => {
            const q = eq[e.code];
            const card = document.createElement('div');
            card.className = 'etf-card';
            let html = `<div class="top"><div><div class="name">${e.name}</div><div class="code">${e.code}</div></div></div>`;
            if (e.idx) html += `<div class="idx">📎 ${e.idx}</div>`;
            if (q && q.price != null) {
                const cls = q.changePercent >= 0 ? 'up' : 'down';
                html += `<div class="price-row"><span class="price">${q.price.toFixed(3)}</span><span class="chg ${cls}">${q.changePercent>=0?'▲':'▼'} ${q.changePercent.toFixed(2)}%</span></div>`;
            } else {
                html += `<div class="price-row"><span class="price" style="color:#555">--</span></div>`;
            }
            html += `<div class="divider"></div><div class="fund-row"><span class="l">💰 规模变动</span><span style="color:#555">--</span></div>`;
            html += `<div class="period-row"><span class="tag na">5日 --</span><span class="tag na">20日 --</span><span class="tag na">60日 --</span></div>`;
            card.innerHTML = html;
            g.appendChild(card);
            card.addEventListener('click', () => {
                location.href = `stock.html?code=${e.code}`;
            });
        });
    }

    function allEtfs() {
        try { return [...DEFAULT_ETFS, ...JSON.parse(localStorage.getItem('myEtfs')||'[]')]; } catch(e){ return DEFAULT_ETFS; }
    }

    // ---------- 定时器 ----------
    function updateCdown() {
        document.getElementById('countdown').textContent = countdownSec + 's↻';
    }
    setInterval(() => {
        countdownSec--;
        if (countdownSec <= 0) countdownSec = 60;
        updateCdown();
    }, 1000);

    // ---------- 初始化 ----------
    window.addEventListener('load', () => {
        refreshStocks();
        loadETFData();
        setInterval(refreshStocks, 60000);
        updateTimeDisplay();
    });
</script>
</body>
</html>
