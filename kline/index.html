<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自选股 · 智能参谋</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js">
    </script>
    <style>
        /* ===== 全局重置 & 变量 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            overflow-x: hidden;
            max-width: 100vw;
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            color: #1a202c;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 560px;
            width: 100%;
        }

        /* ===== 顶部导航 ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 14px 18px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
            gap: 10px;
        }
        .header .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .brand h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1a202c;
            letter-spacing: -0.3px;
        }
        .header .brand span {
            font-size: 13px;
            font-weight: 400;
            color: #718096;
            margin-left: 2px;
        }
        .header .info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: #718096;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .header .info .time {
            font-weight: 500;
            color: #2d3748;
            font-variant-numeric: tabular-nums;
        }
        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #38a169;
            animation: pulse 2s infinite;
            margin-right: 4px;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .countdown {
            background: #edf2f7;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 11px;
            color: #4a5568;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        /* ===== 指数 Ticker ===== */
        .ticker {
            flex: 1 1 140px;
            min-width: 100px;
            overflow: hidden;
            position: relative;
            height: 26px;
            display: flex;
            align-items: center;
            mask-image: linear-gradient(to right, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
        }
        .ticker:hover .ticker-track {
            animation-play-state: paused;
        }
        .ticker-track {
            display: flex;
            gap: 28px;
            white-space: nowrap;
            animation: ticker-scroll 45s linear infinite;
            will-change: transform;
        }
        @keyframes ticker-scroll {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-50%);
            }
        }
        .ticker-item {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            font-size: 12px;
            line-height: 1;
        }
        .ticker-item .t-name {
            color: #4a5568;
            font-weight: 500;
        }
        .ticker-item .t-price {
            color: #1a202c;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .ticker-item .t-pct {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .ticker-item.up .t-price,
        .ticker-item.up .t-pct {
            color: #e53e3e;
        }
        .ticker-item.down .t-price,
        .ticker-item.down .t-pct {
            color: #38a169;
        }
        .ticker-item.flat .t-price,
        .ticker-item.flat .t-pct {
            color: #a0aec0;
        }
        .ticker-loading {
            color: #a0aec0;
            font-size: 11px;
            padding: 0 20px;
        }

        /* ===== 添加栏 ===== */
        .add-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            background: #ffffff;
            padding: 12px 14px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
        }
        .add-bar input {
            flex: 1;
            min-width: 120px;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            color: #1a202c;
            outline: none;
            transition: 0.2s;
        }
        .add-bar input:focus {
            border-color: #3182ce;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }
        .add-bar input::placeholder {
            color: #a0aec0;
        }
        .add-bar button {
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
            background: #3182ce;
            color: #fff;
        }
        .add-bar button:hover {
            background: #2c5282;
        }
        .add-bar button:active {
            transform: scale(0.96);
        }
        .add-bar .btn-img {
            background: #edf2f7;
            color: #2d3748;
        }
        .add-bar .btn-img:hover {
            background: #e2e8f0;
        }
        .add-bar .hint {
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: #a0aec0;
            margin-top: 4px;
        }

        /* ===== 自选股卡片列表 ===== */
        .stock-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        /* 单个卡片 */
        .stock-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 14px 16px;
            transition: 0.15s;
            cursor: pointer;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .stock-card:active {
            transform: scale(0.99);
            background: #f7fafc;
        }
        .stock-card.deleting {
            background: rgba(229, 62, 62, 0.06);
        }
        .stock-card.removing {
            animation: slideOut 0.35s ease forwards;
        }
        @keyframes slideOut {
            to {
                opacity: 0;
                transform: translateX(-20px);
                max-height: 0;
                padding: 0 16px;
                margin: 0;
                border-width: 0;
                overflow: hidden;
            }
        }

        /* 卡片主行（名称/价格/涨跌） */
        .card-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .card-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }
        .card-left .name {
            font-size: 17px;
            font-weight: 700;
            color: #1a202c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-left .code {
            font-size: 11px;
            color: #a0aec0;
            font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace;
        }
        .card-price {
            text-align: right;
            font-size: 20px;
            font-weight: 700;
            color: #1a202c;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.3px;
            min-width: 70px;
        }
        .card-change {
            text-align: right;
            font-size: 15px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            min-width: 60px;
        }
        .up {
            color: #e53e3e;
        }
        .down {
            color: #38a169;
        }
        .flat {
            color: #a0aec0;
        }

        /* 信号行（标签+建议+置信度） */
        .card-signal {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        /* ---- 信号徽章颜色（由深到浅） ---- */
        .signal-badge {
            display: inline-block;
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.3px;
            background: #a0aec0; /* fallback */
        }
        /* 买入系（红） */
        .badge-strong-buy { background: #C53030; }  /* 深红 */
        .badge-buy        { background: #E53E3E; }  /* 红 */
        .badge-test       { background: #FC8181; }  /* 浅红 */
        .badge-oversold   { background: #FED7D7; color: #742A2A; } /* 粉红，文字深色 */
        /* 卖出系（绿） */
        .badge-strong-sell{ background: #276749; }  /* 深绿 */
        .badge-sell       { background: #38A169; }  /* 绿 */
        .badge-defend     { background: #68D391; }  /* 浅绿 */
        .badge-overbought { background: #C6F6D5; color: #234E52; } /* 粉绿，文字深色 */
        /* 中性 */
        .badge-hold       { background: #718096; }  /* 灰 */
        .badge-watch      { background: #CBD5E0; color: #2D3748; } /* 浅灰 */
        .badge-data       { background: #E2E8F0; color: #4A5568; }

        .signal-action {
            font-size: 12px;
            color: #4a5568;
            flex: 1;
            min-width: 80px;
        }
        .signal-confidence {
            font-size: 12px;
            color: #718096;
            font-weight: 500;
            white-space: nowrap;
        }

        /* 仓位进度条 */
        .position-bar-wrap {
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .position-bar-track {
            flex: 1;
            height: 4px;
            background: #edf2f7;
            border-radius: 4px;
            overflow: hidden;
        }
        .position-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
            background: #a0aec0;
        }
        .position-label {
            font-size: 11px;
            font-weight: 600;
            color: #4a5568;
            min-width: 44px;
            text-align: right;
        }

        /* 长按删除遮罩 */
        .hold-progress {
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: rgba(229, 62, 62, 0.06);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
            overflow: hidden;
        }
        .stock-card.deleting .hold-progress {
            opacity: 1;
        }
        .hold-progress::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background: #e53e3e;
            width: 0;
            transition: width 0.05s linear;
            border-radius: 0 0 16px 16px;
        }
        .stock-card.deleting .hold-progress::after {
            width: var(--progress, 0%);
        }
        .hold-progress .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e53e3e;
            font-size: 14px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.8);
            padding: 4px 16px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
        }

        /* 空状态 */
        .empty-tip {
            padding: 40px 14px;
            text-align: center;
            color: #a0aec0;
            font-size: 14px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        /* 列表头部（显示排序提示） */
        .list-head {
            display: grid;
            grid-template-columns: 1.6fr 1fr 0.9fr 0.9fr;
            gap: 8px;
            padding: 10px 14px;
            background: #f7fafc;
            border-radius: 12px 12px 0 0;
            font-size: 11px;
            color: #4a5568;
            font-weight: 600;
            letter-spacing: 0.04em;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 4px;
        }
        .list-head .h-name {
            cursor: pointer;
            user-select: none;
        }
        .list-head .h-price {
            cursor: pointer;
            user-select: none;
            text-align: right;
        }
        .list-head .h-pct {
            cursor: pointer;
            user-select: none;
            text-align: right;
        }
        .list-head .h-sig {
            cursor: pointer;
            user-select: none;
            text-align: center;
        }
        .list-head .h-name .arrow,
        .list-head .h-price .arrow,
        .list-head .h-pct .arrow,
        .list-head .h-sig .arrow {
            display: inline-block;
            margin-left: 2px;
            font-size: 10px;
            color: #a0aec0;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a202c;
            color: #fff;
            padding: 10px 22px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 999;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            animation: toastIn 0.3s ease;
            max-width: 90vw;
            text-align: center;
            font-weight: 500;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ===== OCR 覆盖层 ===== */
        .ocr-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.94);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            backdrop-filter: blur(6px);
        }
        .ocr-overlay .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-top-color: #3182ce;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .ocr-overlay .ocr-msg {
            color: #1a202c;
            font-size: 16px;
            font-weight: 600;
        }
        .ocr-overlay .ocr-sub {
            color: #718096;
            font-size: 13px;
            max-width: 80%;
            text-align: center;
        }
        .ocr-overlay button {
            margin-top: 8px;
            padding: 8px 24px;
            background: #fff;
            border: 1px solid #e2e8f0;
            color: #4a5568;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: 0.15s;
        }
        .ocr-overlay button:hover {
            background: #f7fafc;
        }

        /* ===== 底部 ===== */
        .footer {
            text-align: center;
            padding: 20px 0 8px;
            font-size: 11px;
            color: #a0aec0;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .header .info {
                justify-content: flex-end;
            }
            .add-bar input {
                min-width: 80px;
                font-size: 13px;
                padding: 8px 12px;
            }
            .add-bar button {
                padding: 8px 14px;
                font-size: 12px;
            }
            .stock-card {
                padding: 12px 14px;
            }
            .card-left .name {
                font-size: 15px;
            }
            .card-price {
                font-size: 17px;
                min-width: 60px;
            }
            .card-change {
                font-size: 13px;
                min-width: 50px;
            }
            .signal-badge {
                font-size: 11px;
                padding: 2px 12px;
            }
            .signal-action {
                font-size: 11px;
            }
            .list-head {
                font-size: 10px;
                padding: 8px 10px;
                grid-template-columns: 1.6fr 0.9fr 0.9fr 0.9fr;
            }
        }
    </style>
</head>
<body>
    <div class="app">

        <!-- ===== 顶部导航 ===== -->
        <header class="header">
            <div class="brand">
                <h1>📊 自选股 <span>智能参谋</span></h1>
            </div>
            <div class="info">
                <span id="updateTime" style="font-size:12px;color:#718096;"></span>
                <div class="ticker" id="marketTicker">
                    <div class="ticker-track" id="tickerTrack">
                        <div class="ticker-loading">主要指数加载…</div>
                    </div>
                </div>
                <span class="countdown" id="countdown">60s↻</span>
            </div>
        </header>

        <!-- ===== 添加栏 ===== -->
        <div class="add-bar">
            <input id="newStockInput" placeholder="代码或名称（如 600519 / 茅台）" autocomplete="off">
            <button id="addBtn">➕ 添加</button>
            <button id="ocrBtn" class="btn-img" title="从图片识别股票代码">📷 识别</button>
            <input type="file" id="ocrFile" accept="image/*" style="display:none">
            <div class="hint">支持沪深北 · 代码/名称均可 · 📷 识别持仓截图自动添加</div>
        </div>

        <!-- ===== 自选股列表（卡片） ===== -->
        <div id="stockList" class="stock-list"></div>

        <div class="footer">长按卡片可删除 · 60秒自动刷新</div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // 存储与默认数据
            // ============================================================
            const STORAGE_KEY = 'stocks_v1';
            const DEFAULT_STOCKS = [
                { code: 'sh600519', name: '贵州茅台', market: 'sh' },
                { code: 'sz000001', name: '平安银行', market: 'sz' },
                { code: 'sz300750', name: '宁德时代', market: 'sz' },
                { code: 'sh000001', name: '上证指数', market: 'sh' },
                { code: 'sz399001', name: '深证成指', market: 'sz' },
            ];

            function loadStocks() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return [...DEFAULT_STOCKS];
                    const list = JSON.parse(raw);
                    return list.length ? list : [...DEFAULT_STOCKS];
                } catch { return [...DEFAULT_STOCKS]; }
            }

            function saveStocks(list) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
            }

            function addStock(code) {
                const list = loadStocks();
                let c = code.toLowerCase().trim();
                if (/^\d{6}$/.test(c)) {
                    const head = c[0];
                    if (c.startsWith('000') || c.startsWith('6') || c.startsWith('9') || c.startsWith('5')) c = 'sh' + c;
                    else if (c.startsWith('399') || c.startsWith('1') || c.startsWith('0') || c.startsWith('3')) c = 'sz' + c;
                    else if (head === '4' || head === '8') c = 'bj' + c;
                    else c = 'sh' + c;
                } else if (!/^([a-z]{2,3})\d{6}$/.test(c)) {
                    return { list, added: false, reason: 'invalid' };
                }
                if (list.some(s => s.code === c)) return { list, added: false, reason: 'duplicate' };
                const m = c.startsWith('sh') ? 'sh' : c.startsWith('sz') ? 'sz' : 'bj';
                const num = c.replace(/^[a-z]+/, '');
                const h1 = num[0],
                    h2 = num[1];
                let type = 'stock';
                if (h1 === '5' && (h2 === '0' || h2 === '1' || h2 === '8')) type = 'etf';
                else if (h1 === '1' && h2 === '5') type = 'etf';
                else if (h1 === '1' && (h2 === '6' || h2 === '7')) type = 'lof';
                else if (h1 === '0' && h2 === '0' && m === 'sh') type = 'index';
                else if (h1 === '3' && h2 === '9' && m === 'sz') type = 'index';
                const name = c.toUpperCase();
                list.unshift({ code: c, name, market: m, type });
                saveStocks(list);
                return { list, added: true };
            }

            function removeStock(code) {
                const list = loadStocks().filter(s => s.code !== code);
                saveStocks(list);
                return list;
            }

            // ============================================================
            // 报价接口
            // ============================================================
            async function fetchQuotesBatch(codes) {
                if (!codes || codes.length === 0) return {};
                const BATCH_SIZE = 50;
                const batches = [];
                for (let i = 0; i < codes.length; i += BATCH_SIZE) batches.push(codes.slice(i, i + BATCH_SIZE));
                const results = {};
                await Promise.all(batches.map(async (batch) => {
                    const codeStr = batch.join(',');
                    const url = `https://qt.gtimg.cn/q=${codeStr}`;
                    try {
                        const text = await fetch(url, { signal: AbortSignal.timeout(6000) }).then(r => r.text());
                        const lines = text.split('\n').filter(l => l.trim());
                        for (const line of lines) {
                            const m = line.match(/v_([a-z]{2}\d{6})="(.+)"/);
                            if (!m) continue;
                            const code = m[1];
                            const f = m[2].split('~');
                            results[code] = {
                                name: f[1] || code,
                                price: parseFloat(f[3]) || 0,
                                change: parseFloat(f[31]) || 0,
                                changePercent: parseFloat(f[32]) || 0,
                                volume: parseInt(f[36]) || 0,
                                turnover: (parseFloat(f[37]) || 0) * 10000,
                            };
                        }
                    } catch (e) { console.warn('报价获取失败', e); }
                }));
                return results;
            }

            async function fetchKLine(code, count = 120) {
                if (typeof window.fetchKLine === 'function') return await window.fetchKLine(code, count);
                const url =
                    `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${encodeURIComponent(code)},day,,,${count},qfq`;
                const data = await (await fetch(url, { signal: AbortSignal.timeout(8000) })).json();
                const key = Object.keys(data.data)[0];
                const arr = (data.data[key] && (data.data[key].qfqday || data.data[key].day)) || [];
                return arr.map(row => ({
                    date: row[0],
                    open: +row[1],
                    close: +row[2],
                    high: +row[3],
                    low: +row[4],
                    volume: +row[5]
                })).filter(r => r.date && !isNaN(r.open));
            }

            // ============================================================
            // 全局状态
            // ============================================================
            let stockDataMap = {};
            let countdownSec = 60;
            let sortField = 'signal'; // 默认按信号排序
            let sortAsc = false; // 默认降序（买入优先）

            const MARKET = [
                { name: '上证指数', c: '000001', p: '1' },
                { name: '深证成指', c: '399001', p: '0' },
                { name: '创业板指', c: '399006', p: '0' },
                { name: '科创50', c: '000688', p: '1' },
                { name: '沪深300', c: '000300', p: '1' },
                { name: '中证500', c: '000905', p: '1' },
                { name: '北证50', c: '899050', p: '2' },
            ];
            let mq = {};

            function toFullCode(c) {
                return c.p === '0' ? 'sz' + c.c :
                    c.p === '2' ? 'bj' + c.c :
                    'sh' + c.c;
            }

            // ============================================================
            // 工具函数
            // ============================================================
            function toast(msg) {
                const el = document.createElement('div');
                el.className = 'toast';
                el.textContent = msg;
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 3000);
            }

            function updateTimeDisplay() {
                const now = new Date();
                const t = document.getElementById('updateTime');
                if (t) t.textContent = now.toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit',
                    hour12: false });
            }

            // ============================================================
            // ★★★ 增强版 simpleSignal（返回 position 和 confidence）★★★
            // ============================================================
            function simpleSignal(closes) {
                if (closes.length < 20) {
                    return { overall: '数据不足', action: '等待更多K线', position: 0, confidence: 0 };
                }
                const n = closes.length;
                const ma5 = closes.slice(-5).reduce((a, b) => a + b, 0) / 5;
                const ma20 = closes.slice(-20).reduce((a, b) => a + b, 0) / 20;
                const ma60 = closes.length >= 60 ? closes.slice(-60).reduce((a, b) => a + b, 0) / 60 : ma20;
                const last = closes[n - 1];
                const prev = closes[n - 2];
                const changePct = (last - prev) / prev * 100;
                const pct5 = (last - closes[n - 5]) / closes[n - 5] * 100;

                // 评分系统（多指标综合）
                let score = 0;
                if (last > ma5) score += 1.5;
                else score -= 1.5;
                if (last > ma20) score += 1.2;
                else score -= 1.2;
                if (last > ma60) score += 0.8;
                else score -= 0.8;
                if (ma5 > ma20) score += 0.5;
                else score -= 0.5;
                if (ma20 > ma60) score += 0.3;
                else score -= 0.3;
                if (changePct > 1) score += 0.5;
                else if (changePct < -1) score -= 0.5;
                if (pct5 > 3) score += 1;
                else if (pct5 < -3) score -= 1;

                // 映射到信号等级和仓位/置信度
                let overall, action, position, confidence;
                if (score >= 5) { overall = '强力买入';
                    action = '强势突破，积极跟进';
                    position = 85;
                    confidence = 90; } else if (score >= 3.5) { overall = '买入';
                    action = '趋势向好，分批建仓';
                    position = 65;
                    confidence = 75; } else if (score >= 2) { overall = '左侧试探';
                    action = '底部区域，轻仓试水';
                    position = 35;
                    confidence = 55; } else if (score >= 0.5) { overall = '超卖区';
                    action = '超跌反弹机会';
                    position = 20;
                    confidence = 40; } else if (score >= -0.5) { overall = '观望';
                    action = '等待方向明朗';
                    position = 0;
                    confidence = 30; } else if (score >= -2) { overall = '高空防守';
                    action = '高位滞涨，逐步减仓';
                    position = 25;
                    confidence = 50; } else if (score >= -3.5) { overall = '卖出';
                    action = '趋势走弱，果断减仓';
                    position = 50;
                    confidence = 70; } else { overall = '强力卖出';
                    action = '全面转空，清仓避险';
                    position = 75;
                    confidence = 85; }

                return { overall, action, position, confidence };
            }

            // ============================================================
            // 排序核心（按信号分组 + 仓位）
            // ============================================================
            function getSignalGroup(signal) {
                // 买入组（包含所有买入相关）
                const buySignals = ['强力买入', '买入', '左侧试探', '超卖区'];
                const sellSignals = ['强力卖出', '卖出', '高空防守', '超买区'];
                if (buySignals.includes(signal)) return 0;
                if (sellSignals.includes(signal)) return 2;
                return 1; // 观望
            }

            function sortStocks(stocks) {
                const sorted = [...stocks];
                sorted.sort((a, b) => {
                    const da = stockDataMap[a.code] || {};
                    const db = stockDataMap[b.code] || {};
                    let valA, valB;

                    switch (sortField) {
                        case 'name':
                            valA = a.name;
                            valB = b.name;
                            return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                        case 'price':
                            valA = da.price !== undefined ? da.price : -Infinity;
                            valB = db.price !== undefined ? db.price : -Infinity;
                            return sortAsc ? (valA - valB) : (valB - valA);
                        case 'changePercent':
                            valA = da.changePercent !== undefined ? da.changePercent : -Infinity;
                            valB = db.changePercent !== undefined ? db.changePercent : -Infinity;
                            return sortAsc ? (valA - valB) : (valB - valA);
                        case 'signal':
                        default:
                            const gA = getSignalGroup(da.signal || '中性');
                            const gB = getSignalGroup(db.signal || '中性');
                            if (gA !== gB) return gA - gB;
                            const posA = da.position || 0;
                            const posB = db.position || 0;
                            return posB - posA; // 仓位高优先
                    }
                });
                return sorted;
            }

            // ============================================================
            // 核心刷新与渲染
            // ============================================================
            async function refreshStocks() {
                const stocks = loadStocks();
                if (!stocks.length) {
                    document.getElementById('stockList').innerHTML =
                        `<div class="empty-tip">📭 暂无自选股，请添加</div>`;
                    return;
                }

                const codes = stocks.map(s => s.code);
                // 1. 批量实时报价
                let quotes = {};
                try { quotes = await fetchQuotesBatch(codes); } catch (e) { console.warn(e); }

                // 填充报价
                for (const s of stocks) {
                    const q = quotes[s.code];
                    if (q && q.price > 0) {
                        stockDataMap[s.code] = {
                            price: q.price,
                            change: q.change,
                            changePercent: q.changePercent,
                            volume: q.volume,
                            updateTime: Date.now(),
                            signal: stockDataMap[s.code]?.signal || '计算中…',
                            action: stockDataMap[s.code]?.action || '',
                            position: stockDataMap[s.code]?.position || 0,
                            confidence: stockDataMap[s.code]?.confidence || 0,
                        };
                    } else if (!stockDataMap[s.code]) {
                        stockDataMap[s.code] = { price: '--', change: 0, changePercent: 0, volume: 0, updateTime: Date.now(),
                            signal: '--', action: '', position: 0, confidence: 0 };
                    }
                }
                renderStockCards(stocks); // 首屏秒开（排序自动应用）

                // 2. 信号计算（异步分批）
                const needCalc = stocks.filter(s => stockDataMap[s.code]?.price !== '--');
                const CONCURRENCY = 3;
                for (let i = 0; i < needCalc.length; i += CONCURRENCY) {
                    const batch = needCalc.slice(i, i + CONCURRENCY);
                    await Promise.all(batch.map(async (s) => {
                        try {
                            let kline = null;
                            let fromCache = false;
                            try {
                                if (window.HistoryTable && typeof window.HistoryTable.getRecent ===
                                    'function') {
                                    const cached = window.HistoryTable.getRecent(s.code, 120);
                                    if (cached && cached.length >= 60) {
                                        kline = cached.map(r => ({
                                            date: r.date,
                                            open: r.open,
                                            high: r.high,
                                            low: r.low,
                                            close: r.close,
                                            volume: r.volume,
                                        }));
                                        fromCache = true;
                                    }
                                }
                            } catch (e) { /* ignore */ }

                            if (!kline || kline.length < 60) {
                                kline = await fetchKLine(s.code, 120);
                                fromCache = false;
                            }

                            if (kline && kline.length > 20) {
                                const closes = kline.map(d => d.close);
                                let sig;
                                if (typeof window.summarize === 'function') {
                                    // 如果外部有更专业的信号函数，优先使用
                                    const highs = kline.map(d => d.high);
                                    const lows = kline.map(d => d.low);
                                    const opens = kline.map(d => d.open);
                                    const vols = kline.map(d => d.volume);
                                    const prev = kline[kline.length - 2] || kline[kline.length - 1];
                                    let pivots = null;
                                    if (typeof window.calcPivots === 'function') {
                                        pivots = window.calcPivots(prev.high, prev.low, prev.close);
                                    }
                                    sig = window.summarize(closes, highs, lows, opens, vols, pivots);
                                } else {
                                    sig = simpleSignal(closes);
                                }
                                // 确保有 position 和 confidence
                                stockDataMap[s.code].signal = sig.overall || '中性';
                                stockDataMap[s.code].action = sig.action || '';
                                stockDataMap[s.code].position = sig.position || 0;
                                stockDataMap[s.code].confidence = sig.confidence || 0;
                                if (fromCache) stockDataMap[s.code].signal += '·';
                            } else {
                                stockDataMap[s.code].signal = '数据不足';
                                stockDataMap[s.code].action = 'K线不足';
                                stockDataMap[s.code].position = 0;
                                stockDataMap[s.code].confidence = 0;
                            }
                        } catch (e) {
                            console.warn(`信号计算失败 ${s.code}:`, e);
                            stockDataMap[s.code].signal = '计算失败';
                            stockDataMap[s.code].action = '请重试';
                            stockDataMap[s.code].position = 0;
                            stockDataMap[s.code].confidence = 0;
                        }
                    }));
                    renderStockCards(stocks);
                }
                updateTimeDisplay();
            }

            // ============================================================
            // 渲染卡片（含细分信号标签 + 仓位进度条）
            // ============================================================
            function renderStockCards(stocks) {
                const sorted = sortStocks(stocks);

                let html = `

                        <div class="h-price" data-sort="price">价格<span class="arrow">${sortField === 'price' ? (sortAsc ? '▲' : '▼') : '↕'}</span></div>
                        <div class="h-pct" data-sort="changePercent">涨跌<span class="arrow">${sortField === 'changePercent' ? (sortAsc ? '▲' : '▼') : '↕'}</span></div>

                        case '观望':

                            break;
                        case '持有':
                        case '中性':
                            badgeClass = 'badge-hold';
                            displayText = '持有';
                            break;
                        default:
                            badgeClass = 'badge-data';
                            displayText = signal;
                    }

                    // 仓位进度条颜色（根据信号倾向）
                    let posColor = '#a0aec0';
                    if (['强力买入', '买入', '左侧试探', '超卖区'].includes(signal)) {
                        posColor = '#e53e3e'; // 红色系
                    } else if (['强力卖出', '卖出', '高空防守', '超买区'].includes(signal)) {
                        posColor = '#38a169'; // 绿色系
                    }

                    html += `
                        <div class="stock-card" data-code="${s.code}">
                            <div class="hold-progress"><span class="progress-text">松开取消</span></div>
                            <div class="card-main">

                // 绑定点击卡片 -> 跳转详情
                container.querySelectorAll('.stock-card').forEach(card => {
                    card.addEventListener('click', () => {

                // 绑定长按删除
                bindLongPressDelete(container);

                // 绑定表头排序点击

            // 排序点击处理函数
            function handleSort(e) {
                const el = e.currentTarget;
                const field = el.dataset.sort;
                if (sortField === field) {
                    sortAsc = !sortAsc;
                } else {
                    sortField = field;
                    sortAsc = false;
                }
                refreshStocks();
            }

            // ============================================================
            // 长按删除
            // ============================================================
            function bindLongPressDelete(container) {
                const LONG_PRESS_MS = 700;
                const SCROLL_TOLERANCE = 10;

                container.querySelectorAll('.stock-card').forEach(card => {
                    let startX = 0,
                        startY = 0;
                    let progressEl = null;
                    let progressStart = 0;
                    let rafId = null;

                    const cancel = () => {
                        if (rafId) { cancelAnimationFrame(rafId);
                            rafId = null; }
                        card.classList.remove('deleting');
                        if (progressEl) progressEl.style.setProperty('--progress', '0%');
                    };

                    const animate = (timestamp) => {
                        if (!progressStart) progressStart = timestamp;
                        const elapsed = timestamp - progressStart;
                        const progress = Math.min(elapsed / LONG_PRESS_MS, 1);
                        if (progressEl) progressEl.style.setProperty('--progress', (progress * 100) + '%');
                        if (progress >= 1) {
                            rafId = null;
                            const code = card.dataset.code;
                            const name = card.querySelector('.name')?.textContent || code;
                            if (confirm(`🗑️ 删除自选股 "${name}" (${code.toUpperCase()})？`)) {
                                removeStock(code);
                                card.classList.add('removing');
                                setTimeout(() => refreshStocks(), 360);
                            } else {
                                cancel();
                            }
                        } else {
                            rafId = requestAnimationFrame(animate);
                        }
                    };

                    const start = (x, y) => {
                        if (card.classList.contains('removing')) return;
                        startX = x;
                        startY = y;
                        progressEl = card.querySelector('.hold-progress');
                        if (progressEl) progressEl.style.setProperty('--progress', '0%');
                        card.classList.add('deleting');
                        progressStart = 0;
                        rafId = requestAnimationFrame(animate);
                    };

                    // 触摸事件
                    card.addEventListener('touchstart', (e) => {
                        const t = e.touches[0];
                        start(t.clientX, t.clientY);
                    }, { passive: true });
                    card.addEventListener('touchmove', (e) => {
                        const t = e.touches[0];
                        if (Math.hypot(t.clientX - startX, t.clientY - startY) > SCROLL_TOLERANCE) {
                            cancel();
                        }
                    }, { passive: true });
                    card.addEventListener('touchend', cancel);
                    card.addEventListener('touchcancel', cancel);

                    // 鼠标事件
                    card.addEventListener('mousedown', (e) => {
                        if (e.button !== 0) return;
                        start(e.clientX, e.clientY);
                    });
                    card.addEventListener('mousemove', (e) => {
                        if (Math.hypot(e.clientX - startX, e.clientY - startY) > SCROLL_TOLERANCE) cancel();
                    });
                    card.addEventListener('mouseup', cancel);
                    card.addEventListener('mouseleave', cancel);
                });
            }

            // 添加逻辑（代码/名称/图片OCR）
            // ============================================================

                const res = addStock(target.code);
                if (res.added) {
                    toast(`✅ 已添加 ${res.list[0].name}`);
                    document.getElementById('newStockInput').value = '';

                } else {
                    toast(res.reason === 'duplicate' ? '该股票已在自选' : '添加失败');
                }

            document.getElementById('newStockInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') document.getElementById('addBtn').click();
            });

            // ============================================================
            // 图片 OCR 识别
            // ============================================================
            const ocrBtn = document.getElementById('ocrBtn');
            const ocrFile = document.getElementById('ocrFile');

            ocrBtn.addEventListener('click', () => {
                ocrFile.click();
            });

            let isOcrCanceled = false;

            ocrFile.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                e.target.value = '';

                const overlay = showOcrOverlay('正在识别图片…', '首次使用需下载 OCR 引擎，约 2MB');

                try {
                    if (typeof Tesseract === 'undefined') {
                        throw new Error('OCR 引擎未加载，请检查网络');
                    }

                    const { data: { text } } = await Tesseract.recognize(file, 'eng', {
                        logger: m => {
                            if (m.status === 'recognizing text') {
                                updateOcrOverlay(`识别中… ${Math.round(m.progress * 100)}%`, '');
                            } else if (m.status) {
                                updateOcrOverlay(m.status, '');
                            }
                        }
                    });

                    const codes = extractStockCodes(text);
                    if (codes.length === 0) {
                        updateOcrOverlay('❌ 未识别到有效股票代码', '请确保图片清晰且包含 6 位数字代码', true);
                        return;
                    }

                    updateOcrOverlay(`✅ 识别到 ${codes.length} 个代码`, codes.join(', '));
                    let addedCount = 0;
                    let dupCount = 0;
                    for (const code of codes) {
                        const res = addStock(code);
                        if (res.added) addedCount++;
                        else if (res.reason === 'duplicate') dupCount++;
                    }
                    const msg = `已添加 ${addedCount} 个` + (dupCount ? `（${dupCount} 个已存在）` : '');
                    setTimeout(() => {
                        hideOcrOverlay();
                        toast(msg);
                        refreshStocks();
                    }, 1200);
                } catch (err) {
                    console.error(err);
                    updateOcrOverlay('❌ 识别失败', err.message || '请重试', true);
                }
            });

            function extractStockCodes(text) {
                if (!text) return [];
                const normalized = text.replace(/[\s\n\r]+/g, ' ');
                const results = new Set();

                const prefixed = normalized.match(/\b([a-z]{2})\s*(\d{6})\b/gi) || [];
                for (const m of prefixed) {
                    const [, prefix, num] = m.match(/([a-z]{2})\s*(\d{6})/i);
                    const p = prefix.toLowerCase();
                    if (['sh', 'sz', 'bj'].includes(p)) results.add(p + num);
                }

                const plain = normalized.match(/\b(\d{6})\b/g) || [];
                for (const num of plain) {
                    if (/^[0-8]\d{5}$/.test(num)) results.add(num);
                }

                return Array.from(results).slice(0, 20);
            }

            function showOcrOverlay(msg, sub) {
                let ov = document.querySelector('.ocr-overlay');
                if (!ov) {
                    ov = document.createElement('div');
                    ov.className = 'ocr-overlay';
                    ov.innerHTML = `
                            <div class="spinner"></div>
                            <div class="ocr-msg"></div>
                            <div class="ocr-sub"></div>
                            <button class="ocr-cancel">取消</button>
                        `;
                    document.body.appendChild(ov);
                    ov.querySelector('.ocr-cancel').addEventListener('click', () => {
                        hideOcrOverlay();
                        isOcrCanceled = true;
                    });
                } else {
                    ov.querySelector('.spinner').style.display = '';
                }
                ov.querySelector('.ocr-msg').textContent = msg;
                ov.querySelector('.ocr-sub').textContent = sub || '';
                ov.querySelector('.ocr-cancel').textContent = '取消';
                ov.style.display = 'flex';
                isOcrCanceled = false;
                return ov;
            }

            function updateOcrOverlay(msg, sub, hideSpinner) {
                const ov = document.querySelector('.ocr-overlay');
                if (!ov) return;
                ov.querySelector('.ocr-msg').textContent = msg;
                ov.querySelector('.ocr-sub').textContent = sub || '';
                if (hideSpinner) ov.querySelector('.spinner').style.display = 'none';
            }

            function hideOcrOverlay() {
                const ov = document.querySelector('.ocr-overlay');
                if (ov) ov.style.display = 'none';
            }

            // ============================================================
            // 指数 ticker
            // ============================================================
            async function loadMarketData() {
                try {
                    const codes = MARKET.map(toFullCode);
                    mq = await fetchQuotesBatch(codes);
                    renderMarketTicker();
                } catch (e) { console.warn('指数加载失败', e); }
            }

            function renderMarketTicker() {
                const track = document.getElementById('tickerTrack');
                if (!track) return;
                const items = [];
                MARKET.forEach(i => {
                    const code = toFullCode(i);
                    const d = mq[code];
                    if (!d || !d.price) {
                        items.push(
                            `<span class="ticker-item flat"><span class="t-name">${i.name}</span><span class="t-price">--</span><span class="t-pct">--</span></span>`
                            );
                        return;
                    }
                    const cls = d.changePercent > 0 ? 'up' : (d.changePercent < 0 ? 'down' : 'flat');
                    const sign = d.changePercent > 0 ? '+' : '';
                    items.push(
                        `<span class="ticker-item ${cls}"><span class="t-name">${i.name}</span><span class="t-price">${d.price.toFixed(2)}</span><span class="t-pct">${sign}${d.changePercent.toFixed(2)}%</span></span>`
                        );
                });
                if (!items.length) { track.innerHTML = '<div class="ticker-loading">暂无指数数据</div>'; return; }
                track.innerHTML = items.join('') + items.join('');
            }

            // ============================================================
            // 定时器
            // ============================================================
            function updateCdown() {
                document.getElementById('countdown').textContent = countdownSec + 's↻';
            }
            setInterval(() => {
                countdownSec--;
                if (countdownSec <= 0) countdownSec = 60;
                updateCdown();
            }, 1000);

            // ============================================================
            // 错误兜底
            // ============================================================
            function _renderError(e) {
                try {
                    const el = document.getElementById('stockList');
                    if (el && !el.dataset.errored) {
                        el.dataset.errored = '1';
                        el.innerHTML = '<div style="padding:12px;background:#fff5f5;border:1px solid #feb2b2;border-radius:8px;color:#c53030;font-size:12px;font-family:monospace;white-space:pre-wrap;word-break:break-all;">⚠ JS 错误：' + (e?.message || e) + (e?.stack ? '\n' + e.stack.split('\n').slice(0,3).join('\n') : '') + '</div>';
                    }
                } catch {}
            }

            window.addEventListener('error', (ev) => _renderError(ev.error || ev.message));
            window.addEventListener('unhandledrejection', (ev) => _renderError(ev.reason));

            // ============================================================
            // 初始化
            // ============================================================
            window.addEventListener('load', () => {
                refreshStocks()
                    .catch(e => _renderError(e));
                loadMarketData();
                setInterval(() => refreshStocks().catch(e => _renderError(e)), 60000);
                setInterval(loadMarketData, 60000);
                updateTimeDisplay();
                setInterval(updateTimeDisplay, 1000);
            });
        })();
    </script>
</body>
</html>
