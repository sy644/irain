<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自选股 · 智能参谋</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js">
    </script>
    <style>
        /* ===== 全局样式（与之前相同，保留完整） ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            overflow-x: hidden;
            max-width: 100vw;
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            color: #1a202c;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 560px;
            width: 100%;
        }

        /* ===== 顶部导航 ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 14px 18px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
            gap: 10px;
        }
        .header .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .brand h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1a202c;
            letter-spacing: -0.3px;
        }
        .header .brand span {
            font-size: 13px;
            font-weight: 400;
            color: #718096;
            margin-left: 2px;
        }
        .header .info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: #718096;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .header .info .time {
            font-weight: 500;
            color: #2d3748;
            font-variant-numeric: tabular-nums;
        }
        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #38a169;
            animation: pulse 2s infinite;
            margin-right: 4px;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .countdown {
            background: #edf2f7;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 11px;
            color: #4a5568;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        /* ===== 指数 Ticker ===== */
        .ticker {
            flex: 1 1 140px;
            min-width: 100px;
            overflow: hidden;
            position: relative;
            height: 26px;
            display: flex;
            align-items: center;
            mask-image: linear-gradient(to right, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
        }
        .ticker:hover .ticker-track {
            animation-play-state: paused;
        }
        .ticker-track {
            display: flex;
            gap: 28px;
            white-space: nowrap;
            animation: ticker-scroll 45s linear infinite;
            will-change: transform;
        }
        @keyframes ticker-scroll {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-50%);
            }
        }
        .ticker-item {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            font-size: 12px;
            line-height: 1;
        }
        .ticker-item .t-name {
            color: #4a5568;
            font-weight: 500;
        }
        .ticker-item .t-price {
            color: #1a202c;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .ticker-item .t-pct {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .ticker-item.up .t-price,
        .ticker-item.up .t-pct {
            color: #e53e3e;
        }
        .ticker-item.down .t-price,
        .ticker-item.down .t-pct {
            color: #38a169;
        }
        .ticker-item.flat .t-price,
        .ticker-item.flat .t-pct {
            color: #a0aec0;
        }
        .ticker-loading {
            color: #a0aec0;
            font-size: 11px;
            padding: 0 20px;
        }

        /* ===== 添加栏 ===== */
        .add-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            background: #ffffff;
            padding: 12px 14px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
        }
        .add-bar input {
            flex: 1;
            min-width: 120px;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            color: #1a202c;
            outline: none;
            transition: 0.2s;
        }
        .add-bar input:focus {
            border-color: #3182ce;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }
        .add-bar input::placeholder {
            color: #a0aec0;
        }
        .add-bar button {
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
            background: #3182ce;
            color: #fff;
        }
        .add-bar button:hover {
            background: #2c5282;
        }
        .add-bar button:active {
            transform: scale(0.96);
        }
        .add-bar .btn-img {
            background: #edf2f7;
            color: #2d3748;
        }
        .add-bar .btn-img:hover {
            background: #e2e8f0;
        }
        .add-bar .hint {
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: #a0aec0;
            margin-top: 4px;
        }

        /* ============================================================
           持仓管理面板
           ============================================================ */
        .portfolio-panel {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
            overflow: hidden;
            transition: all 0.3s;
        }
        .portfolio-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .portfolio-panel .panel-header .title {
            font-weight: 700;
            font-size: 16px;
            color: #1a202c;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .portfolio-panel .panel-header .title .badge {
            font-size: 11px;
            font-weight: 600;
            background: #3182ce;
            color: #fff;
            padding: 1px 10px;
            border-radius: 30px;
        }
        .portfolio-panel .panel-header .toggle-icon {
            font-size: 18px;
            color: #a0aec0;
            transition: transform 0.3s;
        }
        .portfolio-panel .panel-header .toggle-icon.open {
            transform: rotate(180deg);
        }
        .portfolio-panel .panel-body {
            padding: 0 18px 18px;
            display: none;
        }
        .portfolio-panel .panel-body.open {
            display: block;
        }

        .risk-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            background: #f7fafc;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 14px;
        }
        .risk-overview .ro-item {
            text-align: center;
        }
        .risk-overview .ro-item .ro-label {
            font-size: 10px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .risk-overview .ro-item .ro-value {
            font-size: 16px;
            font-weight: 700;
            color: #1a202c;
            margin-top: 2px;
        }
        .risk-overview .ro-item .ro-value.good {
            color: #38a169;
        }
        .risk-overview .ro-item .ro-value.warn {
            color: #d69e2e;
        }
        .risk-overview .ro-item .ro-value.bad {
            color: #e53e3e;
        }
        .risk-overview .ro-item .ro-value .param-hint {
            font-size: 9px;
            color: #a0aec0;
            font-weight: 400;
        }
        .ro-item .cash-edit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .ro-item .cash-edit input {
            width: 80px;
            padding: 4px 6px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            background: #fff;
            color: #1a202c;
            outline: none;
            transition: 0.15s;
        }
        .ro-item .cash-edit input:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.12);
        }
        .ro-item .cash-edit .cash-save {
            background: #3182ce;
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }
        .ro-item .cash-edit .cash-save:hover {
            background: #2b6cb0;
        }

        .sector-allocation {
            background: #f7fafc;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .sector-allocation .sa-title {
            font-size: 12px;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }
        .sector-allocation .sa-title .sa-hint {
            font-weight: 400;
            color: #a0aec0;
            font-size: 10px;
        }
        .sector-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            font-size: 12px;
            border-bottom: 1px solid #edf2f7;
        }
        .sector-item:last-child {
            border-bottom: 0;
        }
        .sector-item .s-name {
            width: 70px;
            font-weight: 500;
            color: #2d3748;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sector-item .s-bar {
            flex: 1;
            height: 6px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
        }
        .sector-item .s-bar .s-fill {
            height: 100%;
            border-radius: 4px;
            background: #3182ce;
            transition: width 0.3s;
        }
        .sector-item .s-value {
            width: 60px;
            text-align: right;
            font-weight: 600;
            color: #1a202c;
            font-size: 11px;
        }
        .sector-empty {
            color: #a0aec0;
            font-size: 12px;
            text-align: center;
            padding: 10px 0;
        }

        .add-pos-form {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            background: #f7fafc;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 14px;
        }
        .add-pos-form select,
        .add-pos-form input {
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13px;
            background: #fff;
            color: #1a202c;
            outline: none;
            min-width: 0;
            flex: 1 1 80px;
        }
        .add-pos-form select:focus,
        .add-pos-form input:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.12);
        }
        .add-pos-form .btn-add-pos {
            background: #38a169;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.15s;
        }
        .add-pos-form .btn-add-pos:hover {
            background: #2f855a;
        }
        .add-pos-form .btn-add-pos:active {
            transform: scale(0.96);
        }
        .add-pos-form .hint-text {
            font-size: 11px;
            color: #a0aec0;
            width: 100%;
            text-align: center;
        }

        .pos-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .pos-item {
            display: grid;
            grid-template-columns: 1.8fr 0.9fr 0.9fr 0.9fr 0.9fr 0.7fr;
            gap: 6px;
            align-items: center;
            padding: 8px 12px;
            background: #f7fafc;
            border-radius: 10px;
            font-size: 12px;
            border: 1px solid transparent;
            transition: 0.15s;
        }
        .pos-item:hover {
            border-color: #e2e8f0;
        }
        .pos-item .pi-name {
            font-weight: 600;
            color: #1a202c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pos-item .pi-name .pi-code {
            font-weight: 400;
            color: #a0aec0;
            font-size: 10px;
            margin-left: 4px;
        }
        .pos-item .pi-shares {
            text-align: right;
            font-weight: 500;
        }
        .pos-item .pi-cost {
            text-align: right;
            color: #4a5568;
        }
        .pos-item .pi-price {
            text-align: right;
            font-weight: 500;
        }
        .pos-item .pi-pl {
            text-align: right;
            font-weight: 600;
        }
        .pos-item .pi-pl.up {
            color: #e53e3e;
        }
        .pos-item .pi-pl.down {
            color: #38a169;
        }
        .pos-item .pi-pl.flat {
            color: #a0aec0;
        }
        .pos-item .pi-action {
            text-align: right;
        }
        .pos-item .pi-action button {
            background: transparent;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: 0.15s;
        }
        .pos-item .pi-action button:hover {
            color: #e53e3e;
            background: rgba(229, 62, 62, 0.08);
        }
        .pos-item .pi-action .btn-edit {
            color: #3182ce;
            margin-right: 2px;
        }
        .pos-item .pi-action .btn-edit:hover {
            color: #2b6cb0;
            background: rgba(49, 130, 206, 0.08);
        }
        .pos-empty {
            text-align: center;
            color: #a0aec0;
            font-size: 13px;
            padding: 20px 0;
        }

        .pos-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 4px;
            font-size: 12px;
            color: #4a5568;
            border-top: 1px solid #edf2f7;
            margin-top: 8px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .pos-summary .ps-label {
            font-weight: 500;
        }
        .pos-summary .ps-value {
            font-weight: 600;
            color: #1a202c;
        }
        .pos-summary .ps-bar {
            flex: 1;
            min-width: 80px;
            height: 4px;
            background: #edf2f7;
            border-radius: 4px;
            overflow: hidden;
            margin: 0 8px;
        }
        .pos-summary .ps-bar .ps-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s;
            background: #3182ce;
        }
        .pos-summary .ps-bar .ps-fill.warn {
            background: #d69e2e;
        }
        .pos-summary .ps-bar .ps-fill.bad {
            background: #e53e3e;
        }

        /* ===== 自选股卡片列表 ===== */
        .stock-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stock-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 14px 16px;
            transition: 0.15s;
            cursor: pointer;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .stock-card:active {
            transform: scale(0.99);
            background: #f7fafc;
        }
        .stock-card.deleting {
            background: rgba(229, 62, 62, 0.06);
        }
        .stock-card.removing {
            animation: slideOut 0.35s ease forwards;
        }
        @keyframes slideOut {
            to {
                opacity: 0;
                transform: translateX(-20px);
                max-height: 0;
                padding: 0 16px;
                margin: 0;
                border-width: 0;
                overflow: hidden;
            }
        }

        .card-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .card-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }
        .card-left .name {
            font-size: 17px;
            font-weight: 700;
            color: #1a202c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-left .name .sector-tag {
            display: inline-block;
            font-size: 9px;
            font-weight: 600;
            background: #ebf8ff;
            color: #2b6cb0;
            padding: 0 8px;
            border-radius: 30px;
            margin-left: 6px;
            vertical-align: middle;
        }
        .card-left .code {
            font-size: 11px;
            color: #a0aec0;
            font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace;
        }
        .card-price-area {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .card-price {
            font-size: 20px;
            font-weight: 700;
            color: #1a202c;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.3px;
        }
        .card-change {
            font-size: 15px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .up {
            color: #e53e3e;
        }
        .down {
            color: #38a169;
        }
        .flat {
            color: #a0aec0;
        }

        .pos-detail {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 16px;
            font-size: 11px;
            color: #4a5568;
            padding: 4px 0 2px;
            border-top: 1px dashed #edf2f7;
            border-bottom: 1px dashed #edf2f7;
        }
        .pos-detail .pd-item {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .pos-detail .pd-item .pd-label {
            color: #a0aec0;
            font-weight: 400;
        }
        .pos-detail .pd-item .pd-value {
            font-weight: 600;
            color: #1a202c;
        }
        .pos-detail .pd-item .pd-value.up {
            color: #e53e3e;
        }
        .pos-detail .pd-item .pd-value.down {
            color: #38a169;
        }

        .tp-sl-info {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
            font-size: 10px;
            color: #718096;
            padding: 2px 0;
        }
        .tp-sl-info .ts-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .tp-sl-info .ts-item .ts-label {
            color: #a0aec0;
        }
        .tp-sl-info .ts-item .ts-value {
            font-weight: 600;
        }
        .tp-sl-info .ts-item .ts-value.bull {
            color: #e53e3e;
        }
        .tp-sl-info .ts-item .ts-value.bear {
            color: #38a169;
        }
        .tp-sl-detail {
            font-size: 9px;
            color: #a0aec0;
            text-align: right;
            line-height: 1.3;
        }

        .card-signal {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .signal-badge {
            display: inline-block;
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.3px;
            background: #a0aec0;
        }
        .badge-strong-buy {
            background: #C53030;
        }
        .badge-buy {
            background: #E53E3E;
        }
        .badge-test {
            background: #FC8181;
        }
        .badge-oversold {
            background: #FED7D7;
            color: #742A2A;
        }
        .badge-strong-sell {
            background: #276749;
        }
        .badge-sell {
            background: #38A169;
        }
        .badge-defend {
            background: #68D391;
        }
        .badge-overbought {
            background: #C6F6D5;
            color: #234E52;
        }
        .badge-hold {
            background: #718096;
        }
        .badge-watch {
            background: #CBD5E0;
            color: #2D3748;
        }
        .badge-data {
            background: #E2E8F0;
            color: #4A5568;
        }

        .signal-action {
            font-size: 12px;
            color: #4a5568;
            flex: 1;
            min-width: 80px;
        }
        .signal-confidence {
            font-size: 12px;
            color: #718096;
            font-weight: 500;
            white-space: nowrap;
        }

        .position-bar-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .position-bar-track {
            flex: 1;
            height: 4px;
            background: #edf2f7;
            border-radius: 4px;
            overflow: hidden;
        }
        .position-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
            background: #a0aec0;
        }
        .position-label {

    <script>
        // ============================================================
        // 0. 行业映射表（细化）
        // ============================================================
        const SECTOR_MAP = {
            'sh600519': '白酒',
            'sz000001': '银行',
            'sz300750': '新能源',
            'sh000001': '指数',
            'sz399001': '指数',

            'sz002966': '银行',

            'sh601997': '银行',
            'sz002936': '银行',
            'sz002948': '银行',
            'sh600928': '银行',
            'sz002958': '银行',

            'sz002602': '中小板',
            'sh601288': '银行',

            'sz300102': '科技',
            'sh000636': '指数',
            'sh600879': '军工',
            'sh600584': '科技',
            'sz301313': '传媒',
            'sh510300': '指数',
            'sh510050': '指数',
            'sz159919': '指数',
            'sh588000': '指数',
        };

        function getSector(code) {
            if (SECTOR_MAP[code]) return SECTOR_MAP[code];
            const num = code.replace(/^[a-z]+/, '');
            if (num.startsWith('000') || num.startsWith('600') || num.startsWith('601') || num.startsWith('603') || num
                .startsWith('605')) {
                if (num.startsWith('600') && !SECTOR_MAP[code]) return '综合';
                if (num.startsWith('000') && !SECTOR_MAP[code]) return '综合';
                return '综合';
            }
            if (num.startsWith('300') || num.startsWith('688')) return '科技';
            if (num.startsWith('002') || num.startsWith('003')) return '中小板';
            return '其他';
        }

        // ============================================================
        // 1. 持仓数据管理
        // ============================================================
        const PORTFOLIO_KEY = 'portfolio_v1';

        function loadPortfolio() {
            try {
                const raw = localStorage.getItem(PORTFOLIO_KEY);
                if (!raw) return { positions: [], cash: 100000, equity: 100000, peakEquity: 100000 };
                const p = JSON.parse(raw);
                if (!p.positions) p.positions = [];
                if (typeof p.cash !== 'number') p.cash = 100000;
                if (typeof p.equity !== 'number') p.equity = 100000;
                if (typeof p.peakEquity !== 'number') p.peakEquity = p.equity;
                return p;
            } catch { return { positions: [], cash: 100000, equity: 100000, peakEquity: 100000 }; }
        }

        function savePortfolio(portfolio) {
            localStorage.setItem(PORTFOLIO_KEY, JSON.stringify(portfolio));
        }

        function updateCash(newCash) {
            const portfolio = loadPortfolio();
            if (newCash < 0) return false;
            portfolio.cash = newCash;
            portfolio.equity = portfolio.positions.reduce((s, p) => s + (p.marketValue || 0), 0) + newCash;
            if (portfolio.equity > portfolio.peakEquity) portfolio.peakEquity = portfolio.equity;
            savePortfolio(portfolio);
            return true;
        }

        function getCurrentPrice(code) {
            if (window.stockDataMap && window.stockDataMap[code] && window.stockDataMap[code].price) {
                return window.stockDataMap[code].price;
            }
            return null;
        }

        function refreshPortfolioPrices() {
            const portfolio = loadPortfolio();
            const stocks = window.loadStocks ? window.loadStocks() : [];
            let totalMv = 0;
            for (const pos of portfolio.positions) {
                let price = getCurrentPrice(pos.code);
                if (!price) {
                    const s = stocks.find(st => st.code === pos.code);
                    if (s && window.stockDataMap && window.stockDataMap[s.code]) {
                        price = window.stockDataMap[s.code].price;
                    }
                }
                if (price && price > 0) {
                    pos.currentPrice = price;
                    pos.marketValue = pos.shares * price;
                    pos.profit = pos.marketValue - pos.shares * pos.avgCost;
                    pos.profitPct = pos.avgCost > 0 ? (pos.profit / (pos.shares * pos.avgCost)) * 100 : 0;
                } else {
                    pos.currentPrice = pos.avgCost || 0;
                    pos.marketValue = pos.shares * pos.avgCost || 0;
                    pos.profit = 0;
                    pos.profitPct = 0;
                }
                totalMv += pos.marketValue || 0;
            }
            portfolio.equity = totalMv + portfolio.cash;
            if (portfolio.equity > portfolio.peakEquity) {
                portfolio.peakEquity = portfolio.equity;
            }
            savePortfolio(portfolio);
            return portfolio;
        }

        function addPosition(code, shares, avgCost, stopLoss) {
            if (!code || !shares || shares <= 0 || !avgCost || avgCost <= 0) {
                return { success: false, message: '请填写完整信息' };
            }
            const portfolio = loadPortfolio();
            const existing = portfolio.positions.find(p => p.code === code);
            if (existing) {
                const totalShares = existing.shares + shares;
                const totalCost = existing.shares * existing.avgCost + shares * avgCost;
                existing.shares = totalShares;
                existing.avgCost = totalCost / totalShares;
                if (stopLoss && stopLoss > 0) existing.stopLoss = stopLoss;
                if (!existing.highWater) existing.highWater = existing.avgCost;
            } else {
                portfolio.positions.push({
                    code,
                    shares,
                    avgCost,
                    stopLoss: stopLoss || 0,
                    highWater: avgCost,
                    currentPrice: avgCost,
                    marketValue: shares * avgCost,
                    profit: 0,
                    profitPct: 0,
                });
            }
            savePortfolio(portfolio);
            refreshPortfolioPrices();
            return { success: true, portfolio };
        }

        function updatePosition(code, shares, avgCost, stopLoss) {
            const portfolio = loadPortfolio();
            const pos = portfolio.positions.find(p => p.code === code);
            if (!pos) return { success: false, message: '持仓不存在' };
            if (shares && shares > 0) pos.shares = shares;
            if (avgCost && avgCost > 0) pos.avgCost = avgCost;
            if (stopLoss !== undefined) pos.stopLoss = stopLoss;
            if (!pos.highWater) pos.highWater = pos.avgCost;
            savePortfolio(portfolio);
            refreshPortfolioPrices();
            return { success: true, portfolio };
        }

        function removePosition(code) {
            const portfolio = loadPortfolio();
            portfolio.positions = portfolio.positions.filter(p => p.code !== code);
            savePortfolio(portfolio);
            refreshPortfolioPrices();
            return portfolio;
        }

        function calcPortfolioStats(portfolio) {
            const totalMv = portfolio.positions.reduce((s, p) => s + (p.marketValue || 0), 0);
            const equity = totalMv + portfolio.cash;
            const totalPosPct = equity > 0 ? (totalMv / equity) * 100 : 0;
            const drawdown = portfolio.peakEquity > 0 ? ((portfolio.peakEquity - equity) / portfolio.peakEquity) * 100 : 0;
            const stats = {
                totalMv,
                equity,
                cash: portfolio.cash,
                peakEquity: portfolio.peakEquity,
                totalPosPct,
                drawdown,
                positionCount: portfolio.positions.length,
                maxSinglePct: 0,
                maxSingleCode: null,
            };
            for (const p of portfolio.positions) {
                const pct = equity > 0 ? ((p.marketValue || 0) / equity) * 100 : 0;
                if (pct > stats.maxSinglePct) {
                    stats.maxSinglePct = pct;
                    stats.maxSingleCode = p.code;
                }
            }
            return stats;
        }

        function getRiskAdvice(portfolio, limits) {
            const stats = calcPortfolioStats(portfolio);
            const advices = [];
            const warnings = [];
            const blocks = [];
            const maxTotal = limits.maxTotalPosition * 100;
            if (stats.totalPosPct > maxTotal) {
                warnings.push(`总仓位 ${stats.totalPosPct.toFixed(0)}% 超过上限 ${maxTotal.toFixed(0)}%，建议减仓`);
            } else if (stats.totalPosPct > maxTotal * 0.85) {
                advices.push(`总仓位 ${stats.totalPosPct.toFixed(0)}% 接近上限 ${maxTotal.toFixed(0)}%，谨慎加仓`);
            }
            const maxSingle = limits.maxSinglePosition * 100;
            if (stats.maxSinglePct > maxSingle) {
                warnings.push(`单标 ${stats.maxSingleCode} 仓位 ${stats.maxSinglePct.toFixed(0)}% 超过上限 ${maxSingle.toFixed(0)}%，建议减仓`);
            }
            if (stats.drawdown > limits.maxDrawdown * 100) {
                blocks.push(`账户回撤 ${stats.drawdown.toFixed(1)}% 超过熔断线 ${(limits.maxDrawdown*100).toFixed(0)}%，强制清仓`);
            } else if (stats.drawdown > limits.maxDrawdown * 100 * 0.7) {
                warnings.push(`账户回撤 ${stats.drawdown.toFixed(1)}%，接近熔断线，注意风险`);
            }
            const cashPct = stats.equity > 0 ? (stats.cash / stats.equity) * 100 : 0;
            const minCash = limits.minCashReserve * 100;
            if (cashPct < minCash) {
                warnings.push(`现金比例 ${cashPct.toFixed(0)}% 低于保留线 ${minCash.toFixed(0)}%，建议补充现金`);
            }
            for (const p of portfolio.positions) {
                if (p.stopLoss && p.stopLoss > 0 && p.currentPrice && p.currentPrice <= p.stopLoss) {
                    const lossPct = ((p.currentPrice - p.stopLoss) / p.currentPrice) * 100;
                    warnings.push(`${p.code} 触发止损线 (现价 ${p.currentPrice.toFixed(2)} ≤ 止损 ${p.stopLoss.toFixed(2)})，建议执行止损`);
                }
            }
            return {
                stats,
                advices,
                warnings,
                blocks,
                isBlocked: blocks.length > 0,
                riskLevel: blocks.length > 0 ? 'CRITICAL' : warnings.length > 2 ? 'HIGH' : warnings.length > 0 ? 'MEDIUM' :
                    'LOW',
            };
        }

        // ============================================================

        function calcSectorAllocation(portfolio) {
            const sectorMap = {};
            let totalValue = 0;
            for (const pos of portfolio.positions) {
                const mv = pos.marketValue || 0;
                if (mv <= 0) continue;
                const sector = getSector(pos.code);
                if (!sectorMap[sector]) sectorMap[sector] = 0;
                sectorMap[sector] += mv;
                totalValue += mv;
            }
            if (totalValue === 0) return { sectors: [], totalValue: 0 };
            const sorted = Object.entries(sectorMap)
                .map(([name, value]) => ({ name, value, pct: (value / totalValue) * 100 }))
                .sort((a, b) => b.value - a.value);
            return { sectors: sorted, totalValue };
        }

        // ============================================================
        // 6. K线获取（双源）
        // ============================================================
        async function fetchKLine(code, count = 120) {
            try {
                if (window.HistoryTable && typeof window.HistoryTable.getRecent === 'function') {
                    const cached = window.HistoryTable.getRecent(code, count);
                    if (cached && cached.length >= 60) {
                        return cached.map(r => ({
                            date: r.date,
                            open: r.open,
                            close: r.close,
                            high: r.high,
                            low: r.low,
                            volume: r.volume,
                        }));
                    }
                }
            } catch (e) { /* 忽略 */ }

            const url =
                `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${encodeURIComponent(code)},day,,,${count},qfq`;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 6000);

            try {
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timeout);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                if (data.code !== 0) throw new Error('接口返回错误');
                const key = Object.keys(data.data)[0];
                const arr = (data.data[key] && (data.data[key].qfqday || data.data[key].day)) || [];
                if (!arr.length) throw new Error('无数据');
                const result = arr.map(row => ({
                    date: row[0],
                    open: +row[1],
                    close: +row[2],
                    high: +row[3],
                    low: +row[4],
                    volume: +row[5],
                })).filter(r => r.date && !isNaN(r.open));
                return result;
            } catch (err) {
                clearTimeout(timeout);
                try {
                    const backupUrl =
                        `https://quotes.sina.cn/cn/api/json_v2.php/IFengService.getKLineData?symbol=${code}&scale=240&ma=no&datalen=${count}`;
                    const res2 = await fetch(backupUrl, { signal: AbortSignal.timeout(5000) });
                    if (!res2.ok) throw new Error('备用接口失败');
                    const data2 = await res2.json();
                    if (!data2 || !data2.length) throw new Error('备用数据为空');
                    return data2.map(row => ({
                        date: row.day,
                        open: +row.open,
                        close: +row.close,
                        high: +row.high,
                        low: +row.low,
                        volume: +row.volume || 0,
                    }));
                } catch (err2) {
                    throw new Error(`无法获取 ${code} 的K线数据`);
                }
            }
        }

        // ============================================================
        // 7. 信号计算（含组合止盈策略：100%仓位全覆盖）
        // ============================================================
        function simpleSignal(closes, highs, lows) {
            if (closes.length < 20) {
                return { overall: '数据不足', action: 'K线不足，无法计算', position: 0, confidence: 0, tpSl: null };
            }
            const n = closes.length;
            const price = closes[n - 1];

            // ---- 趋势信号 ----
            const ma5 = closes.slice(-5).reduce((a, b) => a + b, 0) / 5;
            const ma20 = closes.slice(-20).reduce((a, b) => a + b, 0) / 20;
            const ma60 = closes.length >= 60 ? closes.slice(-60).reduce((a, b) => a + b, 0) / 60 : ma20;
            const prev = closes[n - 2] || closes[n - 1];
            const changePct = (price - prev) / prev * 100;
            const pct5 = (price - closes[n - 5]) / closes[n - 5] * 100;

            let score = 0;
            if (price > ma5) score += 1.5;
            else score -= 1.5;
            if (price > ma20) score += 1.2;
            else score -= 1.2;
            if (price > ma60) score += 0.8;
            else score -= 0.8;
            if (ma5 > ma20) score += 0.5;
            else score -= 0.5;
            if (ma20 > ma60) score += 0.3;
            else score -= 0.3;
            if (changePct > 1) score += 0.5;
            else if (changePct < -1) score -= 0.5;
            if (pct5 > 3) score += 1;
            else if (pct5 < -3) score -= 1;

            let overall, action, position, confidence;
            if (score >= 5) { overall = '强力买入';
                action = '强势突破，积极跟进';
                position = 85;
                confidence = 90; } else if (score >= 3.5) { overall = '买入';
                action = '趋势向好，分批建仓';
                position = 65;
                confidence = 75; } else if (score >= 2) { overall = '左侧试探';
                action = '底部区域，轻仓试水';
                position = 35;
                confidence = 55; } else if (score >= 0.5) { overall = '超卖区';
                action = '超跌反弹机会';
                position = 20;
                confidence = 40; } else if (score >= -0.5) { overall = '观望';
                action = '等待方向明朗';
                position = 0;
                confidence = 30; } else if (score >= -2) { overall = '高空防守';
                action = '高位滞涨，逐步减仓';
                position = 25;
                confidence = 50; } else if (score >= -3.5) { overall = '卖出';
                action = '趋势走弱，果断减仓';
                position = 50;
                confidence = 70; } else { overall = '强力卖出';
                action = '全面转空，清仓避险';
                position = 75;
                confidence = 85; }

            // ---- ATR 计算 ----
            let atr = price * 0.02;
            if (highs && lows && highs.length === closes.length) {
                const tr = [];
                for (let i = 1; i < closes.length; i++) {
                    const hl = highs[i] - lows[i];
                    const hc = Math.abs(highs[i] - closes[i - 1]);
                    const lc = Math.abs(lows[i] - closes[i - 1]);
                    tr.push(Math.max(hl, hc, lc));
                }
                const period = 14;
                if (tr.length >= period) {
                    let sum = tr.slice(0, period).reduce((a, b) => a + b, 0);
                    let atrVal = sum / period;
                    for (let i = period; i < tr.length; i++) {
                        atrVal = (atrVal * (period - 1) + tr[i]) / period;
                    }
                    if (atrVal > 0) atr = atrVal;
                }
            }

            // ---- 支撑阻力（R2 备用） ----
            const high = highs ? Math.max(...highs.slice(-20)) : price * 1.05;
            const low = lows ? Math.min(...lows.slice(-20)) : price * 0.95;
            const pp = (high + low + price) / 3;
            const s1 = 2 * pp - high;
            const r1 = 2 * pp - low;
            const r2 = pp + (high - low);

            // ---- 动态止损 ----
            const stopByATR = price - 2 * atr;
            const stopByS1 = s1 || (price * 0.97);
            const stopLoss = Math.min(stopByATR, stopByS1, price * 0.95);

            // =============================================================
            // ★★★ 核心升级：组合止盈策略（100%仓位全覆盖）★★★
            // 不区分震荡/趋势，同时执行：短线落袋（前60%）+ 长线跟踪（后40%）
            // 无论市场怎么走，都有仓位在正确的一边
            // =============================================================
            const atr1 = price + 1.0 * atr; // 短线目标1
            const atr2 = price + 2.0 * atr; // 中线目标
            const atr3 = price + 3.5 * atr; // 长线跟踪目标

            let targets = [
                { price: atr1, ratio: 0.30, label: '+1ATR(短线)' },
                { price: atr2, ratio: 0.30, label: '+2ATR(中线)' },
                { price: atr3, ratio: 0.40, label: '+3.5ATR(长线)' }
            ];

            // 若 R1 比 atr1 更近且有效（R1 > price），用 R1 替换或合并
            if (r1 && r1 > price && r1 < atr1) {
                targets[0] = { price: r1, ratio: 0.25, label: 'R1(阻力)' };
                // 将节省的5%加到长线
                targets[2].ratio = 0.45;
            }

            // 若 R2 比 atr3 更近，作为额外参考（但不替换，只影响显示）
            const hasR2 = r2 && r2 > atr3;

            // 移动止损
            const trailingStop = {
                enabled: true,
                trigger: price + 1.5 * atr,
                step: atr,
                currentStop: stopLoss
            };

            const tpSl = {
                stopLoss,
                takeProfitLevels: targets,
                trailingStop,
                atr,
                s1,
                r1,
                r2,
                hasR2,
                note: '组合策略：短线落袋 + 长线跟踪'
            };

            return { overall, action, position, confidence, tpSl };
        }

        // ============================================================
        // 8. 排序
        // ============================================================
        function getSignalGroup(signal) {
            const buySignals = ['强力买入', '买入', '左侧试探', '超卖区'];
            const sellSignals = ['强力卖出', '卖出', '高空防守', '超买区'];
            if (buySignals.includes(signal)) return 0;
            if (sellSignals.includes(signal)) return 2;
            return 1;
        }

        function sortStocks(stocks) {
            const sorted = [...stocks];
            sorted.sort((a, b) => {
                const da = stockDataMap[a.code] || {};
                const db = stockDataMap[b.code] || {};
                let valA, valB;

                switch (sortField) {
                    case 'name':
                        valA = a.name;
                        valB = b.name;
                        return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                    case 'price':
                        valA = da.price !== undefined ? da.price : -Infinity;
                        valB = db.price !== undefined ? db.price : -Infinity;
                        return sortAsc ? (valA - valB) : (valB - valA);
                    case 'changePercent':
                        valA = da.changePercent !== undefined ? da.changePercent : -Infinity;
                        valB = db.changePercent !== undefined ? db.changePercent : -Infinity;
                        return sortAsc ? (valA - valB) : (valB - valA);
                    case 'signal':
                    default:
                        const gA = getSignalGroup(da.signal || '中性');
                        const gB = getSignalGroup(db.signal || '中性');
                        if (gA !== gB) return gA - gB;
                        const posA = da.position || 0;
                        const posB = db.position || 0;
                        return posB - posA;
                }
            });
            return sorted;
        }

        // ============================================================
        // 9. 核心刷新与渲染
        // ============================================================
        async function fetchQuotesBatch(codes) {
            if (!codes || codes.length === 0) return {};
            const BATCH_SIZE = 50;
            const batches = [];
            for (let i = 0; i < codes.length; i += BATCH_SIZE) batches.push(codes.slice(i, i + BATCH_SIZE));
            const results = {};
            await Promise.all(batches.map(async (batch) => {
                const codeStr = batch.join(',');
                const url = `https://qt.gtimg.cn/q=${codeStr}`;
                try {
                    const text = await fetch(url, { signal: AbortSignal.timeout(6000) }).then(r => r.text());
                    const lines = text.split('\n').filter(l => l.trim());
                    for (const line of lines) {
                        const m = line.match(/v_([a-z]{2}\d{6})="(.+)"/);
                        if (!m) continue;
                        const code = m[1];
                        const f = m[2].split('~');
                        results[code] = {
                            name: f[1] || code,
                            price: parseFloat(f[3]) || 0,
                            change: parseFloat(f[31]) || 0,
                            changePercent: parseFloat(f[32]) || 0,
                            volume: parseInt(f[36]) || 0,
                            turnover: (parseFloat(f[37]) || 0) * 10000,
                        };
                    }
                } catch (e) { console.warn('报价获取失败', e); }
            }));
            return results;
        }

            for (const s of stocks) {

                    stockDataMap[s.code] = {

                        changePercent: q.changePercent,

                        position: stockDataMap[s.code]?.position || 0,
                        confidence: stockDataMap[s.code]?.confidence || 0,
                        tpSl: stockDataMap[s.code]?.tpSl || null,
                    };
                } else if (!stockDataMap[s.code]) {
                    stockDataMap[s.code] = { price: '--', change: 0, changePercent: 0, volume: 0, updateTime: Date.now(),
                        signal: '--', action: '', position: 0, confidence: 0, tpSl: null };
                }
            }
            renderStockCards(stocks);

            const needCalc = stocks.filter(s => stockDataMap[s.code]?.price !== '--');
            const CONCURRENCY = 3;
            for (let i = 0; i < needCalc.length; i += CONCURRENCY) {
                const batch = needCalc.slice(i, i + CONCURRENCY);
                await Promise.all(batch.map(async (s) => {
                    try {
                        let kline = null;
                        try {
                            if (window.HistoryTable && typeof window.HistoryTable.getRecent ===
                                'function') {
                                const cached = window.HistoryTable.getRecent(s.code, 120);
                                if (cached && cached.length >= 60) {
                                    kline = cached.map(r => ({
                                        date: r.date,
                                        open: r.open,
                                        high: r.high,
                                        low: r.low,
                                        close: r.close,
                                        volume: r.volume,
                                    }));
                                }
                            }
                        } catch (e) { /* ignore */ }

                        if (!kline || kline.length < 60) {
                            kline = await fetchKLine(s.code, 120);
                        }

                        if (kline && kline.length > 20) {
                            const closes = kline.map(d => d.close);
                            const highs = kline.map(d => d.high);
                            const lows = kline.map(d => d.low);
                            let sig;
                            if (typeof window.summarize === 'function') {
                                const opens = kline.map(d => d.open);
                                const vols = kline.map(d => d.volume);
                                const prev = kline[kline.length - 2] || kline[kline.length - 1];
                                let pivots = null;
                                if (typeof window.calcPivots === 'function') {
                                    pivots = window.calcPivots(prev.high, prev.low, prev.close);
                                }
                                sig = window.summarize(closes, highs, lows, opens, vols, pivots);
                                if (!sig.tpSl) {
                                    const extra = simpleSignal(closes, highs, lows);
                                    sig.tpSl = extra.tpSl;
                                }
                            } else {
                                sig = simpleSignal(closes, highs, lows);
                            }
                            stockDataMap[s.code].signal = sig.overall || '中性';
                            stockDataMap[s.code].action = sig.action || '';
                            stockDataMap[s.code].position = sig.position || 0;
                            stockDataMap[s.code].confidence = sig.confidence || 0;
                            stockDataMap[s.code].tpSl = sig.tpSl || null;
                        } else {
                            stockDataMap[s.code].signal = '数据不足';
                            stockDataMap[s.code].action = 'K线不足，无法计算';
                            stockDataMap[s.code].position = 0;
                            stockDataMap[s.code].confidence = 0;
                            stockDataMap[s.code].tpSl = null;

                        stockDataMap[s.code].position = 0;
                        stockDataMap[s.code].confidence = 0;
                        stockDataMap[s.code].tpSl = null;

                }));

        // ============================================================
        // 10. 渲染股票卡片

        function renderStockCards(stocks) {
            const sorted = sortStocks(stocks);

        // ============================================================
        // 11. 长按删除
        // ============================================================
        function bindLongPressDelete(container) {
            const LONG_PRESS_MS = 700;
            const SCROLL_TOLERANCE = 10;

            container.querySelectorAll('.stock-card').forEach(card => {
                let startX = 0,
                    startY = 0;
                let progressEl = null;
                let progressStart = 0;
                let rafId = null;

                const cancel = () => {
                    if (rafId) { cancelAnimationFrame(rafId);
                        rafId = null; }
                    card.classList.remove('deleting');
                    if (progressEl) progressEl.style.setProperty('--progress', '0%');
                };

                const animate = (timestamp) => {
                    if (!progressStart) progressStart = timestamp;
                    const elapsed = timestamp - progressStart;
                    const progress = Math.min(elapsed / LONG_PRESS_MS, 1);
                    if (progressEl) progressEl.style.setProperty('--progress', (progress * 100) + '%');
                    if (progress >= 1) {
                        rafId = null;
                        const code = card.dataset.code;
                        const name = card.querySelector('.name')?.textContent || code;
                        if (confirm(`🗑️ 删除自选股 "${name}" (${code.toUpperCase()})？`)) {
                            if (window.removeStock) window.removeStock(code);
                            card.classList.add('removing');
                            setTimeout(() => refreshStocks(), 360);
                        } else {
                            cancel();
                        }
                    } else {
                        rafId = requestAnimationFrame(animate);
                    }
                };

                const start = (x, y) => {
                    if (card.classList.contains('removing')) return;
                    startX = x;
                    startY = y;
                    progressEl = card.querySelector('.hold-progress');
                    if (progressEl) progressEl.style.setProperty('--progress', '0%');
                    card.classList.add('deleting');
                    progressStart = 0;
                    rafId = requestAnimationFrame(animate);
                };

                card.addEventListener('touchstart', (e) => {
                    const t = e.touches[0];
                    start(t.clientX, t.clientY);
                }, { passive: true });
                card.addEventListener('touchmove', (e) => {
                    const t = e.touches[0];
                    if (Math.hypot(t.clientX - startX, t.clientY - startY) > SCROLL_TOLERANCE) {
                        cancel();
                    }
                }, { passive: true });
                card.addEventListener('touchend', cancel);
                card.addEventListener('touchcancel', cancel);

                card.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    start(e.clientX, e.clientY);
                });
                card.addEventListener('mousemove', (e) => {
                    if (Math.hypot(e.clientX - startX, e.clientY - startY) > SCROLL_TOLERANCE) cancel();
                });
                card.addEventListener('mouseup', cancel);
                card.addEventListener('mouseleave', cancel);
            });
        }

        // ============================================================

        function renderPortfolioPanel() {

            const limits = getRiskLimits();
            window.__riskLimits = limits;

            const advice = getRiskAdvice(portfolio, limits);

            document.getElementById('roEquity').textContent = '¥' + (stats.equity || 0).toFixed(0);
            document.getElementById('roTotalPos').textContent = stats.totalPosPct.toFixed(1) + '%';
            document.getElementById('roTotalPos').className = 'ro-value' + (
                stats.totalPosPct > limits.maxTotalPosition * 100 ? ' bad' :

            );
            // 显示总仓位上限
            const totalParent = document.getElementById('roTotalPos').parentNode;
            let hintEl = totalParent.querySelector('.param-hint');
            if (!hintEl) {
                hintEl = document.createElement('div');
                hintEl.className = 'param-hint';

            }
            hintEl.textContent = `上限 ${(limits.maxTotalPosition*100).toFixed(0)}%`;

            const cashInput = document.getElementById('cashInput');
            cashInput.value = portfolio.cash || 0;
            document.getElementById('roDrawdown').textContent = stats.drawdown.toFixed(1) + '%';
            document.getElementById('roDrawdown').className = 'ro-value' + (
                stats.drawdown > limits.maxDrawdown * 100 * 0.7 ? ' bad' :
                stats.drawdown > limits.maxDrawdown * 100 * 0.4 ? ' warn' : ' good'
            );

            const statusEl = document.getElementById('roRiskStatus');
            if (advice.isBlocked) {
                statusEl.textContent = '🚫 熔断';
                statusEl.className = 'ro-value bad';
            } else if (advice.riskLevel === 'HIGH') {
                statusEl.textContent = '⚠️ 高风险';
                statusEl.className = 'ro-value bad';
            } else if (advice.riskLevel === 'MEDIUM') {
                statusEl.textContent = '⚡ 中风险';
                statusEl.className = 'ro-value warn';
            } else {
                statusEl.textContent = '✅ 正常';
                statusEl.className = 'ro-value good';
            }
            const paramHint = document.getElementById('riskParamHint');
            if (paramHint) {
                paramHint.textContent = `单标上限 ${(limits.maxSinglePosition*100).toFixed(0)}% · 回撤熔断 ${(limits.maxDrawdown*100).toFixed(0)}%`;

            const listEl = document.getElementById('posList');
            if (!portfolio.positions.length) {

            } else {
                let html = '';
                for (const p of portfolio.positions) {
                    const price = p.currentPrice || p.avgCost || 0;
                    const mv = p.marketValue || 0;
                    const pl = p.profit || 0;
                    const plPct = p.profitPct || 0;
                    const plCls = pl > 0 ? 'up' : (pl < 0 ? 'down' : 'flat');
                    const plSign = pl > 0 ? '+' : '';
                    html += `
                        <div class="pos-item" data-code="${p.code}">
                            <div class="pi-name">${p.code.toUpperCase()}<span class="pi-code">${p.code.replace(/^[a-z]+/,'')}</span></div>
                            <div class="pi-shares">${p.shares}</div>
                            <div class="pi-cost">${p.avgCost.toFixed(2)}</div>
                            <div class="pi-price">${price.toFixed(2)}</div>
                            <div class="pi-pl ${plCls}">${plSign}${pl.toFixed(0)}<br><small>${plSign}${plPct.toFixed(1)}%</small></div>
                            <div class="pi-action">
                                <button class="btn-edit" data-code="${p.code}" title="编辑">✎</button>
                                <button class="btn-del" data-code="${p.code}" title="删除">✕</button>

                pct > limits.maxTotalPosition * 100 * 0.85 ? ' warn' : ''

        // ============================================================
        // 13. 行业配置渲染
        // ============================================================
        function renderSectorAllocation(portfolio) {
            const container = document.getElementById('sectorList');
            const result = calcSectorAllocation(portfolio);
            if (result.totalValue === 0 || result.sectors.length === 0) {
                container.innerHTML = `<div class="sector-empty">暂无持仓，请添加</div>`;
                return;
            }

            const avgPct = 100 / result.sectors.length;
            let html = '';
            for (const s of result.sectors) {
                const isOver = s.pct > avgPct * 1.2;
                const isUnder = s.pct < avgPct * 0.8;
                const hint = isOver ? '🔺超配' : isUnder ? '🔻低配' : '⚖️均衡';
                const color = isOver ? '#e53e3e' : isUnder ? '#38a169' : '#718096';
                html += `
                    <div class="sector-item">
                        <span class="s-name">${s.name}</span>
                        <div class="s-bar"><div class="s-fill" style="width:${s.pct}%;background:${color};"></div></div>
                        <span class="s-value">${s.pct.toFixed(1)}%</span>
                        <span style="font-size:10px;color:${color};min-width:40px;">${hint}</span>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

                icon.classList.remove('open');
                icon.textContent = '▼';

            try { localStorage.setItem('panel_open', JSON.stringify(panelOpen)); } catch {}

            if (saved !== null) panelOpen = JSON.parse(saved);

        // ============================================================
        // 19. OCR 识别
        // ============================================================
        const ocrBtn = document.getElementById('ocrBtn');
        const ocrFile = document.getElementById('ocrFile');
        let isOcrCanceled = false;

        ocrBtn.addEventListener('click', () => { ocrFile.click(); });

        ocrFile.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            e.target.value = '';

            const overlay = showOcrOverlay('正在识别图片…', '首次使用需下载 OCR 引擎，约 2MB');

            try {
                if (typeof Tesseract === 'undefined') {
                    throw new Error('OCR 引擎未加载，请检查网络');
                }

                const { data: { text } } = await Tesseract.recognize(file, 'eng', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            updateOcrOverlay(`识别中… ${Math.round(m.progress * 100)}%`, '');
                        } else if (m.status) {
                            updateOcrOverlay(m.status, '');
                        }
                    }
                });

                const codes = extractStockCodes(text);
                if (codes.length === 0) {
                    updateOcrOverlay('❌ 未识别到有效股票代码', '请确保图片清晰且包含 6 位数字代码', true);
                    return;
                }

                updateOcrOverlay(`✅ 识别到 ${codes.length} 个代码`, codes.join(', '));
                let addedCount = 0;
                let dupCount = 0;
                for (const code of codes) {
                    if (window.addStock) {
                        const res = window.addStock(code);
                        if (res.added) addedCount++;
                        else if (res.reason === 'duplicate') dupCount++;
                    }
                }
                const msg = `已添加 ${addedCount} 个` + (dupCount ? `（${dupCount} 个已存在）` : '');
                setTimeout(() => {
                    hideOcrOverlay();
                    toast(msg);
                    populateStockSelect();
                    refreshStocks();
                }, 1200);
            } catch (err) {
                console.error(err);
                updateOcrOverlay('❌ 识别失败', err.message || '请重试', true);
            }
        });

        function extractStockCodes(text) {
            if (!text) return [];
            const normalized = text.replace(/[\s\n\r]+/g, ' ');
            const results = new Set();

            const prefixed = normalized.match(/\b([a-z]{2})\s*(\d{6})\b/gi) || [];
            for (const m of prefixed) {
                const [, prefix, num] = m.match(/([a-z]{2})\s*(\d{6})/i);
                const p = prefix.toLowerCase();
                if (['sh', 'sz', 'bj'].includes(p)) results.add(p + num);
            }

            const plain = normalized.match(/\b(\d{6})\b/g) || [];
            for (const num of plain) {
                if (/^[0-8]\d{5}$/.test(num)) results.add(num);
            }

            return Array.from(results).slice(0, 20);
        }

        function showOcrOverlay(msg, sub) {
            let ov = document.querySelector('.ocr-overlay');
            if (!ov) {
                ov = document.createElement('div');
                ov.className = 'ocr-overlay';
                ov.innerHTML = `
                        <div class="spinner"></div>
                        <div class="ocr-msg"></div>
                        <div class="ocr-sub"></div>
                        <button class="ocr-cancel">取消</button>
                    `;
                document.body.appendChild(ov);
                ov.querySelector('.ocr-cancel').addEventListener('click', () => {
                    hideOcrOverlay();
                    isOcrCanceled = true;
                });
            } else {
                ov.querySelector('.spinner').style.display = '';
            }
            ov.querySelector('.ocr-msg').textContent = msg;
            ov.querySelector('.ocr-sub').textContent = sub || '';
            ov.querySelector('.ocr-cancel').textContent = '取消';
            ov.style.display = 'flex';
            isOcrCanceled = false;
            return ov;
        }

        function updateOcrOverlay(msg, sub, hideSpinner) {
            const ov = document.querySelector('.ocr-overlay');
            if (!ov) return;
            ov.querySelector('.ocr-msg').textContent = msg;
            ov.querySelector('.ocr-sub').textContent = sub || '';
            if (hideSpinner) ov.querySelector('.spinner').style.display = 'none';
        }

        function hideOcrOverlay() {
            const ov = document.querySelector('.ocr-overlay');
            if (ov) ov.style.display = 'none';
        }

        // ============================================================
        // 20. 指数 ticker
        // ============================================================
        async function loadMarketData() {
            try {
                const codes = MARKET.map(toFullCode);
                mq = await fetchQuotesBatch(codes);
                renderMarketTicker();
            } catch (e) { console.warn('指数加载失败', e); }
        }

        function renderMarketTicker() {
            const track = document.getElementById('tickerTrack');
            if (!track) return;
            const items = [];
            MARKET.forEach(i => {
                const code = toFullCode(i);
                const d = mq[code];
                if (!d || !d.price) {
                    items.push(
                        `<span class="ticker-item flat"><span class="t-name">${i.name}</span><span class="t-price">--</span><span class="t-pct">--</span></span>`
                        );
                    return;
                }
                const cls = d.changePercent > 0 ? 'up' : (d.changePercent < 0 ? 'down' : 'flat');
                const sign = d.changePercent > 0 ? '+' : '';
                items.push(
                    `<span class="ticker-item ${cls}"><span class="t-name">${i.name}</span><span class="t-price">${d.price.toFixed(2)}</span><span class="t-pct">${sign}${d.changePercent.toFixed(2)}%</span></span>`
                    );
            });
            if (!items.length) { track.innerHTML = '<div class="ticker-loading">暂无指数数据</div>'; return; }
            track.innerHTML = items.join('') + items.join('');
        }

        // ============================================================
        // 21. 定时器
        // ============================================================
        function updateCdown() {
            document.getElementById('countdown').textContent = countdownSec + 's↻';
        }
        setInterval(() => {
            countdownSec--;
            if (countdownSec <= 0) countdownSec = 60;
            updateCdown();
        }, 1000);

        // ============================================================
        // 22. 错误兜底
        // ============================================================
        function _renderError(e) {
            try {
                const el = document.getElementById('stockList');
                if (el && !el.dataset.errored) {
                    el.dataset.errored = '1';
                    el.innerHTML = '<div style="padding:12px;background:#fff5f5;border:1px solid #feb2b2;border-radius:8px;color:#c53030;font-size:12px;font-family:monospace;white-space:pre-wrap;word-break:break-all;">⚠ JS 错误：' + (e
                        ?.message || e) + (e?.stack ? '\n' + e.stack.split('\n').slice(0, 3).join('\n') : '') + '</div>';
                }
            } catch {}
        }

        window.addEventListener('error', (ev) => _renderError(ev.error || ev.message));
        window.addEventListener('unhandledrejection', (ev) => _renderError(ev.reason));

        // ============================================================
        // 23. 暴露到全局
        // ============================================================
        window.stockDataMap = stockDataMap;
        window.loadPortfolio = loadPortfolio;
        window.savePortfolio = savePortfolio;
        window.addPosition = addPosition;
        window.updatePosition = updatePosition;
        window.removePosition = removePosition;
        window.refreshPortfolioPrices = refreshPortfolioPrices;
        window.calcPortfolioStats = calcPortfolioStats;
        window.getRiskAdvice = getRiskAdvice;
        window.renderPortfolioPanel = renderPortfolioPanel;
        window.fetchKLine = fetchKLine;
        window.getSector = getSector;
        window.getRiskLimits = getRiskLimits;

        // ============================================================
        // 24. 初始化
        // ============================================================
        window.addEventListener('load', () => {
            if (typeof loadStocks === 'undefined') {
                window.loadStocks = function() {
                    try {
                        const raw = localStorage.getItem('stocks_v1');
                        if (!raw) return [];
                        return JSON.parse(raw);
                    } catch { return []; }
                };
                window.addStock = function(code) {
                    const list = window.loadStocks();
                    let c = code.toLowerCase().trim();
                    if (/^\d{6}$/.test(c)) {
                        const head = c[0];
                        if (c.startsWith('000') || c.startsWith('6') || c.startsWith('9') || c.startsWith('5')) c = 'sh' +
                            c;
                        else if (c.startsWith('399') || c.startsWith('1') || c.startsWith('0') || c.startsWith('3')) c =
                            'sz' + c;
                        else if (head === '4' || head === '8') c = 'bj' + c;
                        else c = 'sh' + c;
                    } else if (!/^([a-z]{2,3})\d{6}$/.test(c)) {
                        return { list, added: false, reason: 'invalid' };
                    }
                    if (list.some(s => s.code === c)) return { list, added: false, reason: 'duplicate' };
                    const m = c.startsWith('sh') ? 'sh' : c.startsWith('sz') ? 'sz' : 'bj';
                    const name = c.toUpperCase();
                    list.unshift({ code: c, name, market: m });
                    localStorage.setItem('stocks_v1', JSON.stringify(list));
                    return { list, added: true };
                };
                window.removeStock = function(code) {
                    const list = window.loadStocks().filter(s => s.code !== code);
                    localStorage.setItem('stocks_v1', JSON.stringify(list));
                    return list;
                };
            }

            window.__riskLimits = getRiskLimits();

            populateStockSelect();
            renderPortfolioPanel();
            refreshStocks().catch(e => _renderError(e));
            loadMarketData();

            setInterval(() => {
                refreshStocks().catch(e => _renderError(e));
                refreshPortfolioPrices();
                renderPortfolioPanel();
            }, 60000);
            setInterval(loadMarketData, 60000);
            updateTimeDisplay();
            setInterval(updateTimeDisplay, 1000);

            window.refreshStocks = refreshStocks;
            window.renderStockCards = renderStockCards;
        });

        console.log('📊 智能参谋已启动 · 组合止盈策略（100%仓位全覆盖）');
        console.log('🎯 止盈逻辑：30%短线(+1ATR) + 30%中线(+2ATR) + 40%长线(+3.5ATR)');
    </script>
</body>
