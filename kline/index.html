<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自选股 · 智能参谋</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
    <style>
        /* ===== 全局重置 & 变量 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0b0d17;
            --bg-card: #13162b;
            --bg-card-hover: #1a1e3a;
            --border-color: rgba(255,255,255,0.06);
            --text-primary: #e8edf5;
            --text-secondary: #8e95b8;
            --text-muted: #5a6080;
            --accent: #6c7bff;
            --accent-glow: rgba(108, 123, 255, 0.2);
            --up: #ff4d6a;
            --down: #2ecc71;
            --radius: 16px;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 480px;
            width: 100%;
        }

        /* ===== 顶部导航 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header .brand h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .brand span {
            font-size: 13px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-left: 4px;
            background: none;
            -webkit-text-fill-color: var(--text-secondary);
        }
        .header .info {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .header .info .time {
            font-weight: 500;
            color: var(--text-primary);
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2ecc71;
            animation: pulse 2s infinite;
            margin-right: 4px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .countdown {
            background: rgba(255,255,255,0.05);
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* ===== 指数滚动 Ticker ===== */
        .ticker {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            position: relative;
            height: 26px;
            display: flex;
            align-items: center;
            mask-image: linear-gradient(to right, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0, #000 24px, #000 calc(100% - 24px), transparent 100%);
        }
        .ticker:hover .ticker-track,
        .ticker:active .ticker-track { animation-play-state: paused; }
        .ticker-track {
            display: flex;
            gap: 28px;
            white-space: nowrap;
            animation: ticker-scroll 45s linear infinite;
            will-change: transform;
        }
        @keyframes ticker-scroll {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }
        .ticker-item {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            font-size: 12px;
            line-height: 1;
        }
        .ticker-item .t-name { color: var(--text-secondary); font-weight: 500; }
        .ticker-item .t-price { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }
        .ticker-item .t-pct   { font-weight: 700; font-variant-numeric: tabular-nums; }
        .ticker-item.up   .t-price,
        .ticker-item.up   .t-pct   { color: var(--up); }
        .ticker-item.down .t-price,
        .ticker-item.down .t-pct   { color: var(--down); }
        .ticker-item.flat .t-price,
        .ticker-item.flat .t-pct   { color: var(--text-muted); }
        .ticker-loading {
            color: var(--text-muted);
            font-size: 11px;
            padding: 0 24px;
        }

        /* ===== 添加栏 ===== */
        .add-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            background: var(--bg-card);
            padding: 12px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .add-bar input {
            flex: 1;
            min-width: 140px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }
        .add-bar input:focus {
            border-color: var(--accent);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .add-bar input::placeholder {
            color: var(--text-muted);
        }
        .add-bar button {
            background: var(--accent);
            border: none;
            color: #fff;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .add-bar button:hover {
            background: #5a6bff;
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .add-bar button:active { transform: scale(0.96); }
        .add-bar .btn-img {
            background: rgba(255,255,255,0.08);
            color: var(--text-primary);
        }
        .add-bar .btn-img:hover {
            background: rgba(255,255,255,0.14);
            box-shadow: none;
        }
        .add-bar .hint {
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        /* OCR 状态覆盖层 */
        .ocr-overlay {
            position: fixed;
            inset: 0;
            background: rgba(11,13,23,0.85);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            backdrop-filter: blur(4px);
        }
        .ocr-overlay .spinner {
            width: 36px; height: 36px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .ocr-overlay .ocr-msg { color: var(--text-primary); font-size: 14px; font-weight: 600; }
        .ocr-overlay .ocr-sub { color: var(--text-muted); font-size: 12px; }
        .ocr-overlay button { margin-top: 6px; padding: 8px 18px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 10px; cursor: pointer; }

        /* ===== 自选股列表（单股一行） ===== */
        .stock-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        .stock-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px 18px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        .stock-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(108, 123, 255, 0.3);
        }
        .stock-card.deleting {
            background: rgba(255, 77, 106, 0.15);
            border-color: var(--up);
            transform: scale(0.98);
        }
        .stock-card.removing {
            animation: slideOut 0.35s ease forwards;
        }
        @keyframes slideOut {
            to { opacity: 0; transform: translateX(-30px) scale(0.95); max-height: 0; padding: 0; margin: 0; border-width: 0; }
        }
        .stock-card .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .stock-card .name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
        }
        .stock-card .code {
            font-size: 11px;
            color: var(--text-muted);
            background: rgba(255,255,255,0.04);
            padding: 2px 8px;
            border-radius: 20px;
            flex-shrink: 0;
        }
        .stock-card .price-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            margin: 4px 0 2px;
            flex-wrap: wrap;
        }
        .stock-card .price {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
        }
        .stock-card .chg {
            font-size: 15px;
            font-weight: 600;
        }
        .up { color: var(--up); }
        .down { color: var(--down); }
        .flat { color: var(--text-muted); }

        .stock-card .signal-area {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .signal-badge {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(255,255,255,0.06);
            color: var(--text-secondary);
        }
        .signal-badge.buy { background: rgba(255, 77, 106, 0.18); color: var(--up); }
        .signal-badge.sell { background: rgba(46, 204, 113, 0.18); color: var(--down); }
        .signal-badge.hold { background: rgba(255, 193, 7, 0.15); color: #ffc107; }
        .signal-badge.neutral { background: rgba(255,255,255,0.05); color: var(--text-secondary); }

        .stock-card .action-text {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .stock-card .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-muted);
        }
        .stock-card .update-time {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.fresh { background: #2ecc71; }
        .dot.stale { background: #f1c40f; }
        .dot.old { background: var(--up); }

        .stock-card .fresh-label {
            font-size: 10px;
            color: var(--text-muted);
        }

        /* 长按进度环 */
        .stock-card .hold-progress {
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
        }
        .stock-card.deleting .hold-progress { opacity: 1; }
        .stock-card .hold-progress svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .stock-card .hold-progress circle {
            fill: none;
            stroke: var(--up);
            stroke-width: 3;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            transition: stroke-dashoffset 0.05s linear;
        }

        /* ===== 底部 ===== */
        .footer {
            text-align: center;
            padding: 20px 0 8px;
            font-size: 11px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            margin-top: 20px;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            color: var(--text-primary);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 999;
            border: 1px solid var(--accent);
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            animation: fadeIn 0.3s ease;
            max-width: 90vw;
            text-align: center;
            backdrop-filter: blur(8px);
        }
        @keyframes fadeIn {
            from { opacity:0; transform: translateX(-50%) translateY(-10px); }
            to { opacity:1; transform: translateX(-50%) translateY(0); }
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            body { padding: 10px; }
            .header { flex-direction: column; align-items: stretch; gap: 8px; }
            .header .info { justify-content: flex-end; }
            .add-bar input { min-width: 100px; }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- ===== 顶部导航 ===== -->
    <header class="header">
        <div class="brand">
            <h1>📊 自选股 <span>智能参谋</span></h1>
        </div>
        <div class="info">
            <div class="ticker" id="marketTicker">
                <div class="ticker-track" id="tickerTrack">
                    <div class="ticker-loading">主要指数加载中…</div>
                </div>
            </div>
            <span class="countdown" id="countdown">60s↻</span>
        </div>
    </header>

    <!-- ===== 添加栏（代码/名称 + 图片识别） ===== -->
    <div class="add-bar">
        <input id="newStockInput" placeholder="代码或名称（如 600519 / 贵州茅台）" autocomplete="off">
        <button id="addBtn">➕ 添加</button>
        <button id="ocrBtn" class="btn-img" title="从图片识别股票代码">📷 识别</button>
        <input type="file" id="ocrFile" accept="image/*" style="display:none">
        <div class="hint">支持沪深北 · 代码/名称均可 · 📷 可识别持仓截图自动添加</div>
    </div>

    <!-- ===== 自选股列表 ===== -->
    <div class="stock-list" id="stockList"></div>

    <div class="footer">长按自选股可删除 · 60秒自动刷新</div>
</div>

<script>
// ============================================================
// 基础存储（与 app.js 保持一致）
// ============================================================
const STORAGE_KEY = 'stocks_v1';
const DEFAULT_STOCKS = [
    { code: 'sh600519', name: '贵州茅台', market: 'sh' },
    { code: 'sz000001', name: '平安银行', market: 'sz' },
    { code: 'sz300750', name: '宁德时代', market: 'sz' },
    { code: 'sh000001', name: '上证指数', market: 'sh' },
    { code: 'sz399001', name: '深证成指', market: 'sz' },
];
function loadStocks() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [...DEFAULT_STOCKS];
        const list = JSON.parse(raw);
        return list.length ? list : [...DEFAULT_STOCKS];
    } catch { return [...DEFAULT_STOCKS]; }
}
function saveStocks(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}
function addStock(code) {
    const list = loadStocks();
    let c = code.toLowerCase().trim();
    if (/^\d{6}$/.test(c)) {
        const head = c[0];
        if (c.startsWith('000') || c.startsWith('6') || c.startsWith('9') || c.startsWith('5')) c = 'sh' + c;
        else if (c.startsWith('399') || c.startsWith('1') || c.startsWith('0') || c.startsWith('3')) c = 'sz' + c;
        else if (head === '4' || head === '8') c = 'bj' + c;
        else c = 'sh' + c;
    } else if (!/^([a-z]{2,3})\d{6}$/.test(c)) {
        return { list, added: false, reason: 'invalid' };
    }
    if (list.some(s => s.code === c)) return { list, added: false, reason: 'duplicate' };
    const m = c.startsWith('sh') ? 'sh' : c.startsWith('sz') ? 'sz' : 'bj';
    const num = c.replace(/^[a-z]+/, '');
    const h1 = num[0], h2 = num[1];
    let type = 'stock';
    if (h1 === '5' && (h2 === '0' || h2 === '1' || h2 === '8')) type = 'etf';
    else if (h1 === '1' && h2 === '5') type = 'etf';
    else if (h1 === '1' && (h2 === '6' || h2 === '7')) type = 'lof';
    else if (h1 === '0' && h2 === '0' && m === 'sh') type = 'index';
    else if (h1 === '3' && h2 === '9' && m === 'sz') type = 'index';
    const name = c.toUpperCase();
    list.unshift({ code: c, name, market: m, type });
    saveStocks(list);
    return { list, added: true };
}
function removeStock(code) {
    const list = loadStocks().filter(s => s.code !== code);
    saveStocks(list);
    return list;
}

// ============================================================
// 报价接口
// ============================================================
async function fetchQuotesBatch(codes) {
    if (!codes || codes.length === 0) return {};
    const BATCH_SIZE = 50;
    const batches = [];
    for (let i = 0; i < codes.length; i += BATCH_SIZE) batches.push(codes.slice(i, i + BATCH_SIZE));
    const results = {};
    await Promise.all(batches.map(async (batch) => {
        const codeStr = batch.join(',');
        const url = `https://qt.gtimg.cn/q=${codeStr}`;
        try {
            const text = await fetch(url, { signal: AbortSignal.timeout(6000) }).then(r => r.text());
            const lines = text.split('\n').filter(l => l.trim());
            for (const line of lines) {
                const m = line.match(/v_([a-z]{2}\d{6})="(.+)"/);
                if (!m) continue;
                const code = m[1];
                const f = m[2].split('~');
                // 字段顺序（实测验证）：[1]名称 [3]当前价 [31]涨跌额 [32]涨跌幅% [36]成交量(手) [37]成交额(万)
                results[code] = {
                    name: f[1] || code,
                    price: parseFloat(f[3]) || 0,
                    change: parseFloat(f[31]) || 0,
                    changePercent: parseFloat(f[32]) || 0,
                    volume: parseInt(f[36]) || 0,
                    turnover: (parseFloat(f[37]) || 0) * 10000,
                };
            }
        } catch (e) { console.warn('报价获取失败', e); }
    }));
    return results;
}

async function fetchKLine(code, count = 120) {
    if (typeof window.fetchKLine === 'function') return await window.fetchKLine(code, count);
    // 兜底（页面单独打开时使用）
    const url = `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${encodeURIComponent(code)},day,,,${count},qfq`;
    const data = await (await fetch(url, { signal: AbortSignal.timeout(8000) })).json();
    const key = Object.keys(data.data)[0];
    const arr = (data.data[key] && (data.data[key].qfqday || data.data[key].day)) || [];
    return arr.map(row => ({
        date: row[0], open: +row[1], close: +row[2], high: +row[3], low: +row[4], volume: +row[5]
    })).filter(r => r.date && !isNaN(r.open));
}

// ============================================================
// 全局状态
// ============================================================
let stockDataMap = {};
let countdownSec = 60;

const MARKET = [
    {name:'上证指数', c:'000001', p:'1'}, {name:'深证成指', c:'399001', p:'0'},
    {name:'创业板指', c:'399006', p:'0'}, {name:'科创50', c:'000688', p:'1'},
    {name:'沪深300', c:'000300', p:'1'}, {name:'中证500', c:'000905', p:'1'},
    {name:'北证50',  c:'899050', p:'2'},
];
let mq = {};

function toFullCode(c) {
    return c.p === '0' ? 'sz' + c.c
         : c.p === '2' ? 'bj' + c.c
         : 'sh' + c.c;
}

// ============================================================
// 工具
// ============================================================
function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 3000);
}
function formatTime(ts) {
    const d = new Date(ts);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function updateTimeDisplay() {
    const now = new Date();
    const t = document.getElementById('updateTime');
    if (t) t.textContent = now.toLocaleString('zh-CN', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
}

// 简易技术信号（无 app.js 时兜底）
function simpleSignal(closes) {
    if (closes.length < 20) return { overall: '数据不足', action: '' };
    const n = closes.length;
    const ma5  = closes.slice(-5).reduce((a,b)=>a+b,0)/5;
    const ma20 = closes.slice(-20).reduce((a,b)=>a+b,0)/20;
    const last = closes[n-1], prev = closes[n-2];
    const change = last - prev;
    const pct = (change / prev) * 100;
    let score = 0;
    if (last > ma5) score++; if (last > ma20) score++; if (ma5 > ma20) score++;
    if (change > 0) score += 0.5; else score -= 0.5;
    let overall = '中性', action = '';
    if (score >= 2.5) overall = '买入';
    else if (score <= 0.5) overall = '卖出';
    if (overall === '买入') action = pct > 0 ? '顺势跟进，注意仓位' : '回调低吸机会';
    else if (overall === '卖出') action = pct < 0 ? '跌破均线，建议减仓' : '高位滞涨，谨慎';
    return { overall, action };
}

// ============================================================
// 数据加载
// ============================================================
async function refreshStocks() {
    const stocks = loadStocks();
    if (!stocks.length) {
        document.getElementById('stockList').innerHTML =
            `<div style="text-align:center; color:var(--text-muted); padding:40px 0;">暂无自选股，请添加</div>`;
        return;
    }

    const codes = stocks.map(s => s.code);
    let quotes = {};
    try { quotes = await fetchQuotesBatch(codes); } catch (e) { console.warn(e); }

    for (const s of stocks) {
        const q = quotes[s.code];
        if (q && q.price > 0) {
            stockDataMap[s.code] = {
                price: q.price, change: q.change, changePercent: q.changePercent, volume: q.volume,
                updateTime: Date.now(),
                signal: stockDataMap[s.code]?.signal || '--',
                action: stockDataMap[s.code]?.action || '',
            };
        } else if (!stockDataMap[s.code]) {
            stockDataMap[s.code] = { price: '--', change: 0, changePercent: 0, volume: 0, updateTime: Date.now(), signal: '--', action: '' };
        }
    }

    // 计算信号
    for (const s of stocks) {
        const data = stockDataMap[s.code];
        if (!data || data.price === '--') continue;
        try {
            const kline = await fetchKLine(s.code, 120);
            if (kline && kline.length > 20) {
                const closes = kline.map(d => d.close);
                // 优先用 app.js 的 summarize，本地兜底
                let sig;
                if (typeof window.summarize === 'function') {
                    const highs = kline.map(d => d.high);
                    const lows = kline.map(d => d.low);
                    const opens = kline.map(d => d.open);
                    const vols = kline.map(d => d.volume);
                    const prev = kline[kline.length-2] || kline[kline.length-1];
                    // 简单算 pivot（用 app.js 的真实算法）
                    let pivots = null;
                    if (typeof window.calcPivots === 'function') {
                        pivots = window.calcPivots(prev.high, prev.low, prev.close);
                    }
                    sig = window.summarize(closes, highs, lows, opens, vols, pivots);
                    data.signal = sig.overall;
                    data.action = sig.action;
                } else {
                    sig = simpleSignal(closes);
                    data.signal = sig.overall;
                    data.action = sig.action;
                }
            } else {
                data.signal = '数据不足';
                data.action = '';
            }
        } catch (e) {
            data.signal = '--';
            data.action = '计算失败';
        }
    }

    renderStockCards(stocks);
    updateTimeDisplay();
}

function renderStockCards(stocks) {
    const list = document.getElementById('stockList');
    if (!stocks.length) {
        list.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:40px 0;">暂无自选股</div>`;
        return;
    }

    let html = '';
    for (const s of stocks) {
        const d = stockDataMap[s.code] || {};
        const price = d.price ?? '--';
        const change = d.change ?? 0;
        const changePct = d.changePercent ?? 0;
        const signal = d.signal || '--';
        const action = d.action || '';
        const updateTime = d.updateTime ? formatTime(d.updateTime) : '--';
        const isFresh = d.updateTime && (Date.now() - d.updateTime < 5 * 60 * 1000);

        const priceDisplay = typeof price === 'number' ? price.toFixed(2) : price;
        const chgDisplay = typeof change === 'number' ? change.toFixed(2) : '0.00';
        const pctDisplay = typeof changePct === 'number' ? changePct.toFixed(2) : '0.00';
        const cls = change >= 0 ? 'up' : 'down';
        const sign = change >= 0 ? '+' : '';

        let badgeCls = 'neutral', badgeText = signal;
        if (['强力买入','买入','左侧试探','超卖区'].includes(signal)) { badgeCls = 'buy'; badgeText = signal === '超卖区' ? '超卖' : '买入'; }
        else if (['强力卖出','卖出','高空防守','超买区'].includes(signal)) { badgeCls = 'sell'; badgeText = signal === '超买区' ? '超买' : '卖出'; }
        else if (['中性','观望','持有'].includes(signal)) { badgeCls = 'hold'; badgeText = '持有'; }

        const dotCls = isFresh ? 'fresh' : (d.updateTime ? 'stale' : 'old');
        const actionShort = action.length > 28 ? action.slice(0, 26) + '…' : action;

        html += `
            <div class="stock-card" data-code="${s.code}">
                <div class="hold-progress"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><circle cx="50" cy="50" r="48" pathLength="1000"/></svg></div>
                <div class="top">
                    <span class="name">${s.name}</span>
                    <span class="code">${s.code.toUpperCase()}</span>
                </div>
                <div class="price-row">
                    <span class="price">${priceDisplay}</span>
                    <span class="chg ${cls}">${sign}${chgDisplay} (${sign}${pctDisplay}%)</span>
                </div>
                <div class="signal-area">
                    <span class="signal-badge ${badgeCls}">${badgeText}</span>
                    ${actionShort ? `<span class="action-text">${actionShort}</span>` : ''}
                </div>
                <div class="footer">
                    <span class="update-time">
                        <span class="dot ${dotCls}"></span>
                        更新于 ${updateTime}
                    </span>
                    <span class="fresh-label">${isFresh ? '✓ 最新' : '缓存'}</span>
                </div>
            </div>
        `;
    }
    list.innerHTML = html;

    // 绑定点击（去详情）
    list.querySelectorAll('.stock-card').forEach(card => {
        card.addEventListener('click', (e) => {
            if (card.classList.contains('deleting') || card.classList.contains('removing')) return;
            const code = card.dataset.code;
            if (code) location.href = `stock.html?code=${encodeURIComponent(code)}`;
        });
    });

    // 绑定长按删除
    bindLongPressDelete(list);
}

// ============================================================
// 长按删除
// ============================================================
function bindLongPressDelete(container) {
    const LONG_PRESS_MS = 700;   // 长按阈值
    const SCROLL_TOLERANCE = 10; // 移动容差（像素）

    container.querySelectorAll('.stock-card').forEach(card => {
        let timer = null;
        let startX = 0, startY = 0, moved = false;
        let progressCircle = null;
        let progressTotal = 1000;
        let progressStart = 0;
        let rafId = null;

        const cancel = () => {
            if (timer) { clearTimeout(timer); timer = null; }
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
            card.classList.remove('deleting');
            if (progressCircle) progressCircle.style.strokeDashoffset = progressTotal;
        };

        const animate = (timestamp) => {
            if (!progressStart) progressStart = timestamp;
            const elapsed = timestamp - progressStart;
            const progress = Math.min(elapsed / LONG_PRESS_MS, 1);
            if (progressCircle) {
                progressCircle.style.strokeDashoffset = progressTotal * (1 - progress);
            }
            if (progress >= 1) {
                // 长按达成 → 弹确认
                rafId = null;
                if (progressCircle) progressCircle.style.strokeDashoffset = 0;
                const code = card.dataset.code;
                const name = card.querySelector('.name')?.textContent || code;
                if (confirm(`🗑️ 删除自选股 "${name}" (${code.toUpperCase()})？`)) {
                    removeStock(code);
                    card.classList.add('removing');
                    setTimeout(() => refreshStocks(), 360);
                } else {
                    cancel();
                }
            } else {
                rafId = requestAnimationFrame(animate);
            }
        };

        const start = (x, y) => {
            if (card.classList.contains('removing')) return;
            startX = x; startY = y; moved = false;
            progressCircle = card.querySelector('.hold-progress circle');
            if (progressCircle) {
                progressCircle.style.strokeDashoffset = progressTotal;
            }
            card.classList.add('deleting');
            progressStart = 0;
            rafId = requestAnimationFrame(animate);
        };

        // 触摸事件
        card.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            start(t.clientX, t.clientY);
        }, { passive: true });
        card.addEventListener('touchmove', (e) => {
            const t = e.touches[0];
            if (Math.hypot(t.clientX - startX, t.clientY - startY) > SCROLL_TOLERANCE) {
                cancel();
            }
        }, { passive: true });
        card.addEventListener('touchend', cancel);
        card.addEventListener('touchcancel', cancel);

        // 鼠标事件
        card.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            start(e.clientX, e.clientY);
        });
        card.addEventListener('mousemove', (e) => {
            if (Math.hypot(e.clientX - startX, e.clientY - startY) > SCROLL_TOLERANCE) cancel();
        });
        card.addEventListener('mouseup', cancel);
        card.addEventListener('mouseleave', cancel);
    });
}

// ============================================================
// 添加逻辑（代码/名称/图片OCR）
// ============================================================
document.getElementById('addBtn').addEventListener('click', () => {
    const input = document.getElementById('newStockInput').value.trim();
    if (!input) { toast('请输入股票名称或代码'); return; }

    if (/^\d{6}$/.test(input)) {
        const res = addStock(input);
        if (res.added) {
            toast(`✅ 已添加 ${res.list[0].name}`);
            document.getElementById('newStockInput').value = '';
            refreshStocks();
        } else {
            toast(res.reason === 'duplicate' ? '该股票已在自选' : '添加失败，请检查代码');
        }
        return;
    }

    // 名称匹配
    const allKnown = [...DEFAULT_STOCKS, ...loadStocks()];
    const unique = {};
    allKnown.forEach(s => unique[s.code] = s);
    const candidates = Object.values(unique).filter(s => s.name.includes(input));
    if (candidates.length === 0) {
        toast('未找到匹配的股票，请尝试输入6位代码');
        return;
    }
    if (candidates.length > 1) {
        toast(`找到多个匹配（${candidates.map(c=>c.name).join('、')}），请使用代码添加`);
        return;
    }
    const target = candidates[0];
    const res = addStock(target.code);
    if (res.added) {
        toast(`✅ 已添加 ${res.list[0].name}`);
        document.getElementById('newStockInput').value = '';
        refreshStocks();
    } else {
        toast(res.reason === 'duplicate' ? '该股票已在自选' : '添加失败');
    }
});

document.getElementById('newStockInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('addBtn').click();
});

// ============================================================
// 图片 OCR 识别（Tesseract.js）
// ============================================================
const ocrBtn = document.getElementById('ocrBtn');
const ocrFile = document.getElementById('ocrFile');

ocrBtn.addEventListener('click', () => {
    // 移动端直接调起相机/相册选择
    ocrFile.click();
});
ocrFile.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = ''; // 清空，允许重复选同一张

    const overlay = showOcrOverlay('正在识别图片…', '首次使用需下载 OCR 引擎，约 2MB');

    try {
        if (typeof Tesseract === 'undefined') {
            throw new Error('OCR 引擎未加载，请检查网络');
        }

        const { data: { text } } = await Tesseract.recognize(file, 'eng', {
            logger: m => {
                if (m.status === 'recognizing text') {
                    updateOcrOverlay(`识别中… ${Math.round(m.progress * 100)}%`, '');
                } else if (m.status) {
                    updateOcrOverlay(m.status, '');
                }
            }
        });

        const codes = extractStockCodes(text);
        if (codes.length === 0) {
            updateOcrOverlay('❌ 未识别到有效股票代码', '请确保图片清晰且包含 6 位数字代码', true);
            return;
        }

        updateOcrOverlay(`✅ 识别到 ${codes.length} 个代码`, codes.join(', '));
        let addedCount = 0;
        let dupCount = 0;
        for (const code of codes) {
            const res = addStock(code);
            if (res.added) addedCount++;
            else if (res.reason === 'duplicate') dupCount++;
        }
        const msg = `已添加 ${addedCount} 个` + (dupCount ? `（${dupCount} 个已存在）` : '');
        setTimeout(() => {
            hideOcrOverlay();
            toast(msg);
            refreshStocks();
        }, 1200);
    } catch (err) {
        console.error(err);
        updateOcrOverlay('❌ 识别失败', err.message || '请重试', true);
    }
});

// 从 OCR 文本中提取 6 位数字代码（支持前带 sh/sz/bj 前缀）
function extractStockCodes(text) {
    if (!text) return [];
    // 把换行/空白统一成空格
    const normalized = text.replace(/[\s\n\r]+/g, ' ');
    const results = new Set();

    // 1) 带前缀的：sh600519 / sz300750 / bj899050
    const prefixed = normalized.match(/\b([a-z]{2})\s*(\d{6})\b/gi) || [];
    for (const m of prefixed) {
        const [, prefix, num] = m.match(/([a-z]{2})\s*(\d{6})/i);
        const p = prefix.toLowerCase();
        if (['sh','sz','bj'].includes(p)) results.add(p + num);
    }

    // 2) 纯 6 位数字（且看起来像股票代码：首位 0-8）
    const plain = normalized.match(/\b(\d{6})\b/g) || [];
    for (const num of plain) {
        // 简单启发式：6 位数字 + 第一位是 0~8（排除 9 开头的可能是其他）
        if (/^[0-8]\d{5}$/.test(num)) results.add(num);
    }

    return Array.from(results).slice(0, 20); // 一次最多 20 个
}

function showOcrOverlay(msg, sub) {
    let ov = document.querySelector('.ocr-overlay');
    if (!ov) {
        ov = document.createElement('div');
        ov.className = 'ocr-overlay';
        ov.innerHTML = `
            <div class="spinner"></div>
            <div class="ocr-msg"></div>
            <div class="ocr-sub"></div>
            <button class="ocr-cancel">取消</button>
        `;
        document.body.appendChild(ov);
        ov.querySelector('.ocr-cancel').addEventListener('click', () => {
            hideOcrOverlay();
            // 中断识别（Tesseract 没法强制中断，只能让后续更新被忽略）
            isOcrCanceled = true;
        });
    } else {
        ov.querySelector('.spinner').style.display = '';
    }
    ov.querySelector('.ocr-msg').textContent = msg;
    ov.querySelector('.ocr-sub').textContent = sub || '';
    ov.querySelector('.ocr-cancel').textContent = '取消';
    ov.style.display = 'flex';
    isOcrCanceled = false;
    return ov;
}
function updateOcrOverlay(msg, sub, hideSpinner) {
    const ov = document.querySelector('.ocr-overlay');
    if (!ov) return;
    ov.querySelector('.ocr-msg').textContent = msg;
    ov.querySelector('.ocr-sub').textContent = sub || '';
    if (hideSpinner) ov.querySelector('.spinner').style.display = 'none';
}
function hideOcrOverlay() {
    const ov = document.querySelector('.ocr-overlay');
    if (ov) ov.style.display = 'none';
}
let isOcrCanceled = false;

// ============================================================
// 指数 ticker
// ============================================================
async function loadMarketData() {
    try {
        const codes = MARKET.map(toFullCode);
        mq = await fetchQuotesBatch(codes);
        renderMarketTicker();
    } catch (e) { console.warn('指数加载失败', e); }
}
function renderMarketTicker() {
    const track = document.getElementById('tickerTrack');
    if (!track) return;
    const items = [];
    MARKET.forEach(i => {
        const code = toFullCode(i);
        const d = mq[code];
        if (!d || !d.price) {
            items.push(`<span class="ticker-item flat"><span class="t-name">${i.name}</span><span class="t-price">--</span><span class="t-pct">--</span></span>`);
            return;
        }
        const cls = d.changePercent > 0 ? 'up' : (d.changePercent < 0 ? 'down' : 'flat');
        const sign = d.changePercent > 0 ? '+' : '';
        items.push(`<span class="ticker-item ${cls}"><span class="t-name">${i.name}</span><span class="t-price">${d.price.toFixed(2)}</span><span class="t-pct">${sign}${d.changePercent.toFixed(2)}%</span></span>`);
    });
    if (!items.length) { track.innerHTML = '<div class="ticker-loading">暂无指数数据</div>'; return; }
    track.innerHTML = items.join('') + items.join('');
}

// ============================================================
// 定时器
// ============================================================
function updateCdown() {
    document.getElementById('countdown').textContent = countdownSec + 's↻';
}
setInterval(() => {
    countdownSec--;
    if (countdownSec <= 0) countdownSec = 60;
    updateCdown();
}, 1000);

// ============================================================
// 初始化
// ============================================================
window.addEventListener('load', () => {
    refreshStocks();
    loadMarketData();
    setInterval(refreshStocks, 60000);
    setInterval(loadMarketData, 60000);
    updateTimeDisplay();
    setInterval(updateTimeDisplay, 1000);
});
