<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>自选股 · 智能参谋</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            background: #0b0b18;
            color: #e0e0e0;
            padding: 12px;
            min-height: 100vh;
        }
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 14px 18px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #14142a, #1a1a38);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.06);
        }
        .header h1 { font-size: 18px; color: #fff; font-weight: 700; }
        .header h1 span { color: #6666cc; font-size: 11px; font-weight: 400; margin-left: 4px; }
        .header .info { text-align: right; font-size: 11px; color: #666; }
        .header .info .time { color: #aaa; font-size: 12px; font-weight: 600; }
        .status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #22c55e; margin-right: 5px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
        }
        .tab {
            flex-shrink: 0;
            padding: 9px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            color: #666;
            background: #14142a;
            border: 1px solid transparent;
            cursor: pointer;
        }
        .tab.active { color: #fff; background: #2a2a5a; border-color: #4444aa; }
        .tab:active { transform: scale(.96); }
        .panel { display: none; }
        .panel.active { display: block; }

        /* 自选股卡片网格 */
        .stock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 14px;
        }
        .stock-card {
            background: #14142a;
            border-radius: 14px;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,.05);
            cursor: pointer;
            transition: .15s;
            position: relative;
        }
        .stock-card:active { transform: scale(.96); border-color: #4444aa; }
        .stock-card .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .stock-card .name {
            font-size: 14px;
            color: #ccccee;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }
        .stock-card .code {
            font-size: 10px;
            color: #5555aa;
            margin-left: 4px;
        }
        .stock-card .price-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin: 4px 0 2px;
        }
        .stock-card .price {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }
        .stock-card .chg {
            font-size: 13px;
            font-weight: 600;
        }
        .up { color: #f23645; }
        .down { color: #22ab55; }
        .flat { color: #666; }

        .stock-card .signal-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 6px;
            background: rgba(255,255,255,.06);
            color: #aaa;
        }
        .signal-badge.buy { background: rgba(242,54,69,.2); color: #f23645; }
        .signal-badge.sell { background: rgba(34,171,85,.2); color: #22ab55; }
        .signal-badge.hold { background: rgba(255,193,7,.15); color: #ffc107; }
        .signal-badge.neutral { background: rgba(255,255,255,.06); color: #8888aa; }

        .stock-card .action-text {
            font-size: 11px;
            color: #8888aa;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .stock-card .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 10px;
            color: #666;
            border-top: 1px solid rgba(255,255,255,.05);
            padding-top: 6px;
        }
        .stock-card .update-time {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .stock-card .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.fresh { background: #22c55e; }
        .dot.stale { background: #f59e0b; }
        .dot.old { background: #f23645; }

        /* ETF 面板样式 */
        .index-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
        .index-item {
            flex-shrink: 0; background: #14142a; border-radius: 10px; padding: 10px 14px; min-width: 115px;
            border: 1px solid rgba(255,255,255,.05);
        }
        .index-item .i-name { font-size: 11px; color: #7878aa; }
        .index-item .i-price { font-size: 15px; font-weight: 700; color: #fff; margin: 2px 0; }
        .index-item .i-chg { font-size: 12px; font-weight: 600; }

        .etf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 10px;
            margin-bottom: 14px;
        }
        .etf-card {
            background: #14142a;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid rgba(255,255,255,.05);
            cursor: pointer;
            transition: .15s;
        }
        .etf-card:active { transform: scale(.96); border-color: #4444aa; }
        .etf-card .top { display: flex; justify-content: space-between; align-items: flex-start; }
        .etf-card .name { font-size: 12px; color: #ccccee; font-weight: 600; }
        .etf-card .code { font-size: 10px; color: #5555aa; }
        .etf-card .idx { font-size: 10px; color: #5555aa; margin-top: -1px; }
        .etf-card .price-row { display: flex; align-items: baseline; gap: 8px; margin: 2px 0; }
        .etf-card .price { font-size: 18px; font-weight: 700; color: #fff; }
        .etf-card .chg { font-size: 12px; font-weight: 600; }
        .etf-card .divider { height: 1px; background: rgba(255,255,255,.05); margin: 4px 0; }
        .etf-card .fund-row { display: flex; align-items: center; justify-content: space-between; font-size: 11px; }
        .etf-card .fund-row .l { color: #7878aa; }
        .etf-card .period-row { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
        .etf-card .period-row .tag { font-size: 9px; padding: 1px 5px; border-radius: 3px; background: rgba(255,255,255,.03); color: #7777aa; }
        .period-row .tag.up { color: #f23645; background: rgba(242,54,69,.1); }
        .period-row .tag.down { color: #22ab55; background: rgba(34,171,85,.1); }
        .period-row .tag.na { color: #555; background: rgba(255,255,255,.02); }

        .add-bar {
            display: flex; gap: 6px; padding: 10px 14px; background: #14142a; border-radius: 12px;
            border: 1px dashed rgba(255,255,255,.1); margin-bottom: 14px; flex-wrap: wrap; align-items: center;
        }
        .add-bar input {
            flex: 1; min-width: 120px; background: #0b0b18; border: 1px solid rgba(255,255,255,.1); border-radius: 8px;
            padding: 8px 10px; color: #ddd; font-size: 13px; outline: none; font-family: inherit;
        }
        .add-bar input:focus { border-color: #4444aa; }
        .add-bar input::placeholder { color: #555; }
        .add-bar button {
            padding: 8px 16px; background: #2a2a5a; border: 1px solid #4444aa; border-radius: 8px;
            color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
        }
        .add-bar button:active { transform: scale(.96); }
        .add-bar .hint { font-size: 10px; color: #555; width: 100%; text-align: center; margin-top: 2px; }

        .footer { text-align: center; padding: 16px 0 8px; font-size: 10px; color: #333355; }
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #2a2a5a; color: #fff; padding: 10px 20px; border-radius: 10px;
            font-size: 13px; z-index: 999; border: 1px solid #4444aa; animation: fadeIn .3s; max-width: 90vw; text-align: center;
        }
        @keyframes fadeIn { from { opacity:0; transform: translateX(-50%) translateY(-10px); } to { opacity:1; transform: translateX(-50%) translateY(0); } }

        @media (max-width: 480px) {
            .stock-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .stock-card { padding: 10px; }
            .stock-card .price { font-size: 17px; }
            .header { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<div class="header">
    <div style="display:flex; align-items:center; gap:10px;">
        <h1>📊 自选股 <span>智能参谋</span></h1>
    </div>
    <div class="info">
        <div><span class="status-dot"></span><span class="time" id="updateTime">--</span></div>
        <div style="margin-top:2px" id="countdown">60s↻</div>
    </div>
</div>

<div class="tabs">
    <div class="tab active" data-tab="main">📈 自选股</div>
    <div class="tab" data-tab="etf">📊 宽基ETF</div>
</div>

<!-- 自选股面板 -->
<div class="panel active" id="panel-main">
    <div class="stock-grid" id="stockGrid"></div>
    <div class="add-bar">
        <input id="newStockInput" placeholder="输入代码或名称（如 600519 或 贵州茅台）" autocomplete="off">
        <button id="addBtn">➕ 添加</button>
        <div class="hint">支持沪深/北交所 · 输入名称或6位代码均可</div>
    </div>
</div>

<!-- 宽基ETF面板 -->
<div class="panel" id="panel-etf">
    <div class="index-strip" id="indexStrip"></div>
    <div class="etf-grid" id="etfGrid"></div>
</div>

<div class="footer">点击自选股查看详细分析 · 60秒自动刷新</div>

<script src="app.js"></script>
<script>
// ============================================================
// 首页：自选股展示 + 智能添加（支持名称/代码） + 信号显示
// ============================================================

// ---------- 全局状态 ----------
let stockDataMap = {};          // { code: { price, change, changePercent, volume, signal, action, updateTime } }
let countdownSec = 60;

const DEFAULT_ETFS = [
    { name:'上证50ETF',   code:'510050', p:'1', idx:'上证50' },
    { name:'沪深300ETF',  code:'510300', p:'1', idx:'沪深300' },
    { name:'中证500ETF',  code:'510500', p:'1', idx:'中证500' },
    { name:'中证1000ETF', code:'512100', p:'1', idx:'中证1000' },
    { name:'创业板ETF',   code:'159915', p:'0', idx:'创业板指' },
    { name:'科创50ETF',   code:'588000', p:'1', idx:'科创50' },
];

// ---------- 工具函数 ----------
function toast(m) {
    const e = document.createElement('div');
    e.className = 'toast';
    e.textContent = m;
    document.body.appendChild(e);
    setTimeout(() => e.remove(), 3000);
}

// ========== 修正：腾讯qt字段索引 ==========
async function fetchQuotesBatch(codes) {
    if (!codes || codes.length === 0) return {};
    const BATCH_SIZE = 50;
    const batches = [];
    for (let i = 0; i < codes.length; i += BATCH_SIZE) {
        batches.push(codes.slice(i, i + BATCH_SIZE));
    }
    const results = {};
    await Promise.all(batches.map(async (batch) => {
        const codeStr = batch.join(',');
        const url = `https://qt.gtimg.cn/q=${codeStr}`;
        try {
            const resp = await fetch(url, { signal: AbortSignal.timeout(6000) });
            const text = await resp.text();
            const lines = text.split('\n').filter(line => line.trim());
            for (const line of lines) {
                const match = line.match(/v_([a-z]{2}\d{6})="(.+)"/);
                if (!match) continue;
                const code = match[1];
                const fields = match[2].split('~');
                // 字段索引（腾讯qt标准）：
                // 0=市场编号, 1=名称, 2=当前价, 3=涨跌幅(%), 4=涨跌额, 5=成交量(手), 6=成交额(元)
                results[code] = {
                    name: fields[1] || code,
                    price: parseFloat(fields[2]) || 0,
                    changePercent: parseFloat(fields[3]) || 0,
                    change: parseFloat(fields[4]) || 0,
                    volume: parseInt(fields[5]) || 0,
                    turnover: parseFloat(fields[6]) || 0,
                };
            }
        } catch (e) {
            console.warn(`批量报价失败: ${codeStr}`, e.message);
        }
    }));
    return results;
}

// 获取K线（使用app.js的fetchKLine）
async function getKLine(code, count = 120) {
    if (typeof window.fetchKLine === 'function') {
        return await window.fetchKLine(code, count);
    } else {
        return await fetchKLine(code, count);
    }
}

// ---------- 核心：更新自选股数据 ----------
async function refreshStocks() {
    const stocks = loadStocks();
    if (!stocks.length) {
        document.getElementById('stockGrid').innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#666; padding:30px 0;">暂无自选股，请添加</div>`;
        return;
    }

    // 1. 批量获取实时报价
    const codes = stocks.map(s => s.code);
    let quotes = {};
    try {
        quotes = await fetchQuotesBatch(codes);
    } catch (e) {
        console.warn('获取报价失败，使用缓存', e);
    }

    // 2. 更新 stockDataMap
    for (const s of stocks) {
        const code = s.code;
        const q = quotes[code];
        if (q && q.price > 0) {
            stockDataMap[code] = {
                price: q.price,
                change: q.change,
                changePercent: q.changePercent,
                volume: q.volume,
                updateTime: Date.now(),
                signal: stockDataMap[code]?.signal || '--',
                action: stockDataMap[code]?.action || '',
            };
        } else {
            // 无有效报价，保留旧数据或占位
            if (!stockDataMap[code]) {
                stockDataMap[code] = {
                    price: '--',
                    change: 0,
                    changePercent: 0,
                    volume: 0,
                    updateTime: Date.now(),
                    signal: '--',
                    action: '',
                };
            }
        }
    }

    // 3. 异步计算信号（仅当有K线且报价有效）
    for (const s of stocks) {
        const code = s.code;
        const data = stockDataMap[code];
        if (!data || data.price === '--') continue; // 无报价不计算信号
        try {
            const kline = await getKLine(code, 120);
            if (kline && kline.length > 60) {
                const closes = kline.map(d => d.close);
                const highs = kline.map(d => d.high);
                const lows = kline.map(d => d.low);
                const opens = kline.map(d => d.open);
                const volumes = kline.map(d => d.volume);
                const prevClose = closes[closes.length - 2] || closes[closes.length - 1];
                const prevHigh = highs[highs.length - 2] || highs[highs.length - 1];
                const prevLow = lows[lows.length - 2] || lows[lows.length - 1];
                const pivots = calcPivots(prevHigh, prevLow, prevClose);
                const sig = summarize(closes, highs, lows, opens, volumes, pivots);
                stockDataMap[code].signal = sig.overall;
                stockDataMap[code].action = sig.action;
                stockDataMap[code].position = sig.position;
                stockDataMap[code].confidence = sig.confidence;
            } else {
                stockDataMap[code].signal = '数据不足';
                stockDataMap[code].action = '';
            }
        } catch (e) {
            console.warn(`信号计算失败 ${code}`, e);
            stockDataMap[code].signal = '--';
            stockDataMap[code].action = '计算失败';
        }
    }

    // 4. 渲染卡片
    renderStockCards(stocks);
    updateTimeDisplay();
}

// ---------- 渲染自选股卡片 ----------
function renderStockCards(stocks) {
    const grid = document.getElementById('stockGrid');
    if (!stocks.length) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#666; padding:30px 0;">暂无自选股，请添加</div>`;
        return;
    }

    let html = '';
    for (const s of stocks) {
        const data = stockDataMap[s.code] || {};
        const price = data.price ?? '--';
        const change = data.change ?? 0;
        const changePercent = data.changePercent ?? 0;
        const signal = data.signal || '--';
        const action = data.action || '';
        const updateTime = data.updateTime ? formatTime(data.updateTime) : '--';
        const isFresh = data.updateTime && (Date.now() - data.updateTime < 5 * 60 * 1000);

        // 格式化
        const priceDisplay = typeof price === 'number' ? price.toFixed(2) : price;
        const changeDisplay = typeof change === 'number' ? change.toFixed(2) : '0.00';
        const changePctDisplay = typeof changePercent === 'number' ? changePercent.toFixed(2) : '0.00';
        const changeClass = change >= 0 ? 'up' : 'down';
        const sign = change >= 0 ? '+' : '';

        // 信号徽章
        let badgeClass = 'neutral';
        let badgeText = signal;
        if (['强力买入','买入','左侧试探'].includes(signal)) { badgeClass = 'buy'; badgeText = '买入'; }
        else if (['强力卖出','卖出','高空防守'].includes(signal)) { badgeClass = 'sell'; badgeText = '卖出'; }
        else if (signal === '中性' || signal === '观望') { badgeClass = 'hold'; badgeText = '持有'; }
        else { badgeClass = 'neutral'; badgeText = signal; }

        const dotClass = isFresh ? 'fresh' : (data.updateTime ? 'stale' : 'old');
        const actionDisplay = action.length > 30 ? action.slice(0, 28) + '…' : action;

        html += `
            <div class="stock-card" data-code="${s.code}">
                <div class="top">
                    <span class="name">${s.name}</span>
                    <span class="code">${s.code.toUpperCase()}</span>
                </div>
                <div class="price-row">
                    <span class="price">${priceDisplay}</span>
                    <span class="chg ${changeClass}">${sign}${changeDisplay} (${sign}${changePctDisplay}%)</span>
                </div>
                <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                    <span class="signal-badge ${badgeClass}">${badgeText}</span>
                    ${actionDisplay ? `<span class="action-text">${actionDisplay}</span>` : ''}
                </div>
                <div class="footer">
                    <span class="update-time">
                        <span class="dot ${dotClass}"></span>
                        更新于 ${updateTime}
                    </span>
                    <span style="font-size:9px; color:#555;">${isFresh ? '✓ 最新' : '缓存'}</span>
                </div>
            </div>
        `;
    }
    grid.innerHTML = html;

    // 点击卡片跳转详情
    grid.querySelectorAll('.stock-card').forEach(card => {
        card.addEventListener('click', () => {
            const code = card.dataset.code;
            if (code) location.href = `stock.html?code=${encodeURIComponent(code)}`;
        });
    });
}

// ---------- 工具函数 ----------
function formatTime(ts) {
    const d = new Date(ts);
    return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
}

function updateTimeDisplay() {
    const now = new Date();
    document.getElementById('updateTime').textContent = now.toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
}

// ---------- 添加自选股（支持名称或代码） ----------
document.getElementById('addBtn').addEventListener('click', () => {
    const input = document.getElementById('newStockInput').value.trim();
    if (!input) { toast('请输入股票名称或代码'); return; }

    // 1. 尝试作为6位数字代码处理
    if (/^\d{6}$/.test(input)) {
        const result = addStock(input);
        if (result.added) {
            toast(`✅ 已添加 ${result.list[0].name}`);
            document.getElementById('newStockInput').value = '';
            refreshStocks();
        } else {
            toast(result.reason === 'duplicate' ? '该股票已在自选' : '添加失败，请检查代码');
        }
        return;
    }

    // 2. 作为名称处理：在默认股票和当前自选中查找包含关键词的股票
    const allKnown = [...DEFAULT_STOCKS, ...loadStocks()];
    // 去重（按code）
    const uniqueMap = {};
    allKnown.forEach(s => uniqueMap[s.code] = s);
    const candidates = Object.values(uniqueMap).filter(s => s.name.includes(input));
    if (candidates.length === 0) {
        toast('未找到匹配的股票，请尝试输入6位代码');
        return;
    }
    if (candidates.length > 1) {
        // 若多个匹配，列出选项（简单起见，只取第一个）
        toast(`找到多个匹配（${candidates.map(c=>c.name).join('、')}），请使用代码添加`);
        return;
    }
    // 唯一匹配
    const target = candidates[0];
    const result = addStock(target.code);
    if (result.added) {
        toast(`✅ 已添加 ${result.list[0].name}`);
        document.getElementById('newStockInput').value = '';
        refreshStocks();
    } else {
        toast(result.reason === 'duplicate' ? '该股票已在自选' : '添加失败');
    }
});

// 回车键触发添加
document.getElementById('newStockInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('addBtn').click();
});

// ---------- 选项卡切换 ----------
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        if (tab.dataset.tab === 'etf') loadETFData();
    });
});

// ---------- ETF数据（保留，已修正字段） ----------
const MARKET = [
    {name:'上证指数', c:'000001', p:'1'}, {name:'深证成指', c:'399001', p:'0'},
    {name:'创业板指', c:'399006', p:'0'}, {name:'科创50', c:'000688', p:'1'},
    {name:'沪深300', c:'000300', p:'1'}, {name:'中证500', c:'000905', p:'1'},
];
let mq = {}, eq = {};

async function loadETFData() {
    try {
        const marketCodes = MARKET.map(i => (i.p === '1' ? 'sh' : 'sz') + i.c);
        const etfCodes = allEtfs().map(e => e.code);
        const [mq_, eq_] = await Promise.all([
            fetchQuotesBatch(marketCodes),
            fetchQuotesBatch(etfCodes)
        ]);
        mq = mq_; eq = eq_;
        renderIndexStrip();
        renderETFGrid();
    } catch(e) { console.warn('ETF数据加载失败', e); }
}

function renderIndexStrip() {
    const s = document.getElementById('indexStrip');
    s.innerHTML = '';
    MARKET.forEach(i => {
        const code = (i.p === '1' ? 'sh' : 'sz') + i.c;
        const d = mq[code];
        const div = document.createElement('div');
        div.className = 'index-item';
        if (d && d.price) {
            const cls = d.changePercent >= 0 ? 'up' : 'down';
            div.innerHTML = `<div class="i-name">${i.name}</div><div class="i-price">${d.price.toFixed(2)}</div><div class="i-chg ${cls}">${d.changePercent>=0?'▲':'▼'} ${d.changePercent.toFixed(2)}%</div>`;
        } else {
            div.innerHTML = `<div class="i-name">${i.name}</div><div class="i-price" style="color:#555">--</div><div class="i-chg flat">--</div>`;
        }
        s.appendChild(div);
    });
}

function renderETFGrid() {
    const g = document.getElementById('etfGrid');
    g.innerHTML = '';
    allEtfs().forEach(e => {
        const q = eq[e.code];
        const card = document.createElement('div');
        card.className = 'etf-card';
        let html = `<div class="top"><div><div class="name">${e.name}</div><div class="code">${e.code}</div></div></div>`;
        if (e.idx) html += `<div class="idx">📎 ${e.idx}</div>`;
        if (q && q.price != null) {
            const cls = q.changePercent >= 0 ? 'up' : 'down';
            html += `<div class="price-row"><span class="price">${q.price.toFixed(3)}</span><span class="chg ${cls}">${q.changePercent>=0?'▲':'▼'} ${q.changePercent.toFixed(2)}%</span></div>`;
        } else {
            html += `<div class="price-row"><span class="price" style="color:#555">--</span></div>`;
        }
        html += `<div class="divider"></div><div class="fund-row"><span class="l">💰 规模变动</span><span style="color:#555">--</span></div>`;
        html += `<div class="period-row"><span class="tag na">5日 --</span><span class="tag na">20日 --</span><span class="tag na">60日 --</span></div>`;
        card.innerHTML = html;
        g.appendChild(card);
        card.addEventListener('click', () => {
            location.href = `stock.html?code=${e.code}`;
        });
    });
}

function allEtfs() {
    try { return [...DEFAULT_ETFS, ...JSON.parse(localStorage.getItem('myEtfs')||'[]')]; } catch(e){ return DEFAULT_ETFS; }
}

// ---------- 定时器 ----------
function updateCdown() {
    document.getElementById('countdown').textContent = countdownSec + 's↻';
}
setInterval(() => {
    countdownSec--;
    if (countdownSec <= 0) countdownSec = 60;
    updateCdown();
}, 1000);

// ---------- 初始化 ----------
window.addEventListener('load', () => {
    refreshStocks();
    loadETFData();
    setInterval(refreshStocks, 60000);
    updateTimeDisplay();
});
</script>
</body>
</html>
