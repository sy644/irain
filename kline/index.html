<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>自选股 · 智能参谋</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js">
    </script>
    <style>
        /* ===== 全局重置 & 变量 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            overflow-x: hidden;
            max-width: 100vw;
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            color: #1a202c;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 560px;
            width: 100%;
        }

        /* ===== 顶部导航 ===== */
        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 14px 18px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
            gap: 10px;
        }
        .header .brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header .brand h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1a202c;
            letter-spacing: -0.3px;
        }
        .header .brand span {
            font-size: 13px;
            font-weight: 400;
            color: #718096;
            margin-left: 2px;
        }
        .header .info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 12px;
            color: #718096;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .header .info .time {
            font-weight: 500;
            color: #2d3748;
            font-variant-numeric: tabular-nums;
        }
        .status-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #38a169;
            animation: pulse 2s infinite;
            margin-right: 4px;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .countdown {
            background: #edf2f7;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 11px;
            color: #4a5568;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }

        /* ===== 指数 Ticker ===== */
        .ticker {
            flex: 1 1 140px;
            min-width: 100px;
            overflow: hidden;
            position: relative;
            height: 26px;
            display: flex;
            align-items: center;
            mask-image: linear-gradient(to right, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
            -webkit-mask-image: linear-gradient(to right, transparent 0, #000 20px, #000 calc(100% - 20px), transparent 100%);
        }
        .ticker:hover .ticker-track {
            animation-play-state: paused;
        }
        .ticker-track {
            display: flex;
            gap: 28px;
            white-space: nowrap;
            animation: ticker-scroll 45s linear infinite;
            will-change: transform;
        }
        @keyframes ticker-scroll {
            from {
                transform: translateX(0);
            }
            to {
                transform: translateX(-50%);
            }
        }
        .ticker-item {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            font-size: 12px;
            line-height: 1;
        }
        .ticker-item .t-name {
            color: #4a5568;
            font-weight: 500;
        }
        .ticker-item .t-price {
            color: #1a202c;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .ticker-item .t-pct {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .ticker-item.up .t-price,
        .ticker-item.up .t-pct {
            color: #e53e3e;
        }
        .ticker-item.down .t-price,
        .ticker-item.down .t-pct {
            color: #38a169;
        }
        .ticker-item.flat .t-price,
        .ticker-item.flat .t-pct {
            color: #a0aec0;
        }
        .ticker-loading {
            color: #a0aec0;
            font-size: 11px;
            padding: 0 20px;
        }

        /* ===== 添加栏 ===== */
        .add-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            background: #ffffff;
            padding: 12px 14px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
        }
        .add-bar input {
            flex: 1;
            min-width: 120px;
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 14px;
            color: #1a202c;
            outline: none;
            transition: 0.2s;
        }
        .add-bar input:focus {
            border-color: #3182ce;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
        }
        .add-bar input::placeholder {
            color: #a0aec0;
        }
        .add-bar button {
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
            background: #3182ce;
            color: #fff;
        }
        .add-bar button:hover {
            background: #2c5282;
        }
        .add-bar button:active {
            transform: scale(0.96);
        }
        .add-bar .btn-img {
            background: #edf2f7;
            color: #2d3748;
        }
        .add-bar .btn-img:hover {
            background: #e2e8f0;
        }
        .add-bar .hint {
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: #a0aec0;
            margin-top: 4px;
        }

        /* ============================================================
           🆕 持仓管理面板
           ============================================================ */
        .portfolio-panel {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 16px;
            overflow: hidden;
            transition: all 0.3s;
        }
        .portfolio-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .portfolio-panel .panel-header .title {
            font-weight: 700;
            font-size: 16px;
            color: #1a202c;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .portfolio-panel .panel-header .title .badge {
            font-size: 11px;
            font-weight: 600;
            background: #3182ce;
            color: #fff;
            padding: 1px 10px;
            border-radius: 30px;
        }
        .portfolio-panel .panel-header .toggle-icon {
            font-size: 18px;
            color: #a0aec0;
            transition: transform 0.3s;
        }
        .portfolio-panel .panel-header .toggle-icon.open {
            transform: rotate(180deg);
        }
        .portfolio-panel .panel-body {
            padding: 0 18px 18px;
            display: none;
        }
        .portfolio-panel .panel-body.open {
            display: block;
        }

        /* 风控概览条 */
        .risk-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            background: #f7fafc;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 14px;
        }
        .risk-overview .ro-item {
            text-align: center;
        }
        .risk-overview .ro-item .ro-label {
            font-size: 10px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .risk-overview .ro-item .ro-value {
            font-size: 16px;
            font-weight: 700;
            color: #1a202c;
            margin-top: 2px;
        }
        .risk-overview .ro-item .ro-value.good {
            color: #38a169;
        }
        .risk-overview .ro-item .ro-value.warn {
            color: #d69e2e;
        }
        .risk-overview .ro-item .ro-value.bad {
            color: #e53e3e;
        }
        .risk-overview .ro-item .ro-value .sub {
            font-size: 11px;
            font-weight: 400;
            color: #718096;
        }

        /* 添加持仓表单 */
        .add-pos-form {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: #f7fafc;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 14px;
            align-items: center;
        }
        .add-pos-form select,
        .add-pos-form input {
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13px;
            background: #fff;
            color: #1a202c;
            outline: none;
            min-width: 0;
            flex: 1 1 80px;
        }
        .add-pos-form select:focus,
        .add-pos-form input:focus {
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.12);
        }
        .add-pos-form .btn-add-pos {
            background: #38a169;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.15s;
        }
        .add-pos-form .btn-add-pos:hover {
            background: #2f855a;
        }
        .add-pos-form .btn-add-pos:active {
            transform: scale(0.96);
        }
        .add-pos-form .hint-text {
            font-size: 11px;
            color: #a0aec0;
            width: 100%;
            text-align: center;
        }

        /* 持仓列表 */
        .pos-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .pos-item {
            display: grid;
            grid-template-columns: 1.8fr 0.9fr 0.9fr 0.9fr 0.9fr 0.7fr;
            gap: 6px;
            align-items: center;
            padding: 8px 12px;
            background: #f7fafc;
            border-radius: 10px;
            font-size: 12px;
            border: 1px solid transparent;
            transition: 0.15s;
        }
        .pos-item:hover {
            border-color: #e2e8f0;
        }
        .pos-item .pi-name {
            font-weight: 600;
            color: #1a202c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pos-item .pi-name .pi-code {
            font-weight: 400;
            color: #a0aec0;
            font-size: 10px;
            margin-left: 4px;
        }
        .pos-item .pi-shares {
            text-align: right;
            font-weight: 500;
        }
        .pos-item .pi-cost {
            text-align: right;
            color: #4a5568;
        }
        .pos-item .pi-price {
            text-align: right;
            font-weight: 500;
        }
        .pos-item .pi-pl {
            text-align: right;
            font-weight: 600;
        }
        .pos-item .pi-pl.up {
            color: #e53e3e;
        }
        .pos-item .pi-pl.down {
            color: #38a169;
        }
        .pos-item .pi-pl.flat {
            color: #a0aec0;
        }
        .pos-item .pi-action {
            text-align: right;
        }
        .pos-item .pi-action button {
            background: transparent;
            border: none;
            color: #a0aec0;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: 0.15s;
        }
        .pos-item .pi-action button:hover {
            color: #e53e3e;
            background: rgba(229, 62, 62, 0.08);
        }
        .pos-item .pi-action .btn-edit {
            color: #3182ce;
            margin-right: 2px;
        }
        .pos-item .pi-action .btn-edit:hover {
            color: #2b6cb0;
            background: rgba(49, 130, 206, 0.08);
        }
        .pos-empty {
            text-align: center;
            color: #a0aec0;
            font-size: 13px;
            padding: 20px 0;
        }

        /* 仓位进度条（在持仓列表底部） */
        .pos-summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 4px;
            font-size: 12px;
            color: #4a5568;
            border-top: 1px solid #edf2f7;
            margin-top: 8px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .pos-summary .ps-label {
            font-weight: 500;
        }
        .pos-summary .ps-value {
            font-weight: 600;
            color: #1a202c;
        }
        .pos-summary .ps-bar {
            flex: 1;
            min-width: 80px;
            height: 4px;
            background: #edf2f7;
            border-radius: 4px;
            overflow: hidden;
            margin: 0 8px;
        }
        .pos-summary .ps-bar .ps-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.4s;
            background: #3182ce;
        }
        .pos-summary .ps-bar .ps-fill.warn {
            background: #d69e2e;
        }
        .pos-summary .ps-bar .ps-fill.bad {
            background: #e53e3e;
        }

        /* ===== 自选股卡片列表 ===== */
        .stock-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        /* 单个卡片 */
        .stock-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            padding: 14px 16px;
            transition: 0.15s;
            cursor: pointer;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .stock-card:active {
            transform: scale(0.99);
            background: #f7fafc;
        }
        .stock-card.deleting {
            background: rgba(229, 62, 62, 0.06);
        }
        .stock-card.removing {
            animation: slideOut 0.35s ease forwards;
        }
        @keyframes slideOut {
            to {
                opacity: 0;
                transform: translateX(-20px);
                max-height: 0;
                padding: 0 16px;
                margin: 0;
                border-width: 0;
                overflow: hidden;
            }
        }

        /* 卡片主行（名称/价格/涨跌） */
        .card-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .card-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            flex: 1;
        }
        .card-left .name {
            font-size: 17px;
            font-weight: 700;
            color: #1a202c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-left .code {
            font-size: 11px;
            color: #a0aec0;
            font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace;
        }
        .card-price {
            text-align: right;
            font-size: 20px;
            font-weight: 700;
            color: #1a202c;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.3px;
            min-width: 70px;
        }
        .card-change {
            text-align: right;
            font-size: 15px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            min-width: 60px;
        }
        .up {
            color: #e53e3e;
        }
        .down {
            color: #38a169;
        }
        .flat {
            color: #a0aec0;
        }

        /* 信号行（标签+建议+置信度） */
        .card-signal {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        /* ---- 信号徽章颜色（由深到浅） ---- */
        .signal-badge {
            display: inline-block;
            padding: 3px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.3px;
            background: #a0aec0;
            /* fallback */
        }
        /* 买入系（红） */
        .badge-strong-buy {
            background: #C53030;
        }
        .badge-buy {
            background: #E53E3E;
        }
        .badge-test {
            background: #FC8181;
        }
        .badge-oversold {
            background: #FED7D7;
            color: #742A2A;
        }
        /* 卖出系（绿） */
        .badge-strong-sell {
            background: #276749;
        }
        .badge-sell {
            background: #38A169;
        }
        .badge-defend {
            background: #68D391;
        }
        .badge-overbought {
            background: #C6F6D5;
            color: #234E52;
        }
        /* 中性 */
        .badge-hold {
            background: #718096;
        }
        .badge-watch {
            background: #CBD5E0;
            color: #2D3748;
        }
        .badge-data {
            background: #E2E8F0;
            color: #4A5568;
        }

        .signal-action {
            font-size: 12px;
            color: #4a5568;
            flex: 1;
            min-width: 80px;
        }
        .signal-confidence {
            font-size: 12px;
            color: #718096;
            font-weight: 500;
            white-space: nowrap;
        }

        /* 仓位进度条 */
        .position-bar-wrap {
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .position-bar-track {
            flex: 1;
            height: 4px;
            background: #edf2f7;
            border-radius: 4px;
            overflow: hidden;
        }
        .position-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s;
            background: #a0aec0;
        }
        .position-label {
            font-size: 11px;
            font-weight: 600;
            color: #4a5568;
            min-width: 44px;
            text-align: right;
        }

        /* 持仓小标签（卡片上显示） */
        .pos-tag {
            font-size: 10px;
            background: #ebf8ff;
            color: #2b6cb0;
            padding: 1px 10px;
            border-radius: 30px;
            font-weight: 600;
            margin-left: 6px;
            white-space: nowrap;
        }
        .pos-tag.has-pos {
            background: #ebf8ff;
            color: #2b6cb0;
        }
        .pos-tag.no-pos {
            background: #edf2f7;
            color: #a0aec0;
        }

        /* 长按删除遮罩 */
        .hold-progress {
            position: absolute;
            inset: 0;
            border-radius: 16px;
            background: rgba(229, 62, 62, 0.06);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s;
            overflow: hidden;
        }
        .stock-card.deleting .hold-progress {
            opacity: 1;
        }
        .hold-progress::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background: #e53e3e;
            width: 0;
            transition: width 0.05s linear;
            border-radius: 0 0 16px 16px;
        }
        .stock-card.deleting .hold-progress::after {
            width: var(--progress, 0%);
        }
        .hold-progress .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #e53e3e;
            font-size: 14px;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.8);
            padding: 4px 16px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
        }

        /* 空状态 */
        .empty-tip {
            padding: 40px 14px;
            text-align: center;
            color: #a0aec0;
            font-size: 14px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        /* 列表头部（显示排序提示） */
        .list-head {
            display: grid;
            grid-template-columns: 1.6fr 1fr 0.9fr 0.9fr;
            gap: 8px;
            padding: 10px 14px;
            background: #f7fafc;
            border-radius: 12px 12px 0 0;
            font-size: 11px;
            color: #4a5568;
            font-weight: 600;
            letter-spacing: 0.04em;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 4px;
        }
        .list-head .h-name {
            cursor: pointer;
            user-select: none;
        }
        .list-head .h-price {
            cursor: pointer;
            user-select: none;
            text-align: right;
        }
        .list-head .h-pct {
            cursor: pointer;
            user-select: none;
            text-align: right;
        }
        .list-head .h-sig {
            cursor: pointer;
            user-select: none;
            text-align: center;
        }
        .list-head .h-name .arrow,
        .list-head .h-price .arrow,
        .list-head .h-pct .arrow,
        .list-head .h-sig .arrow {
            display: inline-block;
            margin-left: 2px;
            font-size: 10px;
            color: #a0aec0;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a202c;
            color: #fff;
            padding: 10px 22px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 999;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            animation: toastIn 0.3s ease;
            max-width: 90vw;
            text-align: center;
            font-weight: 500;
        }
        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-12px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ===== OCR 覆盖层 ===== */
        .ocr-overlay {
            position: fixed;
            inset: 0;

    <script>
        // ============================================================
        // 1. 持仓数据管理（扩展 app.js 功能）
        // ============================================================
        const PORTFOLIO_KEY = 'portfolio_v1';

        function loadPortfolio() {
            try {
                const raw = localStorage.getItem(PORTFOLIO_KEY);
                if (!raw) return { positions: [], cash: 100000, equity: 100000, peakEquity: 100000 };
                const p = JSON.parse(raw);
                // 兼容旧数据
                if (!p.positions) p.positions = [];
                if (!p.cash) p.cash = 100000;
                if (!p.equity) p.equity = 100000;
                if (!p.peakEquity) p.peakEquity = p.equity;
                return p;
            } catch { return { positions: [], cash: 100000, equity: 100000, peakEquity: 100000 }; }
        }

        function savePortfolio(portfolio) {
            localStorage.setItem(PORTFOLIO_KEY, JSON.stringify(portfolio));
        }

        // 获取单只股票的最新价格（从 stockDataMap 或 fetch）
        function getCurrentPrice(code) {
            // 先从 stockDataMap 获取
            if (window.stockDataMap && window.stockDataMap[code] && window.stockDataMap[code].price) {
                return window.stockDataMap[code].price;
            }
            return null;
        }

        // 更新持仓的市值和盈亏
        function refreshPortfolioPrices() {
            const portfolio = loadPortfolio();
            const stocks = window.loadStocks ? window.loadStocks() : [];
            let totalMv = 0;
            for (const pos of portfolio.positions) {
                // 尝试从 stockDataMap 获取价格
                let price = getCurrentPrice(pos.code);
                if (!price) {
                    // 从自选股列表中找
                    const s = stocks.find(st => st.code === pos.code);
                    if (s && window.stockDataMap && window.stockDataMap[s.code]) {
                        price = window.stockDataMap[s.code].price;
                    }
                }
                if (price && price > 0) {
                    pos.currentPrice = price;
                    pos.marketValue = pos.shares * price;
                    pos.profit = pos.marketValue - pos.shares * pos.avgCost;
                    pos.profitPct = pos.avgCost > 0 ? (pos.profit / (pos.shares * pos.avgCost)) * 100 : 0;
                } else {
                    pos.currentPrice = pos.avgCost || 0;
                    pos.marketValue = pos.shares * pos.avgCost || 0;
                    pos.profit = 0;
                    pos.profitPct = 0;
                }
                totalMv += pos.marketValue || 0;
            }
            portfolio.equity = totalMv + portfolio.cash;
            if (portfolio.equity > portfolio.peakEquity) {
                portfolio.peakEquity = portfolio.equity;
            }
            savePortfolio(portfolio);
            return portfolio;
        }

        // 添加持仓
        function addPosition(code, shares, avgCost, stopLoss) {
            if (!code || !shares || shares <= 0 || !avgCost || avgCost <= 0) {
                return { success: false, message: '请填写完整信息' };
            }
            const portfolio = loadPortfolio();
            // 检查是否已存在
            const existing = portfolio.positions.find(p => p.code === code);
            if (existing) {
                // 合并：加权平均成本
                const totalShares = existing.shares + shares;
                const totalCost = existing.shares * existing.avgCost + shares * avgCost;
                existing.shares = totalShares;
                existing.avgCost = totalCost / totalShares;
                if (stopLoss && stopLoss > 0) existing.stopLoss = stopLoss;
                // 保留 highWater
                if (!existing.highWater) existing.highWater = existing.avgCost;
            } else {
                portfolio.positions.push({
                    code,
                    shares,
                    avgCost,
                    stopLoss: stopLoss || 0,
                    highWater: avgCost,
                    currentPrice: avgCost,
                    marketValue: shares * avgCost,
                    profit: 0,
                    profitPct: 0,
                });
            }
            savePortfolio(portfolio);
            refreshPortfolioPrices();
            return { success: true, portfolio };
        }

        // 更新持仓
        function updatePosition(code, shares, avgCost, stopLoss) {
            const portfolio = loadPortfolio();
            const pos = portfolio.positions.find(p => p.code === code);
            if (!pos) return { success: false, message: '持仓不存在' };
            if (shares && shares > 0) pos.shares = shares;
            if (avgCost && avgCost > 0) pos.avgCost = avgCost;
            if (stopLoss !== undefined) pos.stopLoss = stopLoss;
            if (!pos.highWater) pos.highWater = pos.avgCost;
            savePortfolio(portfolio);
            refreshPortfolioPrices();
            return { success: true, portfolio };
        }

        // 删除持仓
        function removePosition(code) {
            const portfolio = loadPortfolio();
            portfolio.positions = portfolio.positions.filter(p => p.code !== code);
            savePortfolio(portfolio);
            refreshPortfolioPrices();
            return portfolio;
        }

        // 计算持仓统计（用于风控）
        function calcPortfolioStats(portfolio) {
            const totalMv = portfolio.positions.reduce((s, p) => s + (p.marketValue || 0), 0);
            const equity = totalMv + portfolio.cash;
            const totalPosPct = equity > 0 ? (totalMv / equity) * 100 : 0;
            const drawdown = portfolio.peakEquity > 0 ? ((portfolio.peakEquity - equity) / portfolio.peakEquity) * 100 : 0;

            const stats = {
                totalMv,
                equity,
                cash: portfolio.cash,
                peakEquity: portfolio.peakEquity,
                totalPosPct,
                drawdown,
                positionCount: portfolio.positions.length,
                // 单标的最大仓位
                maxSinglePct: 0,
                maxSingleCode: null,
            };
            for (const p of portfolio.positions) {
                const pct = equity > 0 ? ((p.marketValue || 0) / equity) * 100 : 0;
                if (pct > stats.maxSinglePct) {
                    stats.maxSinglePct = pct;
                    stats.maxSingleCode = p.code;
                }
            }
            return stats;
        }

        // 获取风控建议（基于当前持仓和风控参数）
        function getRiskAdvice(portfolio, limits) {
            const stats = calcPortfolioStats(portfolio);
            const advices = [];
            const warnings = [];
            const blocks = [];

            // 1. 总仓位检查
            const maxTotal = limits.maxTotalPosition * 100;
            if (stats.totalPosPct > maxTotal) {
                warnings.push(`总仓位 ${stats.totalPosPct.toFixed(0)}% 超过上限 ${maxTotal.toFixed(0)}%，建议减仓`);
            } else if (stats.totalPosPct > maxTotal * 0.85) {
                advices.push(`总仓位 ${stats.totalPosPct.toFixed(0)}% 接近上限 ${maxTotal.toFixed(0)}%，谨慎加仓`);
            }

            // 2. 单标仓位检查
            const maxSingle = limits.maxSinglePosition * 100;
            if (stats.maxSinglePct > maxSingle) {
                warnings.push(`单标 ${stats.maxSingleCode} 仓位 ${stats.maxSinglePct.toFixed(0)}% 超过上限 ${maxSingle.toFixed(0)}%，建议减仓`);
            }

            // 3. 回撤检查
            if (stats.drawdown > limits.maxDrawdown * 100) {
                blocks.push(`账户回撤 ${stats.drawdown.toFixed(1)}% 超过熔断线 ${(limits.maxDrawdown*100).toFixed(0)}%，强制清仓`);
            } else if (stats.drawdown > limits.maxDrawdown * 100 * 0.7) {
                warnings.push(`账户回撤 ${stats.drawdown.toFixed(1)}%，接近熔断线，注意风险`);
            }

            // 4. 现金保留
            const cashPct = stats.equity > 0 ? (stats.cash / stats.equity) * 100 : 0;
            const minCash = limits.minCashReserve * 100;
            if (cashPct < minCash) {
                warnings.push(`现金比例 ${cashPct.toFixed(0)}% 低于保留线 ${minCash.toFixed(0)}%，建议补充现金`);
            }

            // 5. 止损检查
            for (const p of portfolio.positions) {
                if (p.stopLoss && p.stopLoss > 0 && p.currentPrice && p.currentPrice <= p.stopLoss) {
                    const lossPct = ((p.currentPrice - p.stopLoss) / p.currentPrice) * 100;
                    warnings.push(`${p.code} 触发止损线 (现价 ${p.currentPrice.toFixed(2)} ≤ 止损 ${p.stopLoss.toFixed(2)})，建议执行止损`);
                }
            }

            return {
                stats,
                advices,
                warnings,
                blocks,
                isBlocked: blocks.length > 0,
                riskLevel: blocks.length > 0 ? 'CRITICAL' : warnings.length > 2 ? 'HIGH' : warnings.length > 0 ? 'MEDIUM' :
                    'LOW',
            };
        }

        // ============================================================
        // 2. 全局状态
        // ============================================================
        let stockDataMap = {};
        let countdownSec = 60;
        let sortField = 'signal';
        let sortAsc = false;

        const MARKET = [
            { name: '上证指数', c: '000001', p: '1' },
            { name: '深证成指', c: '399001', p: '0' },
            { name: '创业板指', c: '399006', p: '0' },
            { name: '科创50', c: '000688', p: '1' },
            { name: '沪深300', c: '000300', p: '1' },
            { name: '中证500', c: '000905', p: '1' },
            { name: '北证50', c: '899050', p: '2' },
        ];
        let mq = {};

        function toFullCode(c) {
            return c.p === '0' ? 'sz' + c.c :
                c.p === '2' ? 'bj' + c.c :
                'sh' + c.c;
        }

        // ============================================================
        // 3. 工具函数
        // ============================================================
        function toast(msg) {
            const el = document.createElement('div');
            el.className = 'toast';
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 3000);
        }

        function updateTimeDisplay() {
            const now = new Date();
            const t = document.getElementById('updateTime');
            if (t) t.textContent = now.toLocaleString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit',
                    hour12: false });
        }

        // ============================================================
        // 4. 信号计算（与 index.html 一致）
        // ============================================================
        function simpleSignal(closes) {
            if (closes.length < 20) {
                return { overall: '数据不足', action: '等待更多K线', position: 0, confidence: 0 };
            }
            const n = closes.length;
            const ma5 = closes.slice(-5).reduce((a, b) => a + b, 0) / 5;
            const ma20 = closes.slice(-20).reduce((a, b) => a + b, 0) / 20;
            const ma60 = closes.length >= 60 ? closes.slice(-60).reduce((a, b) => a + b, 0) / 60 : ma20;
            const last = closes[n - 1];
            const prev = closes[n - 2];
            const changePct = (last - prev) / prev * 100;
            const pct5 = (last - closes[n - 5]) / closes[n - 5] * 100;

            let score = 0;
            if (last > ma5) score += 1.5;
            else score -= 1.5;
            if (last > ma20) score += 1.2;
            else score -= 1.2;
            if (last > ma60) score += 0.8;
            else score -= 0.8;
            if (ma5 > ma20) score += 0.5;
            else score -= 0.5;
            if (ma20 > ma60) score += 0.3;
            else score -= 0.3;
            if (changePct > 1) score += 0.5;
            else if (changePct < -1) score -= 0.5;
            if (pct5 > 3) score += 1;
            else if (pct5 < -3) score -= 1;

            let overall, action, position, confidence;
            if (score >= 5) { overall = '强力买入';
                action = '强势突破，积极跟进';
                position = 85;
                confidence = 90; } else if (score >= 3.5) { overall = '买入';
                action = '趋势向好，分批建仓';
                position = 65;
                confidence = 75; } else if (score >= 2) { overall = '左侧试探';
                action = '底部区域，轻仓试水';
                position = 35;
                confidence = 55; } else if (score >= 0.5) { overall = '超卖区';
                action = '超跌反弹机会';
                position = 20;
                confidence = 40; } else if (score >= -0.5) { overall = '观望';
                action = '等待方向明朗';
                position = 0;
                confidence = 30; } else if (score >= -2) { overall = '高空防守';
                action = '高位滞涨，逐步减仓';
                position = 25;
                confidence = 50; } else if (score >= -3.5) { overall = '卖出';
                action = '趋势走弱，果断减仓';
                position = 50;
                confidence = 70; } else { overall = '强力卖出';
                action = '全面转空，清仓避险';
                position = 75;
                confidence = 85; }

            return { overall, action, position, confidence };
        }

        // ============================================================
        // 5. 排序核心
        // ============================================================
        function getSignalGroup(signal) {
            const buySignals = ['强力买入', '买入', '左侧试探', '超卖区'];
            const sellSignals = ['强力卖出', '卖出', '高空防守', '超买区'];
            if (buySignals.includes(signal)) return 0;
            if (sellSignals.includes(signal)) return 2;
            return 1;
        }

        function sortStocks(stocks) {
            const sorted = [...stocks];
            sorted.sort((a, b) => {
                const da = stockDataMap[a.code] || {};
                const db = stockDataMap[b.code] || {};
                let valA, valB;

                switch (sortField) {
                    case 'name':
                        valA = a.name;
                        valB = b.name;
                        return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                    case 'price':
                        valA = da.price !== undefined ? da.price : -Infinity;
                        valB = db.price !== undefined ? db.price : -Infinity;
                        return sortAsc ? (valA - valB) : (valB - valA);
                    case 'changePercent':
                        valA = da.changePercent !== undefined ? da.changePercent : -Infinity;
                        valB = db.changePercent !== undefined ? db.changePercent : -Infinity;
                        return sortAsc ? (valA - valB) : (valB - valA);
                    case 'signal':
                    default:
                        const gA = getSignalGroup(da.signal || '中性');
                        const gB = getSignalGroup(db.signal || '中性');
                        if (gA !== gB) return gA - gB;
                        const posA = da.position || 0;
                        const posB = db.position || 0;
                        return posB - posA;
                }
            });
            return sorted;
        }

        // ============================================================
        // 6. 核心刷新与渲染
        // ============================================================
        async function fetchQuotesBatch(codes) {
            if (!codes || codes.length === 0) return {};
            const BATCH_SIZE = 50;
            const batches = [];
            for (let i = 0; i < codes.length; i += BATCH_SIZE) batches.push(codes.slice(i, i + BATCH_SIZE));
            const results = {};
            await Promise.all(batches.map(async (batch) => {
                const codeStr = batch.join(',');
                const url = `https://qt.gtimg.cn/q=${codeStr}`;
                try {
                    const text = await fetch(url, { signal: AbortSignal.timeout(6000) }).then(r => r.text());
                    const lines = text.split('\n').filter(l => l.trim());
                    for (const line of lines) {
                        const m = line.match(/v_([a-z]{2}\d{6})="(.+)"/);
                        if (!m) continue;
                        const code = m[1];
                        const f = m[2].split('~');
                        results[code] = {
                            name: f[1] || code,
                            price: parseFloat(f[3]) || 0,
                            change: parseFloat(f[31]) || 0,
                            changePercent: parseFloat(f[32]) || 0,
                            volume: parseInt(f[36]) || 0,
                            turnover: (parseFloat(f[37]) || 0) * 10000,
                        };
                    }
                } catch (e) { console.warn('报价获取失败', e); }
            }));
            return results;
        }

        async function fetchKLine(code, count = 120) {
            if (typeof window.fetchKLine === 'function') return await window.fetchKLine(code, count);
            const url =
                `https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param=${encodeURIComponent(code)},day,,,${count},qfq`;
            const data = await (await fetch(url, { signal: AbortSignal.timeout(8000) })).json();
            const key = Object.keys(data.data)[0];
            const arr = (data.data[key] && (data.data[key].qfqday || data.data[key].day)) || [];
            return arr.map(row => ({
                date: row[0],
                open: +row[1],
                close: +row[2],
                high: +row[3],
                low: +row[4],
                volume: +row[5]
            })).filter(r => r.date && !isNaN(r.open));
        }

        async function refreshStocks() {
            const stocks = window.loadStocks ? window.loadStocks() : [];
            if (!stocks.length) {
                document.getElementById('stockList').innerHTML =
                    `<div class="empty-tip">📭 暂无自选股，请添加</div>`;
                return;
            }

            const codes = stocks.map(s => s.code);
            let quotes = {};
            try { quotes = await fetchQuotesBatch(codes); } catch (e) { console.warn(e); }

            for (const s of stocks) {
                const q = quotes[s.code];
                if (q && q.price > 0) {
                    stockDataMap[s.code] = {
                        price: q.price,
                        change: q.change,
                        changePercent: q.changePercent,
                        volume: q.volume,
                        updateTime: Date.now(),
                        signal: stockDataMap[s.code]?.signal || '计算中…',
                        action: stockDataMap[s.code]?.action || '',
                        position: stockDataMap[s.code]?.position || 0,
                        confidence: stockDataMap[s.code]?.confidence || 0,
                    };
                } else if (!stockDataMap[s.code]) {
                    stockDataMap[s.code] = { price: '--', change: 0, changePercent: 0, volume: 0, updateTime: Date.now(),
                        signal: '--', action: '', position: 0, confidence: 0 };
                }
            }
            renderStockCards(stocks);

            const needCalc = stocks.filter(s => stockDataMap[s.code]?.price !== '--');
            const CONCURRENCY = 3;
            for (let i = 0; i < needCalc.length; i += CONCURRENCY) {
                const batch = needCalc.slice(i, i + CONCURRENCY);
                await Promise.all(batch.map(async (s) => {
                    try {
                        let kline = null;
                        let fromCache = false;
                        try {
                            if (window.HistoryTable && typeof window.HistoryTable.getRecent ===
                                'function') {
                                const cached = window.HistoryTable.getRecent(s.code, 120);
                                if (cached && cached.length >= 60) {
                                    kline = cached.map(r => ({
                                        date: r.date,
                                        open: r.open,
                                        high: r.high,
                                        low: r.low,
                                        close: r.close,
                                        volume: r.volume,
                                    }));
                                    fromCache = true;
                                }
                            }
                        } catch (e) { /* ignore */ }

                        if (!kline || kline.length < 60) {
                            kline = await fetchKLine(s.code, 120);
                            fromCache = false;
                        }

                        if (kline && kline.length > 20) {
                            const closes = kline.map(d => d.close);
                            let sig;
                            if (typeof window.summarize === 'function') {
                                const highs = kline.map(d => d.high);
                                const lows = kline.map(d => d.low);
                                const opens = kline.map(d => d.open);
                                const vols = kline.map(d => d.volume);
                                const prev = kline[kline.length - 2] || kline[kline.length - 1];
                                let pivots = null;
                                if (typeof window.calcPivots === 'function') {
                                    pivots = window.calcPivots(prev.high, prev.low, prev.close);
                                }
                                sig = window.summarize(closes, highs, lows, opens, vols, pivots);
                            } else {
                                sig = simpleSignal(closes);
                            }
                            stockDataMap[s.code].signal = sig.overall || '中性';
                            stockDataMap[s.code].action = sig.action || '';
                            stockDataMap[s.code].position = sig.position || 0;
                            stockDataMap[s.code].confidence = sig.confidence || 0;
                            if (fromCache) stockDataMap[s.code].signal += '·';
                        } else {
                            stockDataMap[s.code].signal = '数据不足';
                            stockDataMap[s.code].action = 'K线不足';
                            stockDataMap[s.code].position = 0;
                            stockDataMap[s.code].confidence = 0;
                        }
                    } catch (e) {
                        console.warn(`信号计算失败 ${s.code}:`, e);
                        stockDataMap[s.code].signal = '计算失败';
                        stockDataMap[s.code].action = '请重试';
                        stockDataMap[s.code].position = 0;
                        stockDataMap[s.code].confidence = 0;
                    }
                }));
                renderStockCards(stocks);
            }
            updateTimeDisplay();

            // 刷新持仓价格（从最新的报价更新）
            refreshPortfolioPrices();
            renderPortfolioPanel();
        }

        // ============================================================
        // 7. 渲染股票卡片
        // ============================================================

                    <div class="h-pct" data-sort="changePercent">涨跌<span class="arrow">${sortField === 'changePercent' ? (sortAsc ? '▲' : '▼') : '↕'}</span></div>

                const priceDisplay = typeof price === 'number' ? price.toFixed(2) : price;
                const pctDisplay = typeof changePct === 'number' ? changePct.toFixed(2) : '0.00';
                const cls = change > 0 ? 'up' : (change < 0 ? 'down' : 'flat');

                    case '左侧试探':

                    case '超卖区':

                    case '卖出':

                    case '高空防守':

                        displayText = '防守';
                        break;
                    case '超买区':

                        break;
                    case '观望':

                    case '持有':

                        break;
                    default:
                        badgeClass = 'badge-data';
                        displayText = signal;
                }

                let posColor = '#a0aec0';
                if (['强力买入', '买入', '左侧试探', '超卖区'].includes(signal)) {
                    posColor = '#e53e3e';
                } else if (['强力卖出', '卖出', '高空防守', '超买区'].includes(signal)) {
                    posColor = '#38a169';
                }

                html += `
                    <div class="stock-card" data-code="${s.code}">
                        <div class="hold-progress"><span class="progress-text">松开取消</span></div>
                        <div class="card-main">
                            <div class="card-left">
                                <div class="name">${s.name} ${posTag}</div>
                                <div class="code">${s.code.toUpperCase()}</div>
                            </div>
                            <div class="card-price">${priceDisplay}</div>
                            <div class="card-change ${cls}">${sign}${pctDisplay}%</div>
                        </div>

                            <span class="signal-badge ${badgeClass}">${displayText}</span>

            }
            container.innerHTML = html;

            container.querySelectorAll('.stock-card').forEach(card => {
                card.addEventListener('click', () => {
                    if (card.classList.contains('deleting')) return;
                    const code = card.dataset.code;
                    if (code) location.href = `stock.html?code=${encodeURIComponent(code)}`;
                });
            });

            bindLongPressDelete(container);

            document.querySelectorAll('.list-head [data-sort]').forEach(el => {
                el.removeEventListener('click', handleSort);
                el.addEventListener('click', handleSort);
            });
        }

        function handleSort(e) {
            const el = e.currentTarget;
            const field = el.dataset.sort;
            if (sortField === field) {
                sortAsc = !sortAsc;
            } else {
                sortField = field;
                sortAsc = false;
            }
            refreshStocks();
        }

        // ============================================================
        // 8. 长按删除
        // ============================================================
        function bindLongPressDelete(container) {
            const LONG_PRESS_MS = 700;
            const SCROLL_TOLERANCE = 10;

            container.querySelectorAll('.stock-card').forEach(card => {
                let startX = 0,
                    startY = 0;
                let progressEl = null;
                let progressStart = 0;
                let rafId = null;

                const cancel = () => {
                    if (rafId) { cancelAnimationFrame(rafId);
                        rafId = null; }
                    card.classList.remove('deleting');
                    if (progressEl) progressEl.style.setProperty('--progress', '0%');
                };

                const animate = (timestamp) => {
                    if (!progressStart) progressStart = timestamp;
                    const elapsed = timestamp - progressStart;
                    const progress = Math.min(elapsed / LONG_PRESS_MS, 1);
                    if (progressEl) progressEl.style.setProperty('--progress', (progress * 100) + '%');
                    if (progress >= 1) {
                        rafId = null;
                        const code = card.dataset.code;
                        const name = card.querySelector('.name')?.textContent || code;
                        if (confirm(`🗑️ 删除自选股 "${name}" (${code.toUpperCase()})？`)) {
                            if (window.removeStock) window.removeStock(code);
                            card.classList.add('removing');
                            setTimeout(() => refreshStocks(), 360);
                        } else {
                            cancel();
                        }
                    } else {
                        rafId = requestAnimationFrame(animate);
                    }
                };

                const start = (x, y) => {
                    if (card.classList.contains('removing')) return;
                    startX = x;
                    startY = y;
                    progressEl = card.querySelector('.hold-progress');
                    if (progressEl) progressEl.style.setProperty('--progress', '0%');
                    card.classList.add('deleting');
                    progressStart = 0;
                    rafId = requestAnimationFrame(animate);
                };

                card.addEventListener('touchstart', (e) => {
                    const t = e.touches[0];
                    start(t.clientX, t.clientY);
                }, { passive: true });
                card.addEventListener('touchmove', (e) => {
                    const t = e.touches[0];
                    if (Math.hypot(t.clientX - startX, t.clientY - startY) > SCROLL_TOLERANCE) {
                        cancel();
                    }
                }, { passive: true });
                card.addEventListener('touchend', cancel);
                card.addEventListener('touchcancel', cancel);

                card.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    start(e.clientX, e.clientY);
                });
                card.addEventListener('mousemove', (e) => {
                    if (Math.hypot(e.clientX - startX, e.clientY - startY) > SCROLL_TOLERANCE) cancel();
                });
                card.addEventListener('mouseup', cancel);
                card.addEventListener('mouseleave', cancel);
            });
        }

            for (const s of sorted) {
                const opt = document.createElement('option');
                opt.value = s.code;
                opt.textContent = `${s.name} (${s.code.toUpperCase()})`;
                select.appendChild(opt);
            }
            // 如果有持仓的股票不在自选股中，也加入下拉
            const portfolio = loadPortfolio();
            for (const p of portfolio.positions) {
                if (!sorted.some(s => s.code === p.code)) {
                    const opt = document.createElement('option');
                    opt.value = p.code;
                    opt.textContent = `${p.code.toUpperCase()} (持仓)`;
                    select.appendChild(opt);
                }
            }
            if (currentVal) select.value = currentVal;
        }

        document.getElementById('btnAddPos').addEventListener('click', () => {
            const select = document.getElementById('posStockSelect');
            const code = select.value;
            const shares = parseInt(document.getElementById('posShares').value);
            const cost = parseFloat(document.getElementById('posCost').value);
            const stop = parseFloat(document.getElementById('posStop').value) || 0;

            if (!code) { toast('请选择股票'); return; }
            if (!shares || shares <= 0) { toast('请输入有效股数'); return; }
            if (!cost || cost <= 0) { toast('请输入有效成本价'); return; }

            // 如果是手动输入的代码（不在自选股中），尝试添加
            const stocks = window.loadStocks ? window.loadStocks() : [];
            if (!stocks.some(s => s.code === code)) {
                // 尝试添加到自选股
                if (window.addStock) {
                    const res = window.addStock(code);
                    if (!res.added && res.reason !== 'duplicate') {
                        toast('股票不在自选股中，请先添加');
                        return;
                    }
                } else {
                    toast('请先在自选股中添加该股票');
                    return;
                }
            }

            const result = addPosition(code, shares, cost, stop);
            if (result.success) {
                toast(`✅ 已添加 ${code} 持仓`);
                document.getElementById('posShares').value = '';
                document.getElementById('posCost').value = '';
                document.getElementById('posStop').value = '';
                renderPortfolioPanel();
                // 刷新自选股列表以更新持仓标签
                refreshStocks();
            } else {
                toast(result.message || '添加失败');
            }
        });

        // 回车快捷添加
        document.getElementById('posShares').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('btnAddPos').click();
        });
        document.getElementById('posCost').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('btnAddPos').click();
        });

        // ============================================================
        // 12. 编辑持仓弹窗
        // ============================================================
        let editingCode = null;

        function openEditModal(code) {
            const portfolio = loadPortfolio();
            const pos = portfolio.positions.find(p => p.code === code);
            if (!pos) { toast('持仓不存在'); return; }
            editingCode = code;
            document.getElementById('editCode').value = code.toUpperCase();
            document.getElementById('editShares').value = pos.shares;
            document.getElementById('editCost').value = pos.avgCost;
            document.getElementById('editStop').value = pos.stopLoss || '';
            document.getElementById('editModalTitle').textContent = `编辑 ${code.toUpperCase()}`;
            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            editingCode = null;
        }

        document.getElementById('editModalClose').addEventListener('click', closeEditModal);
        document.getElementById('editCancel').addEventListener('click', closeEditModal);
        document.getElementById('editModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeEditModal();
        });

        document.getElementById('editSave').addEventListener('click', () => {
            if (!editingCode) { toast('无持仓可编辑'); return; }
            const shares = parseInt(document.getElementById('editShares').value);
            const cost = parseFloat(document.getElementById('editCost').value);
            const stop = parseFloat(document.getElementById('editStop').value) || 0;

            if (!shares || shares <= 0) { toast('请输入有效股数'); return; }
            if (!cost || cost <= 0) { toast('请输入有效成本价'); return; }

            const result = updatePosition(editingCode, shares, cost, stop);
            if (result.success) {
                toast(`✅ 已更新 ${editingCode} 持仓`);
                closeEditModal();
                renderPortfolioPanel();
                refreshStocks();
            } else {
                toast(result.message || '更新失败');
            }
        });

        document.getElementById('editDelete').addEventListener('click', () => {
            if (!editingCode) return;
            if (confirm(`确定删除 ${editingCode} 的持仓吗？`)) {
                removePosition(editingCode);
                closeEditModal();
                toast(`已删除 ${editingCode}`);
                renderPortfolioPanel();
                refreshStocks();
            }
        });

        // ============================================================
        // 13. 添加股票逻辑（复用原有）
        // ============================================================
        document.getElementById('addBtn').addEventListener('click', () => {
            const input = document.getElementById('newStockInput').value.trim();
            if (!input) { toast('请输入股票名称或代码'); return; }

            if (window.addStock) {
                const res = window.addStock(input);
                if (res.added) {
                    toast(`✅ 已添加 ${res.list[0].name}`);
                    document.getElementById('newStockInput').value = '';
                    populateStockSelect();
                    refreshStocks();
                } else {
                    toast(res.reason === 'duplicate' ? '该股票已在自选' : '添加失败，请检查代码');
                }
            } else {
                toast('添加功能不可用');
            }
        });

        document.getElementById('newStockInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('addBtn').click();
        });

        // ============================================================
        // 14. OCR 识别
        // ============================================================
        const ocrBtn = document.getElementById('ocrBtn');
        const ocrFile = document.getElementById('ocrFile');
        let isOcrCanceled = false;

        ocrBtn.addEventListener('click', () => { ocrFile.click(); });

        ocrFile.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            e.target.value = '';

            const overlay = showOcrOverlay('正在识别图片…', '首次使用需下载 OCR 引擎，约 2MB');

            try {
                if (typeof Tesseract === 'undefined') {
                    throw new Error('OCR 引擎未加载，请检查网络');
                }

                const { data: { text } } = await Tesseract.recognize(file, 'eng', {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            updateOcrOverlay(`识别中… ${Math.round(m.progress * 100)}%`, '');
                        } else if (m.status) {
                            updateOcrOverlay(m.status, '');
                        }
                    }
                });

                const codes = extractStockCodes(text);
                if (codes.length === 0) {
                    updateOcrOverlay('❌ 未识别到有效股票代码', '请确保图片清晰且包含 6 位数字代码', true);
                    return;
                }

                updateOcrOverlay(`✅ 识别到 ${codes.length} 个代码`, codes.join(', '));
                let addedCount = 0;
                let dupCount = 0;
                for (const code of codes) {
                    if (window.addStock) {
                        const res = window.addStock(code);
                        if (res.added) addedCount++;
                        else if (res.reason === 'duplicate') dupCount++;
                    }
                }
                const msg = `已添加 ${addedCount} 个` + (dupCount ? `（${dupCount} 个已存在）` : '');
                setTimeout(() => {
                    hideOcrOverlay();
                    toast(msg);
                    populateStockSelect();
                    refreshStocks();
                }, 1200);
            } catch (err) {
                console.error(err);
                updateOcrOverlay('❌ 识别失败', err.message || '请重试', true);
            }
        });

        function extractStockCodes(text) {
            if (!text) return [];
            const normalized = text.replace(/[\s\n\r]+/g, ' ');
            const results = new Set();

            const prefixed = normalized.match(/\b([a-z]{2})\s*(\d{6})\b/gi) || [];
            for (const m of prefixed) {
                const [, prefix, num] = m.match(/([a-z]{2})\s*(\d{6})/i);
                const p = prefix.toLowerCase();
                if (['sh', 'sz', 'bj'].includes(p)) results.add(p + num);
            }

            const plain = normalized.match(/\b(\d{6})\b/g) || [];
            for (const num of plain) {
                if (/^[0-8]\d{5}$/.test(num)) results.add(num);
            }

            return Array.from(results).slice(0, 20);
        }

        function showOcrOverlay(msg, sub) {
            let ov = document.querySelector('.ocr-overlay');
            if (!ov) {
                ov = document.createElement('div');
                ov.className = 'ocr-overlay';
                ov.innerHTML = `
                        <div class="spinner"></div>
                        <div class="ocr-msg"></div>
                        <div class="ocr-sub"></div>
                        <button class="ocr-cancel">取消</button>
                    `;
                document.body.appendChild(ov);
                ov.querySelector('.ocr-cancel').addEventListener('click', () => {
                    hideOcrOverlay();
                    isOcrCanceled = true;
                });
            } else {
                ov.querySelector('.spinner').style.display = '';
            }
            ov.querySelector('.ocr-msg').textContent = msg;
            ov.querySelector('.ocr-sub').textContent = sub || '';
            ov.querySelector('.ocr-cancel').textContent = '取消';
            ov.style.display = 'flex';
            isOcrCanceled = false;
            return ov;
        }

        function updateOcrOverlay(msg, sub, hideSpinner) {
            const ov = document.querySelector('.ocr-overlay');
            if (!ov) return;
            ov.querySelector('.ocr-msg').textContent = msg;
            ov.querySelector('.ocr-sub').textContent = sub || '';
            if (hideSpinner) ov.querySelector('.spinner').style.display = 'none';
        }

        function hideOcrOverlay() {
            const ov = document.querySelector('.ocr-overlay');
            if (ov) ov.style.display = 'none';
        }

        // ============================================================
        // 15. 指数 ticker
        // ============================================================
        async function loadMarketData() {
            try {
                const codes = MARKET.map(toFullCode);
                mq = await fetchQuotesBatch(codes);
                renderMarketTicker();
            } catch (e) { console.warn('指数加载失败', e); }
        }

        function renderMarketTicker() {
            const track = document.getElementById('tickerTrack');
            if (!track) return;
            const items = [];
            MARKET.forEach(i => {
                const code = toFullCode(i);
                const d = mq[code];
                if (!d || !d.price) {
                    items.push(
                        `<span class="ticker-item flat"><span class="t-name">${i.name}</span><span class="t-price">--</span><span class="t-pct">--</span></span>`
                        );
                    return;
                }
                const cls = d.changePercent > 0 ? 'up' : (d.changePercent < 0 ? 'down' : 'flat');
                const sign = d.changePercent > 0 ? '+' : '';
                items.push(
                    `<span class="ticker-item ${cls}"><span class="t-name">${i.name}</span><span class="t-price">${d.price.toFixed(2)}</span><span class="t-pct">${sign}${d.changePercent.toFixed(2)}%</span></span>`
                    );
            });
            if (!items.length) { track.innerHTML = '<div class="ticker-loading">暂无指数数据</div>'; return; }
            track.innerHTML = items.join('') + items.join('');
        }

        // ============================================================
        // 16. 定时器
        // ============================================================
        function updateCdown() {
            document.getElementById('countdown').textContent = countdownSec + 's↻';
        }
        setInterval(() => {
            countdownSec--;
            if (countdownSec <= 0) countdownSec = 60;
            updateCdown();
        }, 1000);

        // ============================================================
        // 17. 错误兜底
        // ============================================================
        function _renderError(e) {
            try {
                const el = document.getElementById('stockList');
                if (el && !el.dataset.errored) {
                    el.dataset.errored = '1';
                    el.innerHTML = '<div style="padding:12px;background:#fff5f5;border:1px solid #feb2b2;border-radius:8px;color:#c53030;font-size:12px;font-family:monospace;white-space:pre-wrap;word-break:break-all;">⚠ JS 错误：' + (e
                        ?.message || e) + (e?.stack ? '\n' + e.stack.split('\n').slice(0, 3).join('\n') : '') + '</div>';
                }
            } catch {}
        }

        window.addEventListener('error', (ev) => _renderError(ev.error || ev.message));
        window.addEventListener('unhandledrejection', (ev) => _renderError(ev.reason));

        // ============================================================
        // 18. 暴露到全局（供其他模块使用）
        // ============================================================
        window.stockDataMap = stockDataMap;
        window.loadPortfolio = loadPortfolio;
        window.savePortfolio = savePortfolio;
        window.addPosition = addPosition;
        window.updatePosition = updatePosition;
        window.removePosition = removePosition;
        window.refreshPortfolioPrices = refreshPortfolioPrices;
        window.calcPortfolioStats = calcPortfolioStats;
        window.getRiskAdvice = getRiskAdvice;
        window.renderPortfolioPanel = renderPortfolioPanel;

        // ============================================================
        // 19. 初始化
        // ============================================================
        window.addEventListener('load', () => {
            // 确保 loadStocks 和 addStock 可用
            if (typeof loadStocks === 'undefined') {
                // 如果 app.js 未加载，提供默认实现
                window.loadStocks = function() {
                    try {
                        const raw = localStorage.getItem('stocks_v1');
                        if (!raw) return [];
                        return JSON.parse(raw);
                    } catch { return []; }
                };
                window.addStock = function(code) {
                    const list = window.loadStocks();
                    let c = code.toLowerCase().trim();
                    if (/^\d{6}$/.test(c)) {
                        const head = c[0];
                        if (c.startsWith('000') || c.startsWith('6') || c.startsWith('9') || c.startsWith('5')) c = 'sh' +
                            c;
                        else if (c.startsWith('399') || c.startsWith('1') || c.startsWith('0') || c.startsWith('3')) c =
                            'sz' + c;
                        else if (head === '4' || head === '8') c = 'bj' + c;
                        else c = 'sh' + c;
                    } else if (!/^([a-z]{2,3})\d{6}$/.test(c)) {
                        return { list, added: false, reason: 'invalid' };
                    }
                    if (list.some(s => s.code === c)) return { list, added: false, reason: 'duplicate' };
                    const m = c.startsWith('sh') ? 'sh' : c.startsWith('sz') ? 'sz' : 'bj';
                    const name = c.toUpperCase();
                    list.unshift({ code: c, name, market: m });
                    localStorage.setItem('stocks_v1', JSON.stringify(list));
                    return { list, added: true };
                };
                window.removeStock = function(code) {
                    const list = window.loadStocks().filter(s => s.code !== code);
                    localStorage.setItem('stocks_v1', JSON.stringify(list));
                    return list;
                };
            }

            // 初始化持仓面板
            populateStockSelect();
            renderPortfolioPanel();

            // 刷新自选股
            refreshStocks()
                .catch(e => _renderError(e));
            loadMarketData();

            // 定时刷新
            setInterval(() => {
                refreshStocks().catch(e => _renderError(e));
                // 同时刷新持仓价格
                refreshPortfolioPrices();
                renderPortfolioPanel();
            }, 60000);
            setInterval(loadMarketData, 60000);
            updateTimeDisplay();
            setInterval(updateTimeDisplay, 1000);

            // 暴露给外部
            window.refreshStocks = refreshStocks;
            window.renderStockCards = renderStockCards;
        });

        // 风控参数（从 risk.js 加载，如果没有则使用默认）
        const DEFAULT_RISK_LIMITS = {
            maxSinglePosition: 0.20,
            maxTotalPosition: 0.80,
            minCashReserve: 0.20,
            maxSingleLoss: 0.03,
            maxDailyLoss: 0.05,
            maxDrawdown: 0.15,
            stopLossRequired: true,
            requireMarketFilter: false,
        };
        if (typeof window.__riskLimits === 'undefined') {
            window.__riskLimits = DEFAULT_RISK_LIMITS;
        }

        console.log('📊 智能参谋已启动 · 持仓管理 + 风控联动');
        console.log('💡 提示：在自选股页面管理持仓，风控参数在个股详情页设置');
    </script>
</body>
