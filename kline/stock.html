<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>股票详情 · 实战参谋</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  /* ===== 浅色主题 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ----- 颜色变量 ----- */
  :root {
    --bg: #f0f4f8;           /* 页面背景 - 浅灰蓝 */
    --bg-2: #f7fafc;         /* 次级背景 */
    --surface: #ffffff;      /* 卡片背景 - 纯白 */
    --surface-2: #f7fafc;    /* 卡片内次级背景 */
    --line: rgba(0,0,0,0.08);        /* 分割线 - 浅色 */
    --line-2: rgba(0,0,0,0.15);
    --text: #1a202c;         /* 主文字 - 深灰 */
    --text-soft: #4a5568;    /* 次要文字 */
    --text-mute: #a0aec0;    /* 浅色文字 */
    --up: #e53e3e;           /* 上涨红（保持醒目） */
    --up-soft: rgba(229,62,62,0.12);
    --down: #38a169;         /* 下跌绿 */
    --down-soft: rgba(56,161,105,0.12);
    --flat: #718096;
    --accent: #3182ce;       /* 主色调 - 蓝色 */
    --accent-glow: rgba(49,130,206,0.25);
    --warn: #d69e2e;
  }

  body {
    font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1200px; margin: 0 auto; }

  /* 顶部导航 */
  .topnav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }
  .topnav .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 18px; color: var(--text); }
  .topnav .brand .logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #3182ce, #2b6cb0);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 700;
    font-size: 18px;
  }
  .topnav .back {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-soft);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: 30px;
    background: rgba(0,0,0,0.04);
    transition: 0.2s;
  }
  .topnav .back:hover { background: rgba(0,0,0,0.08); color: var(--text); }
  .topnav .back svg { width: 20px; height: 20px; }

  /* hero */
  .hero { margin-bottom: 24px; }
  .hero .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-mute);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .hero .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .hero h1 {
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    font-weight: 600;
    letter-spacing: -0.02em;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px;
    color: var(--text);
  }
  .hero h1 em { font-style: normal; font-weight: 400; color: var(--text-mute); font-size: 0.7em; }
  .hero .sub {
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }
  .hero .sub code { background: rgba(0,0,0,0.06); padding: 2px 8px; border-radius: 4px; }

  /* 卡片通用 */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px 20px;
    margin-bottom: 20px;
    transition: 0.2s;
  }
  .card h3 {
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    color: var(--text);
  }
  .card h3 svg { stroke: var(--accent); }

  .sec-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .sec-head h2 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .sec-head .tag {
    font-size: 11px;
    color: var(--text-mute);
    background: rgba(0,0,0,0.04);
    padding: 4px 12px;
    border-radius: 30px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  /* 股票信息卡片 */
  .stock-info {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .stock-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
    gap: 8px;
  }
  .stock-head .left { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .stock-head .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--text-mute);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stock-head .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .stock-head .price {
    font-family: 'DM Serif Display', serif;
    font-size: 36px;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1;
    color: var(--text);
  }
  .stock-head .meta { font-size: 12px; color: var(--text-mute); font-family: 'JetBrains Mono', monospace; }

  /* 信息网格 */
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border-radius: 14px;
    overflow: hidden;
  }
  .info-cell {
    background: var(--bg-2);
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .info-cell .k {
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--text-mute);
    text-transform: uppercase;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .info-cell .v {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    font-weight: 400;
    letter-spacing: -0.01em;
    line-height: 1.1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .info-cell .v.up { color: var(--up); }
  .info-cell .v.down { color: var(--down); }
  .info-cell .d {
    font-size: 10.5px;
    color: var(--text-soft);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .info-cell .d .up { color: var(--up); }
  .info-cell .d .down { color: var(--down); }
  .info-cell.draw-cell { grid-column: 1 / -1; }
  .info-cell.draw-cell .chart-wrap { position: relative; height: 120px; margin-top: 6px; }

  /* 价格分位条 */
  .quantile { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .quantile-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
    flex-wrap: wrap;
    gap: 4px;
  }
  .quantile-head .title {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-mute);
    text-transform: uppercase;
    font-weight: 500;
  }
  .quantile-head .current {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .quantile-bar {
    position: relative;
    height: 6px;
    background: linear-gradient(90deg, var(--down), var(--text-mute), var(--up));
    border-radius: 3px;
    margin: 6px 0 4px;
  }
  .quantile-bar .pin {
    position: absolute;
    top: -3px;
    width: 2px;
    height: 12px;
    background: var(--text);
    border-radius: 2px;
    transform: translateX(-1px);
    box-shadow: 0 0 6px rgba(0,0,0,0.2);
  }
  .quantile-meta {
    display: flex;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-mute);
  }

  /* 实战参谋信号卡 */
  .signal-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .signal-top {
    padding: 18px 20px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 20px;
    align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .verdict-badge {
    width: 80px;
    height: 80px;
    border-radius: 20px;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'DM Serif Display', serif;
    line-height: 1.05;
    text-align: center;
    padding: 0 4px;
    flex-shrink: 0;
  }
  .verdict-badge .main { font-size: 16px; font-weight: 500; letter-spacing: 0.04em; }
  .verdict-badge .sub { font-size: 9px; opacity: 0.85; margin-top: 2px; font-family: 'Outfit', sans-serif; }
  .verdict-badge.strong-buy { background: linear-gradient(135deg, #c53030, #e53e3e); }
  .verdict-badge.buy { background: linear-gradient(135deg, #dd6b20, #ed8936); }
  .verdict-badge.sell { background: linear-gradient(135deg, #2f855a, #48bb78); }
  .verdict-badge.strong-sell { background: linear-gradient(135deg, #276749, #38a169); }
  .verdict-badge.neutral { background: linear-gradient(135deg, #718096, #a0aec0); }

  .verdict-body h3 {
    font-family: 'Outfit', sans-serif;
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    letter-spacing: -0.005em;
    color: var(--text);
  }
  .verdict-body p {
    color: var(--text-soft);
    font-size: 12.5px;
    line-height: 1.55;
    margin-bottom: 4px;
  }
  .verdict-meta { font-size: 10.5px; color: var(--text-mute); font-family: 'JetBrains Mono', monospace; }
  .verdict-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }

  /* pill */
  .pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 30px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    background: rgba(0,0,0,0.04);
    color: var(--text-soft);
  }
  .pill.buy { background: rgba(229,62,62,0.15); color: var(--up); }
  .pill.sell { background: rgba(56,161,105,0.15); color: var(--down); }
  .pill.strong-buy { background: rgba(229,62,62,0.25); color: var(--up); }
  .pill.strong-sell { background: rgba(56,161,105,0.25); color: var(--down); }
  .pill.neutral { background: rgba(0,0,0,0.04); color: var(--text-mute); }

  /* 量能条 */
  .vol-strip {
    padding: 10px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px 16px;
    font-size: 12px;
    border-top: 1px solid var(--line);
    background: var(--bg-2);
  }
  .vol-strip .item { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .vol-strip .k {
    color: var(--text-mute);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .vol-strip .v {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .vol-strip .v.up { color: var(--up); }
  .vol-strip .v.down { color: var(--down); }
  .vol-strip .v.warn { color: var(--warn); }

  /* 仓位条 */
  .pos-strip {
    padding: 14px 20px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 16px;
    align-items: center;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
  }
  .pos-strip .k {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-mute);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .pos-bar {
    position: relative;
    height: 14px;
    background: var(--bg);
    border-radius: 7px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .pos-bar .fill {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    background: linear-gradient(90deg, var(--up), var(--warn));
    border-radius: 7px;
    transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 0 12px rgba(229,62,62,0.2);
  }
  .pos-bar .marker {
    position: absolute;
    top: -2px;
    width: 1px;
    height: 18px;
    background: var(--text-mute);
    opacity: 0.3;
  }
  .pos-strip .v {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
    min-width: 70px;
    text-align: right;
    color: var(--text);
  }

  /* 风险卡 & 量价警告 */
  .risk-card {
    margin: 0 20px 16px;
    padding: 14px 16px;
    background: rgba(229,62,62,0.04);
    border: 1px solid rgba(229,62,62,0.15);
    border-left: 3px solid var(--up);
    border-radius: 10px;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text-soft);
  }
  .risk-card .label {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--up);
    text-transform: uppercase;
    font-weight: 600;
    margin-bottom: 4px;
    display: block;
  }
  .vp-alert {
    margin: 0 20px 12px;
    padding: 12px 16px;
    background: rgba(229,62,62,0.04);
    border: 1px solid rgba(229,62,62,0.15);
    border-left: 3px solid var(--up);
    border-radius: 10px;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--text-soft);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .vp-alert .icon { font-size: 16px; flex-shrink: 0; }
  .vp-alert.good { background: rgba(56,161,105,0.05); border-color: rgba(56,161,105,0.2); border-left-color: var(--down); }
  .vp-alert.good .icon { color: var(--down); }
  .vp-alert.warn { background: rgba(214,158,46,0.05); border-color: rgba(214,158,46,0.2); border-left-color: var(--warn); }
  .vp-alert.warn .icon { color: var(--warn); }

  /* 胜率行 */
  .winrate-row {
    display: flex;
    gap: 12px;
    padding: 0 20px 16px;
    font-size: 11px;
    color: var(--text-mute);
    font-family: 'JetBrains Mono', monospace;
    flex-wrap: wrap;
  }
  .winrate-row .item {
    background: var(--bg-2);
    padding: 8px 12px;
    border-radius: 8px;
    flex: 1;
    border: 1px solid var(--line);
    min-width: 100px;
  }
  .winrate-row .v {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    display: block;
    font-family: 'Outfit', sans-serif;
    letter-spacing: -0.01em;
    margin-top: 2px;
  }
  .winrate-row .v.up { color: var(--up); }
  .winrate-row .v.down { color: var(--down); }
  .winrate-row .v.warn { color: var(--warn); }

  /* 指标分组 */
  .indicators-section { padding: 14px 20px 18px; }
  .ig-group { margin-top: 14px; }
  .ig-group:first-child { margin-top: 0; }
  .ig-group .title {
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-mute);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ig-group .title .count {
    color: var(--text-mute);
    font-weight: 400;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.05em;
    margin-left: auto;
    font-size: 9px;
  }

  .ig-row {
    display: grid;
    grid-template-columns: 56px 1fr 50px 56px;
    align-items: center;
    padding: 5px 0;
    font-size: 11.5px;
    gap: 8px;
    border-bottom: 1px solid var(--line);
  }
  .ig-row:last-child { border-bottom: 0; }
  .ig-row .name {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text);
    font-size: 11px;
  }
  .ig-row .val {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-soft);
    text-align: right;
    font-size: 11px;
  }
  .trend-bar {
    position: relative;
    height: 5px;
    background: var(--bg);
    border-radius: 3px;
  }
  .trend-bar .center {
    position: absolute;
    left: 50%;
    top: -1px;
    bottom: -1px;
    width: 1px;
    background: var(--text-mute);
    opacity: 0.3;
  }
  .trend-bar .fill {
    position: absolute;
    top: 0;
    bottom: 0;
    border-radius: 3px;
    transition: all 0.3s;
  }
  .trend-bar .fill.above { left: 50%; background: var(--up); }
  .trend-bar .fill.below { right: 50%; background: var(--down); }

  .osc-bar {
    position: relative;
    height: 7px;
    background: var(--bg);
    border-radius: 4px;
    overflow: hidden;
  }
  .osc-bar .gradient {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, var(--down), var(--text-mute), var(--up));
    opacity: 0.3;
  }
  .osc-bar .pointer {
    position: absolute;
    top: -2px;
    width: 2px;
    height: 11px;
    background: var(--text);
    border-radius: 2px;
    box-shadow: 0 0 6px rgba(0,0,0,0.2);
    transition: left 0.3s;
  }
  .osc-bar.bipolar-zero .fill.pos { left: 50%; background: var(--up); }
  .osc-bar.bipolar-zero .fill.neg { right: 50%; background: var(--down); }

  /* 枢轴点表格 */
  .pivot-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .pivot-table th, .pivot-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .pivot-table th {
    font-weight: 500;
    color: var(--text-mute);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .pivot-table td.num { font-family: 'JetBrains Mono', monospace; text-align: right; }
  .pivot-table tr.zen { border-top: 2px solid var(--text); background: var(--bg-2); }
  .pivot-table .pos-arrow { color: var(--up); font-size: 10px; margin-left: 4px; }
  .pivot-table .neg-arrow { color: var(--down); font-size: 10px; margin-left: 4px; }

  /* 基本面 */
  .fundamental {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 10px;
  }
  .f-cell {
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
  }
  .f-cell .k {
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--text-mute);
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .f-cell .v {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .f-cell .d {
    font-size: 9px;
    color: var(--text-mute);
    margin-top: 2px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* 图表容器 */
  #mainChartCard { position: relative; padding: 16px; }
  .chart { width: 100%; height: 460px; }
  .fs-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 4px 12px;
    background: rgba(255,255,255,0.8);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 11px;
    color: var(--text-soft);
    cursor: pointer;
    z-index: 10;
    backdrop-filter: blur(8px);
    transition: 0.2s;
    font-family: 'Outfit', sans-serif;
  }
  .fs-btn:hover { color: var(--text); border-color: var(--accent); }

  /* 分批止盈止损卡片 */
  .tp-sl-card .tp-grid {
    display: grid;
