// ★★★★★ 修复核心：增强型 fetchKLine ★★★★★
// =====================================================
async function fetchKLine(code, count = 120) {
    // 1. 先从 HistoryTable 读取缓存
    try {
        if (window.HistoryTable && typeof HistoryTable.getRecent === 'function') {
            const cached = HistoryTable.getRecent(code, count);
            if (cached && cached.length >= 20) {
                return cached.map(r => ({
                    date: r.date,
                    open: r.open,
                    close: r.close,
                    high: r.high,
                    low: r.low,
                    volume: r.volume,
                }));
            }
        }
    } catch (e) { /* 忽略 */ }

    // 2. 尝试多个数据源（腾讯、新浪）
    const sources = [
        {
            // 腾讯新接口（带 _var 避免跨域问题）
            url: `https://web.ifzq.gtimg.cn/appstock/app/newfqkline/get?_var=kline_dayqfq&param=${code},day,,,${count},qfq`,
            parse: (text) => {
                const jsonStr = text.includes('=') ? text.substring(text.indexOf('=') + 1) : text;
                const data = JSON.parse(jsonStr);
                const key = Object.keys(data.data || {})[0];
                return data.data?.[key]?.qfqday || data.data?.[key]?.day || [];
            }
        },
        {
            // 新浪备用
            url: `https://quotes.sina.cn/cn/api/json_v2.php/IFengService.getKLineData?symbol=${code}&scale=240&ma=no&datalen=${count}`,
            parse: (json) => {
                if (!Array.isArray(json) || !json.length) return [];
                return json.map(row => ({
                    date: row.day,
                    open: +row.open,
                    close: +row.close,
                    high: +row.high,
                    low: +row.low,
                    volume: +row.volume || 0,
                }));
            }
        }
    ];

    for (const src of sources) {
        try {
            const resp = await fetch(src.url, { signal: AbortSignal.timeout(8000) });
            if (!resp.ok) continue;
            const text = await resp.text();
            let raw;
            if (src.url.includes('sina')) {
                raw = JSON.parse(text);
            } else {
                raw = src.parse(text);
            }
            // 统一转换成标准数组
            let rows = [];
            if (Array.isArray(raw) && raw.length && typeof raw[0] === 'object') {
                // 新浪格式直接返回对象数组
                rows = raw;
            } else if (Array.isArray(raw) && raw.length && Array.isArray(raw[0])) {
                // 腾讯格式返回二维数组
                rows = raw.map(row => ({
                    date: row[0],
                    open: +row[1],
                    close: +row[2],
                    high: +row[3],
                    low: +row[4],
                    volume: +row[5],
                }));
            }
            if (rows.length >= 20) {
                return rows.filter(r => r.date && !isNaN(r.open));
            }
        } catch (e) {
            console.warn(`[fetchKLine] ${src.url} 失败:`, e);
        }
    }

    // 3. 所有网络请求失败，返回空数组
    return [];
}

// =====================================================
// ★★★★★ 修复核心：初始化 HistoryTable（若未定义） ★★★★★
// =====================================================
if (typeof HistoryTable === 'undefined') {
    window.HistoryTable = {
        _data: {},
        getRecent(code, count) {
            const rows = this._data[code] || [];
            return rows.slice(-count);
        },
        appendRows(rows) {
            if (!rows.length) return;
            const code = rows[0].code;
            if (!this._data[code]) this._data[code] = [];
            const existingDates = new Set(this._data[code].map(r => r.date));
            for (const row of rows) {
                if (!existingDates.has(row.date)) {
                    this._data[code].push(row);
                    existingDates.add(row.date);
                }
            }
            this._data[code].sort((a, b) => a.date.localeCompare(b.date));
            try {
                localStorage.setItem('history_table', JSON.stringify(this._data));
            } catch (e) { /* 忽略 */ }
        },
        load() {
            try {
                const raw = localStorage.getItem('history_table');
                if (raw) this._data = JSON.parse(raw);
            } catch (e) { /* 忽略 */ }
        }
    };
    HistoryTable.load();
}

// ★★★★★ 修复核心：增强 initStock 函数 ★★★★★
// =====================================================
async function initStock(code) {
    const root = document.getElementById('root');
    root.innerHTML = `<div class="loading">📊 加载数据中…</div>`;

    try {
        // 自动补全前缀（如 601288 → sh601288）
        let fullCode = code;
        if (/^\d{6}$/.test(code)) {
            const head = code[0];
            if (head === '6' || head === '9' || head === '5') fullCode = 'sh' + code;
            else if (head === '0' || head === '1' || head === '3') fullCode = 'sz' + code;
            else if (head === '4' || head === '8') fullCode = 'bj' + code;
            else fullCode = 'sh' + code;
        }

        let data = await fetchKLine(fullCode, 120);

        // 如果数据不足，再次尝试从 HistoryTable 缓存读（可能是历史已存）
        if (!data || data.length < 20) {
            if (window.HistoryTable && typeof HistoryTable.getRecent === 'function') {
                const cached = HistoryTable.getRecent(fullCode, 120);
                if (cached && cached.length >= 20) {
                    data = cached.map(r => ({
                        date: r.date,
                        open: r.open,
                        close: r.close,
                        high: r.high,
                        low: r.low,
                        volume: r.volume,
                    }));
                }
            }
        }

        // 仍然不足 → 显示友好错误
        if (!data || data.length < 20) {
            root.innerHTML = `
                <div class="empty" style="padding:60px 20px;text-align:center;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 8v4M12 16h.01"/>
                    </svg>
                    <p style="margin-top:12px;font-size:16px;color:var(--text);">⚠️ K线数据不足</p>
                    <p style="font-size:13px;color:var(--text-mute);">请检查网络，或确保该股票有历史数据</p>
                    <br>
                    <button onclick="location.reload()" style="padding:8px 24px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;">🔄 重试</button>
                    <br><br>
                    <a href="index.html" style="color:var(--accent);text-decoration:underline;">← 返回自选股</a>
                </div>
            `;
            return;
        }

        // ------ 数据就绪，执行原有计算和渲染 ------
        const closes = data.map(d => d.close);
        const opens  = data.map(d => d.open);
        const highs  = data.map(d => d.high);
        const lows   = data.map(d => d.low);
        const vols   = data.map(d => d.volume);
        const prev = data[data.length - 2] || data[data.length - 1];
        const pivots = calcPivots(prev.high, prev.low, prev.close);
        let sum = summarize(closes, highs, lows, opens, vols, pivots, null);
        // 若 summarize 未定义，使用 simpleSignal 作为后备
        if (typeof sum === 'undefined' || !sum) {
            const sig = simpleSignal(closes, highs, lows);
            sum = { ...sig, netScore: sig.score, trend: '中性', pivotLabel: '—', vpLabel: '—', backtest: { buySamples: 0, buyWinRate: 0, buyAvgRet: 0, lookback: 20, holdDays: 5 } };
        }
        const currentPrice = closes[closes.length - 1];
        const prevClose = data[data.length - 2] ? data[data.length - 2].close : currentPrice;
        const change = currentPrice - prevClose;
        const changePct = (change / prevClose) * 100;

        // 写入历史表
        try {
            const stock = (loadStocks().find(s => s.code === fullCode) || { code: fullCode, name: fullCode });
            const rows = data.map((k, i) => {
                const p = i > 0 ? data[i - 1] : k;
                return {
                    date: k.date,
                    code: fullCode,
                    name: stock.name,
                    open: k.open,
                    high: k.high,
                    low: k.low,
                    close: k.close,
                    change: k.close - p.close,
                    changePct: ((k.close - p.close) / p.close) * 100,
                    volume: k.volume,
                    amount: k.volume * (k.high + k.low + k.close) / 3,
                };
            });
            const lastRow = rows[rows.length - 1];
            if (lastRow) {
                lastRow.overall = sum.overall;
                lastRow.position = sum.position;
                lastRow.confidence = sum.confidence;
                lastRow.netScore = sum.netScore;
                lastRow.trend = sum.trend;
                lastRow.vpLabel = sum.vpLabel;
                lastRow.stopLoss = sum.tpSl && sum.tpSl.stopLoss;
                lastRow.takeProfitR1 = sum.tpSl && sum.tpSl.takeProfitLevels && sum.tpSl.takeProfitLevels[0] && sum.tpSl.takeProfitLevels[0].price;
                lastRow.updatedAt = new Date().toISOString();
            }
            HistoryTable.appendRows(rows);
        } catch (e) { console.warn('写历史表失败', e); }

        // 风控整合（略，同原）
        // ... 此处保留原有的风控代码（为节省篇幅省略，但实际使用时请保留完整）

        renderPage(data, sum, pivots, currentPrice, change, changePct, null);
        drawChart(data, sum, pivots);
        bindNameEditor(fullCode);
        bindFullscreen();
        renderQuantMetrics(data, sum);

        // 更新数据源标识
        const badge = document.getElementById('dataBadge');
        if (badge) badge.textContent = '实时';

    } catch (err) {
        console.error('[initStock] 异常:', err);
        root.innerHTML = `
            <div class="empty" style="padding:60px 20px;text-align:center;color:var(--up);">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M15 9l-6 6M9 9l6 6"/>
                </svg>
                <p style="margin-top:12px;font-size:16px;">加载失败</p>
                <p style="font-size:13px;color:var(--text-mute);">${err.message || '未知错误'}</p>
                <br>
                <button onclick="location.reload()" style="padding:8px 24px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;">🔄 重试</button>
            </div>
        `;
    }
}

// 启动：从 URL 获取 code 并初始化

function getCodeFromURL() {
    const params = new URLSearchParams(window.location.search);
    let code = params.get('code');
    if (!code) {
        const path = window.location.pathname.split('/').pop();
        if (path && path.includes('.')) code = path.split('.')[0];
    }
    return code;
}
