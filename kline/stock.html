<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>股票详情 · 实战参谋</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  /* 原样式全部保留，此处省略以节省篇幅，实际使用时请复制之前的完整样式 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0e1a; color: #e2e8f0; font-family: 'Outfit', sans-serif; padding: 12px; }
  /* 建议直接使用之前提供的完整 CSS 代码 */
</style>
</head>
<body>
<div class="wrap">
  <nav class="topnav">
    <div class="brand"><div class="logo">K</div><span>K-Line · 实战参谋</span></div>
    <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回自选股</a>
  </nav>
  <div id="root"><div class="loading">加载中…</div></div>
  <footer class="foot"><span>SOURCE · web.ifzq.gtimg.cn</span><span id="footTime">GEN · Mavis</span></footer>
</div>
<script src="app.js"></script>
<script>
const code = getCodeFromURL();
if (!code) {
  document.getElementById('root').innerHTML = `<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>缺少股票代码 · <a href="index.html" style="color:var(--accent)">返回添加</a></div>`;
} else {
  initStock(code);
}

// ============== 优化后的 initStock ==============
async function initStock(code) {
  document.getElementById('root').innerHTML = `
    <div class="loading" style="padding:40px 0;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:16px;">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2v4M12 22v-4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M22 12h-4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
        </svg>
        <span style="color:var(--text-soft);font-size:14px;">加载 K 线数据…</span>
      </div>
    </div>
  `;

  let data, basic = null;
  try {
    data = await fetchKLine(code, 120); // 减少默认请求量
  } catch (e) {
    document.getElementById('root').innerHTML = `<div class="empty" style="color:var(--up)">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
      数据加载失败: ${e.message}<br><br>
      <a class="btn" href="index.html" style="color:var(--accent);text-decoration:underline">返回自选股</a>
    </div>`;
    return;
  }

  const closes = data.map(d => d.close);
  const opens  = data.map(d => d.open);
  const highs  = data.map(d => d.high);
  const lows   = data.map(d => d.low);
  const vols   = data.map(d => d.volume);
  const prev = data[data.length - 2] || data[data.length - 1];
  const pivots = calcPivots(prev.high, prev.low, prev.close);
  const sum = summarize(closes, highs, lows, opens, vols, pivots);
  const currentPrice = closes[closes.length - 1];
  const prevClose = data[data.length - 2] ? data[data.length - 2].close : currentPrice;
  const change = currentPrice - prevClose;
  const changePct = (change / prevClose) * 100;

  // 先渲染（基本面占位）
  renderPage(data, sum, pivots, currentPrice, change, changePct, null);
  drawChart(data, sum, pivots);
  bindNameEditor(code);
  bindFullscreen();

  // 异步加载基本面
  try {
    basic = await fetchBasic(code);
    const fundContainer = document.getElementById('fundamentals');
    if (basic && (basic.pe || basic.pb || basic.totalCap)) {
      fundContainer.innerHTML = `
        <div class="f-cell"><div class="k">PE(动)</div><div class="v">${basic.pe ? basic.pe.toFixed(2) : '—'}</div><div class="d">市盈率</div></div>
        <div class="f-cell"><div class="k">PB</div><div class="v">${(basic.pb && basic.pb > 0) ? basic.pb.toFixed(2) : '—'}</div><div class="d">市净率</div></div>
        <div class="f-cell"><div class="k">总市值</div><div class="v">${basic.totalCap ? (basic.totalCap/10000).toFixed(2) + '万亿' : (basic.totalCap ? basic.totalCap.toFixed(0)+'亿' : '—')}</div><div class="d">${basic.totalCap >= 10000 ? '≥1万亿' : '市值'}</div></div>
        <div class="f-cell"><div class="k">换手率</div><div class="v">${basic.turnover ? basic.turnover.toFixed(2)+'%' : '—'}</div><div class="d">当日</div></div>
        <div class="f-cell"><div class="k">52周高</div><div class="v">${basic.high52w ? basic.high52w.toFixed(2) : '—'}</div><div class="d">最高价</div></div>
        <div class="f-cell"><div class="k">52周低</div><div class="v">${basic.low52w ? basic.low52w.toFixed(2) : '—'}</div><div class="d">最低价</div></div>
        <div class="f-cell"><div class="k">涨停</div><div class="v" style="color:var(--up)">${basic.upperLimit ? basic.upperLimit.toFixed(2) : '—'}</div><div class="d">+10%</div></div>
        <div class="f-cell"><div class="k">跌停</div><div class="v" style="color:var(--down)">${basic.lowerLimit ? basic.lowerLimit.toFixed(2) : '—'}</div><div class="d">-10%</div></div>
      `;
    } else {
      fundContainer.innerHTML = `<div style="grid-column:1/-1;color:var(--text-mute);font-size:12px;text-align:center;padding:20px 0">该标的无基本面数据(指数/ETF/基金) · 仅技术面参考</div>`;
    }
    updateVolStrip(basic, sum);
  } catch {}

  function updateVolStrip(basic, sum) {
    const strip = document.getElementById('volStrip');
    if (!strip) return;
    const volRatio = basic && basic.volRatio;
    const turnover = basic && basic.turnover;
    strip.innerHTML = `
      <div class="item"><span class="k">当日量比</span><span class="v ${volRatio > 1.5 ? 'up' : volRatio < 0.7 ? 'down' : ''}">${volRatio ? volRatio.toFixed(2) : '—'}</span></div>
      <div class="item"><span class="k">换手率</span><span class="v">${turnover ? turnover.toFixed(2) + '%' : '—'}</span></div>
      <div class="item"><span class="k">OBV 方向</span><span class="v ${sum.obvInfo.direction==='up'?'up':sum.obvInfo.direction==='down'?'down':''}">${sum.obvInfo.direction==='up'?'资金流入':sum.obvInfo.direction==='down'?'资金流出':'持平'}</span></div>
      <div class="item"><span class="k">VOL 5/10</span><span class="v ${sum.volaRatio>1.3?'up':sum.volaRatio<0.7?'down':''}">${sum.volaRatio.toFixed(2)}</span></div>
      <div class="item"><span class="k">量价信号</span><span class="v ${sum.vpScore>=1?'up':sum.vpScore<=-1?'down':''}">${sum.vpLabel}</span></div>
    `;
  }
}

// ============== 以下函数（renderPage, drawChart, bindNameEditor, bindFullscreen, findName, updateName, getTypeByCode, pillFor, typeLabel）必须保留原样 ==============
// 由于篇幅，此处省略具体实现，实际使用时请从原文件完整复制这些函数。
// 注意：renderPage 函数中会用到 sum.tpSl 等，请确保其完整。
</script>
</body>
</html>
